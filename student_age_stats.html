<style>
/* ===== 🎨 Theme: Light ===== */
:root{
  --app-bg:#f8fafc;--tb-bg:rgba(255,255,255,.96);--tb-border:#e2e8f0;--card:#fff;--text:#0f172a;--muted:#64748b;
  --in-bg:#fff;--in-border:#cbd5e1;--focus:#0891b2;--grp:#f1f5f9;--sh:0 4px 16px rgba(15,23,42,.06);
  --pop-bg:#ffffff;--pop-line:#e2e8f0;--chip:#f1f5f9;--chip-hover:#e2e8f0;--accent:#0891b2;--accent-soft:rgba(8,145,178,.12);
  --pop-shadow:0 18px 44px rgba(15,23,42,.20);
  --pw:297mm;--ph:210mm;--mg:5mm;--fs:1;--rowh:auto;color-scheme:light}
/* ===== 🌙 Theme: Dark ===== */
[data-theme="dark"]{
  --app-bg:#090e17;--tb-bg:rgba(15,23,42,.95);--tb-border:#1e293b;--card:#111e33;--text:#f8fafc;--muted:#9aa3b2;
  --in-bg:#162642;--in-border:#233f66;--focus:#22d3ee;--grp:#0e1a2d;--sh:0 8px 24px rgba(0,0,0,.45);
  --pop-bg:#25282e;--pop-line:#3a3f48;--chip:#33363d;--chip-hover:#3e424a;--accent:#0894b3;--accent-soft:rgba(34,211,238,.14);
  --pop-shadow:0 18px 48px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;background:var(--app-bg);color:var(--text);font-family:'Battambang',sans-serif;padding-bottom:50px;overflow-x:auto;transition:background .25s,color .25s}

.auth-wrapper{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:30px 20px}
.auth-card{background:var(--card);border:1.5px solid var(--tb-border);border-radius:24px;padding:40px 28px;max-width:440px;width:100%;box-shadow:var(--sh)}
.auth-card h2{font-size:18px;margin-bottom:8px;color:#ef4444}
.auth-card p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px}

/* ===== Toolbar ===== */
.toolbar{position:sticky;top:0;z-index:1000;background:var(--tb-bg);backdrop-filter:blur(14px);padding:10px 16px;display:none;flex-direction:column;gap:8px;box-shadow:var(--sh);border-bottom:1.5px solid var(--tb-border);margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{background:var(--grp);border:1px solid var(--tb-border);border-radius:10px;padding:4px 8px;display:inline-flex;align-items:center;gap:6px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.fc{padding:5px 8px;font-family:'Kantumruy Pro','Battambang',sans-serif;font-size:12.5px;font-weight:600;border:1.5px solid var(--in-border);border-radius:8px;outline:none;background:var(--in-bg);color:var(--text);height:32px}
.fc:focus{border-color:var(--focus)}
.btn{padding:5px 12px;font-family:'Battambang',sans-serif;font-size:12.5px;font-weight:700;border-radius:8px;border:1px solid var(--tb-border);cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;white-space:nowrap;background:var(--grp);color:var(--text)}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#0891b2,#2563eb);color:#fff;border-color:transparent}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent}
.btn-login{background:linear-gradient(135deg,#0284c7,#7c3aed);color:#fff;border:none;padding:10px 24px;height:auto;font-size:13.5px;border-radius:12px;text-decoration:none}
.date-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:4px 10px;font-family:'Battambang',sans-serif;font-size:13px;color:var(--text);background:var(--in-bg);border:1.5px solid var(--in-border);border-radius:8px;cursor:pointer;white-space:nowrap}
.date-btn i{color:var(--muted)}
.date-btn.empty span{color:var(--muted)}
.date-btn.open{border-color:var(--focus)}

/* ===== Popover (date + page setup) ===== */
.pop{display:none;position:fixed;z-index:2500;background:var(--pop-bg);color:var(--text);border:1px solid var(--pop-line);border-radius:16px;box-shadow:var(--pop-shadow);overflow:auto;font-family:'Battambang',sans-serif}
.pop select{font-family:'Battambang',sans-serif;font-size:15px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--pop-line);background:var(--chip);color:var(--text);outline:none;flex:1;min-width:0}
#dpPop{width:min(340px,calc(100vw - 16px));padding:14px}
.dp-top{display:flex;gap:8px;margin-bottom:10px}
.dp-title{text-align:center;font-weight:700;font-size:14px;margin:6px 0 8px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-wd{font-size:12px;color:var(--muted);padding:6px 0}
.dp-day{height:38px;border:none;background:transparent;color:var(--text);font-family:'Battambang',sans-serif;font-size:14px;border-radius:9px;cursor:pointer}
.dp-day:hover{background:var(--chip-hover)}
.dp-day.out{color:var(--muted);opacity:.45}
.dp-day.today{background:var(--chip);font-weight:700}
.dp-day.sel{background:var(--accent);color:#fff;font-weight:700;opacity:1}
.dp-foot{display:flex;justify-content:space-between;border-top:1px solid var(--pop-line);margin-top:8px;padding-top:10px;font-size:13px}
.dp-foot a{color:var(--accent);cursor:pointer;font-weight:700}
.dp-foot a.clr{color:var(--muted)}

#pgPop{width:min(430px,calc(100vw - 16px));padding:18px 18px 8px}
.pg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pg-head h3{font-size:17px}
.pg-reset{background:none;border:none;color:var(--muted);font-family:'Battambang',sans-serif;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pg-sec{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:14px 0 10px}
.pg-sec hr{flex:1;border:none;border-top:1px solid var(--pop-line)}
.opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px 4px;background:var(--chip);color:var(--text);border:1.5px solid transparent;border-radius:12px;font-family:'Battambang',sans-serif;font-size:13.5px;cursor:pointer}
.opt small{font-size:12px;color:var(--muted)}
.opt b{font-family:'Kantumruy Pro',sans-serif;font-size:15px}
.opt.on{background:var(--accent);border-color:#22d3ee;color:#fff}
.opt.on small{color:rgba(255,255,255,.85)}
.ico-p,.ico-l{display:block;border:2px solid currentColor;border-radius:3px}
.ico-p{width:11px;height:17px}.ico-l{width:17px;height:11px}
.step-row{display:flex;align-items:center;gap:8px;margin:10px 0}
.step-row>span:first-child{width:62px;font-size:14px}
.step-row>small{font-size:12.5px;color:var(--muted);flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border:none;border-radius:10px;background:var(--chip);color:var(--text);font-size:18px;cursor:pointer}
.stepper button:active{transform:scale(.94)}
.stepper .val{min-width:104px;height:38px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;padding:0 8px}
.stepper .val em{font-style:normal;color:var(--muted);font-weight:400;font-size:13px}
.stepper .val.auto{color:var(--muted);font-weight:400;font-size:13px}
.pg-info{border-top:1px solid var(--pop-line);margin-top:12px;padding:6px 0 10px}
.pg-info label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
.pg-info .fc{width:100%}
.pg-info .chk{display:flex;align-items:center;gap:8px;color:var(--text);margin-top:12px;cursor:pointer;font-size:13px}

/* ===== Custom select + month/year picker (Battambang) ===== */
.cs-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:150px;font-family:'Battambang',sans-serif!important;font-weight:400!important;font-size:13.5px!important;cursor:pointer;text-align:left}
.cs-btn i{font-size:11px;color:var(--muted)}
#selPop{padding:6px;min-width:180px}
.sel-item{padding:10px 14px;font-size:14.5px;border-radius:9px;cursor:pointer;font-family:'Battambang',sans-serif;color:var(--text)}
.sel-item:hover{background:var(--chip-hover)}
.sel-item.on{background:var(--accent);color:#fff;font-weight:700}
.dp-sel{flex:1;min-width:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--pop-line);background:var(--chip);color:var(--text);border-radius:10px;font-family:'Battambang',sans-serif;font-size:15px;cursor:pointer}
.dp-sel i{font-size:11px;color:var(--muted)}
.dp-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:290px;overflow:auto;position:relative}
.dp-pick button{height:42px;border:none;border-radius:10px;background:var(--chip);color:var(--text);font-family:'Battambang',sans-serif;font-size:14px;cursor:pointer}
.dp-pick button.on{background:var(--accent);color:#fff;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;z-index:3000;display:none;border:1px solid #334155}

/* ===== ក្រដាសរបាយការណ៍ ===== */
.sheet-wrap{display:flex;justify-content:center;transform-origin:top center}
.sheet{width:var(--pw);height:calc(var(--ph) - .6mm);background:#fff;color:#000;padding:var(--mg);box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;flex-shrink:0;font-family:'Battambang',sans-serif;font-size:calc(13.5px * var(--fs));position:relative}
.moul{font-family:'Moul',serif;font-weight:400}
.kingdom{text-align:center;font-size:1.185em;line-height:1.8}
.motto{text-align:center;font-size:.96em;line-height:1.8}
.divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 6px}
.divider span{width:60px;height:1px;background:#000}
.hdr-left{font-size:.96em;line-height:1.7;margin-top:6px}
.title{text-align:center;font-size:1.56em;margin-top:8px;line-height:1.7}
.subtitle{text-align:center;margin:2px 0 .75em}
table.stat{width:100%;border-collapse:collapse;table-layout:fixed}
table.stat th,table.stat td{border:1px solid #000;padding:.5em .3em;text-align:center}
table.stat th{background:#eef2ff;font-weight:700}
table.stat tbody td{height:var(--rowh)}
table.stat td.tot{background:#f3f6ff;font-weight:700}
table.stat td.rm{text-align:left;font-size:.89em;padding:.3em .6em;line-height:1.5}
.foot{display:flex;justify-content:space-between;align-items:flex-start;margin-top:1em}
.sig-l{text-align:center;min-width:18em;line-height:1.8}
.sig-r{text-align:center;min-width:28em;line-height:1.8}
.sig-r .role{color:#1d4ed8}
.sig-space{height:4.7em}
.sig-name{color:#1d4ed8;font-family:'Moul',serif;font-size:.96em}

@media screen and (max-width:768px){.fc,.btn,.date-btn{height:28px;font-size:11.5px;padding:3px 6px}.toolbar{padding:8px 10px}}

@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important;overflow:visible!important}
  .toolbar,.auth-wrapper,.toast,.pop{display:none!important}
  .sheet-wrap{zoom:1!important;transform:none!important;display:block!important}
  .sheet{box-shadow:none!important;margin:0!important;break-after:avoid;page-break-after:avoid}
  .sheet,.sheet *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
    .cal-popup-backdrop { display: none; position: fixed; inset: 0; z-index: 2900; background: rgba(0,0,0,0.5); }

      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);

    .cal-btn-today, .cal-btn-clear, .cal-btn-close { background: transparent; border: none; font-size: 13px; font-weight: 800; cursor: pointer; padding: 6px 10px; border-radius: 8px; }
.cal-popup-backdrop{z-index:2900}.khmer-cal-popup{z-index:3000;font-family:'Battambang',sans-serif}.khmer-cal-popup *{font-family:'Battambang',sans-serif}.khmer-cal-popup .cal-month{font-family:'Moul',serif}.khmer-cal-popup i.fa-solid{font-family:'Font Awesome 6 Free'}
.date-btn .dbadge{white-space:nowrap}
@media print{.khmer-cal-popup,.cal-popup-backdrop{display:none!important}}
.sig-l.dir{margin-top:2.2em}
</style>

<script>
(function(){const R=document.documentElement;let t='dark';try{const u=new URLSearchParams(location.search).get('theme');let p=null;try{if(window.parent&&window.parent!==window)p=window.parent.document.documentElement.getAttribute('data-theme')}catch(e){}
t=u||p||localStorage.getItem('krou_theme_manual')||R.getAttribute('data-theme')||'dark'}catch(e){}R.setAttribute('data-theme',t==='light'?'light':'dark');
function setP(v){if(/^#[0-9a-fA-F]{6}$/.test(v||''))R.style.setProperty('--primary',v)}
try{setP(new URLSearchParams(location.search).get('primary'))}catch(e){}
try{const pr=window.parent&&window.parent!==window&&window.parent.document.documentElement.style.getPropertyValue('--primary');if(pr)setP(pr.trim())}catch(e){}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='THEME_CHANGE'){if(e.data.theme)R.setAttribute('data-theme',e.data.theme==='light'?'light':'dark');setP(e.data.primary)}});
window.addEventListener('storage',e=>{if(e.key==='krou_theme_manual'&&e.newValue)R.setAttribute('data-theme',e.newValue==='light'?'light':'dark')});})();
</script>
<style id="tbGlass">

:root{--primary:#0284c7}

.toolbar{top:8px!important;margin:8px 10px 14px!important;padding:8px 10px!important;border:1px solid var(--tb-line)!important;border-radius:20px;background:linear-gradient(120deg,var(--tb-1),var(--tb-2))!important;box-shadow:0 6px 18px color-mix(in srgb,var(--primary) 14%,transparent)!important;gap:6px 8px!important}
@media(min-width:721px){.toolbar{flex-direction:row!important;flex-wrap:wrap!important;align-items:center}.toolbar .row{display:contents}}

.btn,.date-btn{background:var(--pillbg);border:1px solid var(--tb-line)}
.btn-primary{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 70%,#000))!important;border-color:transparent!important;color:#fff}

.pill:hover,.btn:hover,.date-btn:hover{border-color:var(--primary)}

</style>

<body>

<div class="auth-wrapper" id="authDenied">
  <div class="auth-card">

<div class="toolbar" id="toolbar">

    const numberNewYearDay = newYearInfo.newYearsDaySotins[0].angsar === 0 ? 4 : 3;
    // Use April 17 as epoch and work backwards
    const epochLerngSakGreg = { year: ceYear, month: 4, day: 17 };
    // IMPORTANT: prevent recursion by passing isSearching=true (or any flag that skips Era check)

    const khEpoch = gregorianToKhmerInternal(ceYear, 4, 17, 12, 0, 0, true)._khmerDateObj;
    // Calculate difference
    const diffFromEpoch = ((khEpoch.monthIndex - 4) * 29 + khEpoch.getDayNumber()) -
        ((lunarDateLerngSak.month - 4) * 29 + lunarDateLerngSak.day);
    // Calculate days to subtract
    const daysToSubtract = diffFromEpoch + numberNewYearDay - 1;
    // Calculate new year date (Moha Songkran)
    const epochJdn = gregorianToJulianDay(epochLerngSakGreg.year, epochLerngSakGreg.month, epochLerngSakGreg.day);
    let newYearJdn = epochJdn - daysToSubtract;
    // Override with cache if available
    if (khNewYearMoments[ceYear]) {
        const [datePart, timePart] = khNewYearMoments[ceYear].split(' ');
        const [d, m, y] = datePart.split('-').map(Number);
        const [hr, min] = timePart.split(':').map(Number);
        // Update newYearInfo time
        newYearInfo.timeOfNewYear = { hour: hr, minute: min };
        // Update JDN based on cached date
        newYearJdn = gregorianToJulianDay(y, m, d);
    }
    const newYearDate = julianDayToGregorian(newYearJdn);
    const newYearMoment = new Date(newYearDate.year, newYearDate.month - 1, newYearDate.day, newYearInfo.timeOfNewYear.hour, newYearInfo.timeOfNewYear.minute);
    // Calculate Lerng Sak Date (Midnight)
    // Lerng Sak is the last day of NY celebration.
    // Jdn = newYearJdn + (numberNewYearDay - 1)
    const lerngSakJdn = newYearJdn + numberNewYearDay - 1;
    const lerngSakDate = julianDayToGregorian(lerngSakJdn);
    const lerngSakMoment = new Date(lerngSakDate.year, lerngSakDate.month - 1, lerngSakDate.day, 0, 0, 0); // Midnight
    const result = {
        newYearMoment,
        lerngSakMoment,
        newYearInfo: {
            year: newYearDate.year,
            month: newYearDate.month,
            day: newYearDate.day,
            hour: newYearInfo.timeOfNewYear.hour,

function formatKhmer(khmerData, formatString) {
    if (!formatString) {
        // Default format
        const { khmer } = khmerData;
        const moonDay = `${khmer.day}${khmer.moonPhaseName}`;
        return toKhmerNumeral(`ថ្ងៃ${khmer.dayOfWeekName} ${moonDay} ខែ${khmer.monthName} ឆ្នាំ${khmer.animalYearName} ${khmer.sakName} ពុទ្ធសករាជ ${khmer.beYear}`);
    }
    // Custom format
    const formatRules = {
        'W': () => khmerData.khmer.dayOfWeekName,
        'w': () => WeekdayNamesShort[khmerData.gregorian.dayOfWeek],
        'd': () => toKhmerNumeral(khmerData.khmer.day),
        'D': () => toKhmerNumeral((khmerData.khmer.day < 10 ? '0' : '') + khmerData.khmer.day),
        'dr': () => khmerData.khmer.day,
        'Dr': () => (khmerData.khmer.day < 10 ? '0' : '') + khmerData.khmer.day,
        'ds': () => toKhmerNumeral(khmerData.gregorian.day),
        'Ds': () => toKhmerNumeral((khmerData.gregorian.day < 10 ? '0' : '') + khmerData.gregorian.day),
        'dsr': () => khmerData.gregorian.day,
        'Dsr': () => (khmerData.gregorian.day < 10 ? '0' : '') + khmerData.gregorian.day,
        'n': () => MoonPhaseShort[khmerData.khmer.moonPhase],
        'N': () => khmerData.khmer.moonPhaseName,
        'o': () => MoonDaySymbols[khmerData._khmerDateObj.getDayNumber()],
        'm': () => khmerData.khmer.monthName,
        'M': () => SolarMonthNames[khmerData.gregorian.month - 1],
        'a': () => khmerData.khmer.animalYearName,
        'as': () => AnimalYearEmojis[khmerData.khmer.animalYear],
        'e': () => khmerData.khmer.sakName,
        'b': () => toKhmerNumeral(khmerData.khmer.beYear),
        'br': () => khmerData.khmer.beYear,
        'c': () => toKhmerNumeral(khmerData.gregorian.year),
        'cr': () => khmerData.gregorian.year,
        'j': () => toKhmerNumeral(khmerData.khmer.jsYear),
        'jr': () => khmerData.khmer.jsYear,
        'Ms': () => SolarMonthAbbreviationNames[khmerData.gregorian.month - 1],
        'ms': () => LunarMonthAbbreviationNames[khmerData.khmer.monthIndex]
    };
    // Sort keys by length descending to ensure longer tokens (like 'Ms', 'ms') are matched before shorter ones (like 'M', 'm')
    const sortedKeys = Object.keys(formatRules).sort((a, b) => b.length - a.length);
    const regex = new RegExp(`\\[([^\\]]+)\\]|(${sortedKeys.join('|')})`, 'g');
    const result = formatString.replace(regex, (match, escaped, token) => {
        if (escaped) {
            return escaped;
        }
        const value = formatRules[token]();
        return String(value);
    });
    return result;
}

    sel.innerHTML=`<option value="${esc(mine)}">${esc(mine)}</option>`; sel.value=mine; enhanceSelect('selectClass'); loadData(); return;

async function loadData(){

    if(error)throw error;
    STUDENTS=(data||[]).filter(s=>CUR_CLASS==='ALL'||cleanGrade(s.grade)===CUR_CLASS);

}

/* ================= បង្កើតរបាយការណ៍ ================= */
function compute(ref){
  const skip=document.getElementById('inSkipDrop').checked;
  const c={F:{},M:{}}; AGES.forEach(a=>{c.F[a]=0;c.M[a]=0});
  let total=0,female=0,noDob=0,outRange=0,noGender=0;
  STUDENTS.forEach(s=>{
    if(skip&&String(s.dropout_semester||'').trim())return;
    total++;
    const g=normGender(s.gender); if(g==='F')female++;
    const dob=parseDob(s.dob); if(!dob){noDob++;return}
    if(!g){noGender++;return}
    const a=ageAt(dob,ref);
    if(c[g][a]===undefined)outRange++; else c[g][a]++;
  });
  return {c,total,female,noDob,outRange,noGender};
}

  toast('កំពុងបង្កើត PDF...');
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;

    const SIGN_KEY = 'ageStatsSignDates_v1';

    const SD_LM = {0:'មិគសិរ',1:'បុស្ស',2:'មាឃ',3:'ផល្គុន',4:'ចេត្រ',5:'ពិសាខ',6:'ជេស្ឋ',7:'អាសាឍ',8:'ស្រាពណ៍',9:'ភទ្របទ',10:'អស្សុជ',11:'កត្តិក',12:'បឋមាសាឍ',13:'ទុតិយាសាឍ'};

    function cleanSD(o, defBlank) {
      return { blank: (o && typeof o.blank === 'boolean') ? o.blank : defBlank,
               date: (o && /^\d{4}-\d{2}-\d{2}$/.test(o.date || '')) ? o.date : '' };
    }
    function loadSignDates() {
      try {
        const o = JSON.parse(localStorage.getItem(SIGN_KEY) || 'null');
        if (o) { signDates.teacher = cleanSD(o.teacher, false); signDates.principal = cleanSD(o.principal, true); }
      } catch (e) {}
    }
    function saveSignDates() { try { localStorage.setItem(SIGN_KEY, JSON.stringify(signDates)); } catch (e) {} }
    function signParts(role) {
      const st = signDates[role || activeCalendarTarget];
      if (st.date) { const [y, m, d] = st.date.split('-').map(Number); return { y, m, d }; }
      const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() };
    }
    function sdInfo(y, m, d) {
      const r = momentkh.fromGregorian(y, m, d), k = r.khmer;
      return { dow: r.gregorian.dayOfWeek, kd: k.day, ph: k.moonPhase, mname: SD_LM[k.monthIndex] || k.monthName, be: k.beYear, animal: k.animalYearName, sak: k.sakName };
    }
    function sdIsHoly(y, m, d) {
      const o = sdInfo(y, m, d);
      if (o.kd === 8 || (o.ph === 0 && o.kd === 15)) return true;
      const t = new Date(y, m - 1, d + 1), n = sdInfo(t.getFullYear(), t.getMonth() + 1, t.getDate());
      return n.kd === 1 && n.ph === 0;
    }
    function lunarLine(o) {
      return 'ថ្ងៃ' + SD_DOW[o.dow] + ' ' + toKh(o.kd) + (o.ph === 0 ? 'កើត' : 'រោច') + ' ខែ' + o.mname + ' ឆ្នាំ' + o.animal + ' ' + o.sak + ' ពុទ្ធសករាជ ' + toKh(o.be);
    }
    function solarLine(y, m, d, place) {
      return (place ? 'ធ្វើនៅកំពង់ល្ពៅ ' : '') + 'ថ្ងៃទី' + toKh(d) + ' ខែ' + MONTHS[m - 1] + ' ឆ្នាំ' + toKh(y);
    }

      if (st.blank) {

      }
      let l = ''; try { l = lunarLine(sdInfo(p.y, p.m, p.d)); } catch (e) {}
      return '<div style="font-size:.93em">' + l + '</div><div>' + (role === 'teacher' ? esc(document.getElementById('inPlace').value) + ', ' : '') + solarLine(p.y, p.m, p.d, false) + '</div>';
    }
    function renderSignDates() {
      ['teacher', 'principal'].forEach(role => {
        const st = signDates[role], badge = document.getElementById(role === 'teacher' ? 'teacherDateBadge' : 'principalDateBadge'), p = signParts(role);
        if (badge) badge.textContent = (st.blank && role === 'principal') ? 'មិនដាក់' : st.blank ? 'ទទេ' : (p.d + ' ' + MONTHS[p.m - 1] + ' ' + p.y);
      });
      if (document.getElementById('khmerCalPopup').classList.contains('show')) renderCalendarDays();
    }
    function signChanged() { saveSignDates(); renderSignDates(); render(); }

    function renderCalendarDays() {
      if (typeof momentkh === 'undefined') return;
      const role = activeCalendarTarget, cur = signDates[role], sel = signParts(role);
      if (!calView) calView = { y: sel.y, m: sel.m };
      const { y, m } = calView, t = new Date();
      const first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate(), total = Math.ceil((first + dim) / 7) * 7;
      const lm = [], be = [];
      let html = '';
      for (let i = 0; i < total; i++) {
        const dt = new Date(y, m - 1, 1 + i - first), Y = dt.getFullYear(), M = dt.getMonth() + 1, D = dt.getDate();
        const inM = (M === m && Y === y), o = sdInfo(Y, M, D);
        if (inM) { if (!lm.includes(o.mname)) lm.push(o.mname); if (!be.includes(o.be)) be.push(o.be); }
        const cls = 'cal-cell' + (inM ? '' : ' out') + (o.dow === 0 ? ' sun' : '') + (sdIsHoly(Y, M, D) ? ' holy' : '')
          + ((t.getFullYear() === Y && t.getMonth() + 1 === M && t.getDate() === D) ? ' today' : '')
          + ((!cur.blank && sel.y === Y && sel.m === M && sel.d === D) ? ' selected' : '');
        html += '<button type="button" class="' + cls + '" onclick="calPick(' + Y + ',' + M + ',' + D + ')"><span class="n">' + toKh(D) + '</span><span class="l">' + toKh(o.kd) + (o.ph === 0 ? 'កើត' : 'រោច') + '</span></button>';
      }
      document.getElementById('calDaysGrid').innerHTML = html;
      document.getElementById('calMonth').textContent = MONTHS[m - 1] + ' ' + toKh(y);
      document.getElementById('calSub').textContent = 'ខែ' + lm.join(' – ខែ') + ' · ព.ស. ' + be.map(toKh).join(' – ');
      document.getElementById('calRole').textContent = '✍ ថ្ងៃខែហត្ថលេខា · ' + SIGN_ROLES[role];
      document.getElementById('calSel').innerHTML = cur.blank ? (role === 'principal' ? 'មិនដាក់ថ្ងៃខែ' : 'ទុកទទេ សម្រាប់សរសេរដោយដៃ')
        : '<div><b>' + lunarLine(sdInfo(sel.y, sel.m, sel.d)) + '</b></div><div>' + solarLine(sel.y, sel.m, sel.d, false) + '</div>';
      document.getElementById('calBtnClear').textContent = role === 'principal' ? 'មិនដាក់' : 'ទុកទទេ';
    }

      const st = signDates[activeCalendarTarget];
