<!DOCTYPE html>
<html lang="km" data-theme="light">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ថ្នាក់របស់ខ្ញុំ - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root,[data-theme="light"]{--bg:#e8f6fb;--bg2:#f4fbf7;--surface:#fff;--card:rgba(255,255,255,.8);--border:#cfe3ee;--text:#0f172a;--muted:#5b6b80;--primary:#057a55;--blue:#2563eb;--danger:#dc2626;--shadow:0 8px 28px rgba(15,23,42,.08)}
[data-theme="dark"]{--bg:#0a1220;--bg2:#0c1626;--surface:#131e33;--card:rgba(19,30,51,.85);--border:#23324d;--text:#f1f5f9;--muted:#9aa8bd;--primary:#10b981;--blue:#60a5fa;--danger:#f87171;--shadow:0 8px 28px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Khmer OS Battambang','Battambang',sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:16px;font-size:14px}
button,input,select{font-family:inherit}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cnt{color:var(--muted);font-size:15px}
.btn{height:46px;padding:0 20px;border-radius:14px;border:0;background:var(--primary);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:22px;padding:16px;box-shadow:var(--shadow);position:relative}
.card.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,122,85,.18),var(--shadow)}
.top{display:flex;align-items:center;gap:12px}
.ico{width:48px;height:48px;border-radius:14px;background:rgba(37,99,235,.12);display:flex;align-items:center;justify-content:center;font-size:24px}
.nm{flex:1;font-size:20px;font-weight:800;min-width:0}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(127,127,127,.1);cursor:pointer;font-size:16px}
.sub{color:var(--muted);margin:10px 0 12px;font-size:14px}
.badge{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--primary);border-radius:10px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.own{font-size:12.5px;color:var(--blue);font-weight:700}
.go{width:100%;height:46px;border-radius:13px;border:0;background:rgba(37,99,235,.1);color:var(--blue);font-weight:800;font-size:15px;cursor:pointer}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty .big{font-size:46px}
.empty h3{color:var(--text);margin:8px 0}
.cc-bg{position:fixed;inset:0;z-index:99990;background:rgba(10,18,32,.55);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px}
.cc-box{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:20px}
.cc-head{display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:800;margin-bottom:14px}
.cc-x{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--muted)}
.cc-sec{background:rgba(127,127,127,.08);border-radius:18px;padding:14px;margin-bottom:12px}
.cc-sec h5{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:800}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-grid label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.cc-box select,.cc-box input[type=text]{width:100%;height:46px;border-radius:13px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;padding:0 12px}
.cc-prev{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;border:1px solid rgba(5,122,85,.25);border-radius:14px;padding:10px 14px;background:var(--surface)}
.cc-prev small{display:block;color:var(--muted);font-size:12px}
.cc-prev b{font-size:20px;color:var(--primary)}
.cc-prev button{border:0;background:transparent;color:var(--primary);font-weight:800;cursor:pointer}
.cc-acts{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:6px}
.cc-acts button{height:48px;border-radius:14px;border:0;font-size:15px;font-weight:800;cursor:pointer}
.cc-acts .c{background:rgba(127,127,127,.14);color:var(--text)}.cc-acts .s{background:var(--primary);color:#fff}.cc-acts .s:disabled{opacity:.6}
.dlg-bg{position:fixed;inset:0;z-index:100000;background:rgba(10,18,32,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px}
.dlg{background:var(--surface);border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dlg h3{margin:6px 0}.dlg p{color:var(--muted);white-space:pre-line;margin-bottom:16px}
.dlg .acts{display:flex;gap:10px}.dlg .acts button{flex:1;height:44px;border-radius:12px;border:0;font-weight:800;font-size:15px;cursor:pointer;background:rgba(127,127,127,.14);color:var(--text)}
.dlg .acts .pri{background:var(--primary);color:#fff}.dlg.danger .acts .pri{background:var(--danger)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;z-index:100001;display:none}
.auth{display:none;text-align:center;padding:80px 16px}
</style>
</head>
<body>
<div class="auth" id="auth"><h2>🔒 សូមចូលប្រព័ន្ធជាមុន</h2></div>
<div id="main">
  <div class="head">
    <div style="display:flex;align-items:center;gap:12px"><button class="ib" style="border-radius:50%" onclick="goHub()" title="ត្រឡប់">‹</button><div class="cnt" id="cnt">សរុប 0 ថ្នាក់</div></div>
    <button class="btn" onclick="openCls()">＋ បង្កើតថ្នាក់</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><div class="big">🏫</div><h3>មិនទាន់មានថ្នាក់</h3><p>ចុច «បង្កើតថ្នាក់» ដើម្បីចាប់ផ្តើម</p></div>
</div>

<div class="cc-bg" id="ccBg" onclick="if(event.target===this)closeCls()">
  <div class="cc-box" role="dialog">
    <div class="cc-head"><span id="ccTitle">＋ បង្កើតថ្នាក់ថ្មី</span><button type="button" class="cc-x" onclick="closeCls()" aria-label="បិទ">✕</button></div>
    <div class="cc-sec"><h5>១ · កម្រិត និងឆ្នាំសិក្សា</h5>
      <div class="cc-grid">
        <div><label>កម្រិតថ្នាក់</label><select id="ccLevel" onchange="ccUpdate()"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
        <div><label>ឆ្នាំសិក្សា</label><select id="ccYear"></select></div>
      </div></div>
    <div class="cc-sec"><h5>២ · ឈ្មោះថ្នាក់</h5>
      <div class="cc-grid">
        <div><label>ខ្មែរ ឬ ឡាតាំង</label><select id="ccScript" onchange="ccFill();ccUpdate()"><option value="km">ខ្មែរ (ក ខ គ...)</option><option value="la">ឡាតាំង (A B C...)</option></select></div>
        <div><label>អក្សរថ្នាក់</label><select id="ccLetter" onchange="ccUpdate()"></select></div>
      </div>
      <div class="cc-prev"><div><small>ឈ្មោះដែលនឹងបង្ហាញ</small><b id="ccPreview"></b></div><button type="button" onclick="ccCustom()">ដាក់ឈ្មោះផ្សេង</button></div>
      <div id="ccCustomWrap" style="display:none;margin-top:10px"><input type="text" id="ccCustomIn" placeholder="ឧ. 4ក, 5-ខ" oninput="ccUpdate()"></div>
    </div>
    <div class="cc-acts"><button type="button" class="c" onclick="closeCls()">បោះបង់</button><button type="button" class="s" id="ccSave" onclick="saveCls()">បង្កើត</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const sb = supabase.createClient("https://nggnuobnrxiqjtcwlvwk.supabase.co", "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML");
function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')}
applyTheme(new URLSearchParams(location.search).get('theme')||'light');
window.addEventListener('message',e=>{if(e.data&&(e.data.type==='THEME_CHANGE'||e.data.theme))applyTheme(e.data.theme||e.data)});
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function uiConfirm(msg,opt){opt=opt||{};return new Promise(res=>{const bg=document.createElement('div');bg.className='dlg-bg';
  bg.innerHTML='<div class="dlg '+(opt.danger?'danger':'')+'"><div style="font-size:30px">'+(opt.danger?'🗑️':'❓')+'</div><h3>'+esc(opt.title||'សូមបញ្ជាក់')+'</h3><p>'+esc(msg)+'</p><div class="acts"><button data-v="0">បដិសេធ</button><button class="pri" data-v="1">'+esc(opt.okText||'យល់ព្រម')+'</button></div></div>';
  bg.addEventListener('click',e=>{const b=e.target.closest('button');if(b){bg.remove();res(b.dataset.v==='1')}else if(e.target===bg){bg.remove();res(false)}});document.body.appendChild(bg)})}
function uiAlert(msg){return new Promise(res=>{const bg=document.createElement('div');bg.className='dlg-bg';
  bg.innerHTML='<div class="dlg"><div style="font-size:30px">ℹ️</div><h3>ជូនដំណឹង</h3><p>'+esc(msg)+'</p><div class="acts"><button class="pri" data-v="1">យល់ព្រម</button></div></div>';
  bg.addEventListener('click',e=>{if(e.target.closest('button')||e.target===bg){bg.remove();res()}});document.body.appendChild(bg)})}

let USER=null; try{USER=JSON.parse(localStorage.getItem('krou_supabase_user')||'null')}catch(e){}
const IS_ADMIN=String(USER&&USER.role||'').toLowerCase().trim()==='admin';
function pw(){try{return localStorage.getItem('krou_pw')||''}catch(e){return ''}}
const ERR={auth:'ពាក្យសម្ងាត់មិនត្រឹមត្រូវ សូមចូលប្រព័ន្ធឡើងវិញ',forbidden:'គ្មានសិទ្ធិ',has_students:'ថ្នាក់នេះមានសិស្សរួចហើយ — មិនអាចលុប ឬប្តូរឈ្មោះបានទេ (ត្រូវផ្ទេរ ឬលុបសិស្សសិន)',no_name:'សូមបញ្ចូលឈ្មោះថ្នាក់',not_found:'រកមិនឃើញថ្នាក់'};
async function rpc(fn,args){
  const {data,error}=await sb.rpc(fn,Object.assign({p_u:USER.username,p_p:pw()},args||{}));
  if(error){ if(/duplicate|unique/i.test(error.message||''))throw new Error('ថ្នាក់នេះមានរួចហើយក្នុងឆ្នាំសិក្សាដដែល'); throw error; }
  if(data&&data.error){ if(data.error==='auth'){try{localStorage.removeItem('krou_pw')}catch(e){}} throw new Error(ERR[data.error]||data.error); }
  return data;
}
let ROWS=[], ACTIVE='', editId=null, customOn=false;
const KM=['ក','ខ','គ','ឃ','ង','ច','ឆ','ជ'], LA=['A','B','C','D','E','F','G','H'];
const cg=s=>String(s==null?'':s).replace(/^ថ្នាក់ទី\s*/,'').trim();

async function load(){
  try{
    const d=await rpc('staff_class_list'); ROWS=d.rows||[]; ACTIVE=cg(d.active); render();
  }catch(e){ document.getElementById('grid').innerHTML=''; uiAlert('❌ ទាញទិន្នន័យមិនបាន៖ '+(e.message||e)+'\n(បើនៅមិនទាន់ run classes_multi.sql សូម run វាក្នុង Supabase សិន)'); }
}
function render(){
  document.getElementById('cnt').textContent='សរុប '+ROWS.length+' ថ្នាក់';
  document.getElementById('empty').style.display=ROWS.length?'none':'block';
  document.getElementById('grid').innerHTML=ROWS.map(c=>{
    const act=!IS_ADMIN&&cg(c.name).toLowerCase()===ACTIVE.toLowerCase();
    const lv=c.level||(String(c.name).match(/^[0-9០-៩]+/)||[''])[0];
    return '<div class="card'+(act?' active':'')+'"><div class="top"><div class="ico">🏫</div><div class="nm">ថ្នាក់ទី'+esc(c.name)+(act?'<span class="badge">កំពុងប្រើ</span>':'')+'</div>'
      +'<button class="ib" title="កែ" onclick="openCls('+c.id+')">✏️</button><button class="ib" title="លុប" onclick="delCls('+c.id+')">🗑️</button></div>'
      +'<div class="sub">'+(lv?'ថ្នាក់ទី '+esc(lv)+' · ':'')+'ឆ្នាំសិក្សា '+esc(c.school_year||'—')+' · សិស្ស '+(c.students||0)+' នាក់'+(IS_ADMIN&&c.owner?'<br><span class="own">👤 '+esc(c.owner)+'</span>':'')+'</div>'
      +'<button class="go" onclick="goStudents('+c.id+')">👥 សិស្ស →</button></div>';
  }).join('');
}
function goHub(){try{parent.postMessage({type:'NAVIGATE',page:'classes'},'*')}catch(e){}location.href='classes.html'}
async function goStudents(id){
  if(!IS_ADMIN){
    try{ const d=await rpc('staff_class_activate',{p_id:id}); USER=d.row; localStorage.setItem('krou_supabase_user',JSON.stringify(d.row));
      try{parent.postMessage({type:'CLASS_CHANGED',user:d.row},'*')}catch(e){} }
    catch(e){ uiAlert('❌ '+(e.message||e)); return; }
  }
  try{parent.postMessage({type:'NAVIGATE',page:'addStudent'},'*')}catch(e){ location.href='addStudent.html'; }
}
function ccFill(sel){const a=document.getElementById('ccScript').value==='la'?LA:KM;document.getElementById('ccLetter').innerHTML=a.map(x=>'<option'+(x===sel?' selected':'')+'>'+x+'</option>').join('')}
function ccVal(){return customOn?cg(document.getElementById('ccCustomIn').value):document.getElementById('ccLevel').value+document.getElementById('ccLetter').value}
function ccUpdate(){document.getElementById('ccPreview').textContent='ថ្នាក់ទី'+(ccVal()||'—')}
function ccCustom(){customOn=!customOn;document.getElementById('ccCustomWrap').style.display=customOn?'block':'none';if(customOn)document.getElementById('ccCustomIn').focus();ccUpdate()}
function openCls(id){
  editId=id||null; customOn=false; document.getElementById('ccCustomWrap').style.display='none'; document.getElementById('ccCustomIn').value='';
  const now=new Date(),y0=now.getMonth()>=9?now.getFullYear():now.getFullYear()-1;
  let yr=y0+'-'+(y0+1), lv='1', letter='ក', script='km', c=null;
  if(editId){ c=ROWS.find(x=>x.id===editId); if(c){ yr=c.school_year||yr; const m=String(c.name).match(/^(\d+)([^\d].*)$/); if(m&&/^[A-Za-z]$/.test(m[2]))script='la'; if(m&&(m[2].length===1)){lv=m[1];letter=m[2]}else{customOn=true;document.getElementById('ccCustomWrap').style.display='block';document.getElementById('ccCustomIn').value=c.name} } }
  const yrs=[y0-1,y0,y0+1].map(a=>a+'-'+(a+1)); if(!yrs.includes(yr))yrs.push(yr);
  document.getElementById('ccYear').innerHTML=yrs.map(a=>'<option'+(a===yr?' selected':'')+'>'+a+'</option>').join('');
  document.getElementById('ccLevel').value=lv; document.getElementById('ccScript').value=script; ccFill(letter); ccUpdate();
  document.getElementById('ccTitle').textContent=editId?'✏️ កែប្រែថ្នាក់':'＋ បង្កើតថ្នាក់ថ្មី'; document.getElementById('ccSave').textContent=editId?'រក្សាទុក':'បង្កើត';
  document.getElementById('ccBg').style.display='flex';
}
function closeCls(){document.getElementById('ccBg').style.display='none'}
async function saveCls(){
  const name=ccVal(); if(!name){toast('⚠️ សូមបញ្ចូលឈ្មោះថ្នាក់');return}
  const lvl=customOn?(name.match(/^[0-9]+/)||[''])[0]:document.getElementById('ccLevel').value;
  const data={name:name,level:lvl,school_year:document.getElementById('ccYear').value};
  const b=document.getElementById('ccSave'); b.disabled=true; const t=b.textContent; b.textContent='⏳ ...';
  try{
    await rpc('staff_class_write',{p_op:editId?'update':'insert',p_id:editId,p_data:data});
    closeCls(); toast(editId?'✅ បានកែប្រែថ្នាក់':'✅ បានបង្កើតថ្នាក់'); await refreshUser(); await load();
  }catch(e){ uiAlert('❌ '+(e.message||e)); }
  finally{ b.disabled=false; b.textContent=t; }
}
async function delCls(id){
  const c=ROWS.find(x=>x.id===id); if(!c)return;
  if(!await uiConfirm('លុប «ថ្នាក់ទី'+c.name+'» ?',{danger:true,okText:'លុប',title:'លុបថ្នាក់'}))return;
  try{ await rpc('staff_class_write',{p_op:'delete',p_id:id,p_data:null}); toast('🗑️ បានលុបថ្នាក់'); await refreshUser(); await load(); }
  catch(e){ uiAlert('❌ '+(e.message||e)); }
}
/* ធ្វើឱ្យ localStorage + ទំព័រមេ ដឹងពីថ្នាក់កំពុងប្រើថ្មី (assigned_classes) */
async function refreshUser(){
  try{
    const {data}=await sb.rpc('staff_update_my_profile',{p_u:USER.username,p_p:pw(),p_data:{updated_at:new Date().toISOString()}});
    if(data&&data.row){USER=data.row;localStorage.setItem('krou_supabase_user',JSON.stringify(data.row));try{parent.postMessage({type:'CLASS_CHANGED',user:data.row},'*')}catch(e){}}
  }catch(e){}
}
if(!USER||!USER.username){document.getElementById('main').style.display='none';document.getElementById('auth').style.display='block'}
else load();
</script>
</body>
</html>
