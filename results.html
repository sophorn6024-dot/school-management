<script>
/* 🔒 អាន scores តាមមុខងារ staff_rows (គ្រូឃើញតែថ្នាក់ខ្លួន · Admin ឃើញទាំងអស់) — ដូច rank.html */
(function(){
  var cache={};
  function Q(t){this.t=t;this.c=null;this.f=[];this.o=[];this.r=null}
  Q.prototype.select=function(c){this.c=c||null;return this};
  Q.prototype.eq=function(c,v){this.f.push({c:c,op:'eq',v:v});return this};
  Q.prototype.in=function(c,a){this.f.push({c:c,op:'in',v:(a||[]).map(String)});return this};
  Q.prototype.order=function(c,o){this.o.push({c:c,asc:!(o&&o.ascending===false)});return this};
  Q.prototype.range=function(a,b){this.r=[a,b];return this};
  Q.prototype.then=function(ok,bad){return this.run().then(ok,bad)};
  Q.prototype.run=function(){
    var self=this,u=null,pw='';try{u=JSON.parse(localStorage.getItem('krou_supabase_user')||'null');pw=localStorage.getItem('krou_pw')||''}catch(e){}
    if(!u||!u.username||!pw)return Promise.resolve({data:null,error:{message:'សូមចូលប្រព័ន្ធឡើងវិញ'}});
    var args={p_u:u.username,p_p:pw,p_table:self.t,p_f:self.f,p_cols:self.c,p_order:self.o};
    var key=JSON.stringify(args),now=Date.now(),hit=cache[key];
    if(!hit||now-hit.at>4000){hit=cache[key]={at:now,p:Promise.resolve(sb.rpc('staff_rows',args)).then(function(r){
      if(r.error)return{data:null,error:r.error};
      if(r.data&&r.data.error){if(r.data.error==='auth'){try{localStorage.removeItem('krou_pw')}catch(e){}}return{data:null,error:{message:String(r.data.error)}}}
      return{data:(r.data&&r.data.rows)||[],error:null}})}}
    return hit.p.then(function(r){
      if(r.error||!self.r)return r;
      return{data:r.data.slice(self.r[0],self.r[1]+1),error:null}});
  };
  window.tbq=function(t){return new Q(t)};
})();

<script>
const SUPABASE_URL="https://nggnuobnrxiqjtcwlvwk.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ═══ 🎨 theme ពីទំព័រមេ ═══ */
(function theme(){
  var R=document.documentElement,HEX=/^#[0-9a-fA-F]{6}$/;
  function hov(h){var n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(function(v){return ('0'+Math.round(v*0.82).toString(16)).slice(-2)}).join('')}
  function ap(t){R.setAttribute('data-theme',t==='dark'?'dark':'light')}
  function setP(v,h){if(!HEX.test(v||''))return;var n=parseInt(v.slice(1),16),st=R.style;st.setProperty('--primary',v);st.setProperty('--primary-d',HEX.test(h||'')?h:hov(v));st.setProperty('--soft','rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+',.12)')}
  function det(){var t=null;try{t=new URLSearchParams(location.search).get('theme')}catch(e){}
    if(!t){try{if(window.parent&&window.parent!==window)t=window.parent.document.documentElement.getAttribute('data-theme')}catch(e){}}
    if(!t){try{if(localStorage.getItem('krou_theme_auto')==='1'){var h=new Date().getHours();t=(h>=6&&h<18)?'light':'dark'}else t=localStorage.getItem('krou_theme_manual')}catch(e){}}
    return t||'light'}
  ap(det());
  var q=null,sp='',pr='';try{q=new URLSearchParams(location.search)}catch(e){}
  try{sp=localStorage.getItem('krou_theme_primary')||''}catch(e){}
  try{if(window.parent&&window.parent!==window)pr=(window.parent.document.documentElement.style.getPropertyValue('--primary')||'').trim()}catch(e){}
  setP(sp);setP(q&&q.get('primary'));setP(pr);
  window.addEventListener('message',function(e){var d=e.data;if(!d||(d.type!=='THEME_CHANGE'&&!d.theme))return;ap(d.theme||d);if(d.primary)setP(d.primary,d.primaryHover)});
  window.addEventListener('storage',function(e){if(e.key==='krou_theme_manual'||e.key==='krou_theme_auto')ap(det());if(e.key==='krou_theme_primary')setP(e.newValue)});
})();

/* ═══ ជំនួយ ═══ */
const MONTHS=['វិច្ឆិកា','ធ្នូ','មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា'];
const SEM1=MONTHS.slice(0,6),SEM2=MONTHS.slice(6);
const R2=x=>Math.floor(Number(x)*100+1e-7)/100;
const combine2=(a,b)=>(a>0&&b>0)?(a+b)/2:(a>0?a:(b>0?b:0));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanGrade=g=>String(g||'').replace(/^ថ្នាក់ទី\s*/,'').trim();
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function readSession(){try{return JSON.parse(localStorage.getItem('krou_supabase_user')||'null')}catch(e){return null}}
const USER=readSession();
const IS_ADMIN=String(USER&&USER.role||'').toLowerCase().trim()==='admin';
function goBack(){try{if(window.parent&&window.parent!==window){window.parent.postMessage({type:'NAVIGATE',page:'dashboard'},'*');return}}catch(e){}location.href='index.html'}

/* និទ្ទេស ៤ ក្រុម */
/* ប្តូរនិទ្ទេស៖ ខ្មែរ (៤ក្រុម) ↔ A–F (៦ក្រុម ដូច rank.html) */
let GMODE='kh';try{GMODE=localStorage.getItem('res_grade_mode')==='af'?'af':'kh'}catch(e){}
function letter(v){v=Number(v);if(!(v>0))return null;if(v>=9)return'A';if(v>=8)return'B';if(v>=7)return'C';if(v>=6)return'D';if(v>=5)return'E';return'F'}
function band(v){
  const L=letter(v);if(!L)return null;
  if(GMODE==='af')return L;
  return (L==='A'||L==='B')?'good':(L==='C'||L==='D')?'ok':L==='E'?'mid':'bad';
}
const BANDN={good:'ល្អ',ok:'ល្អបង្គួរ',mid:'មធ្យម',bad:'ខ្សោយ',A:'A',B:'B',C:'C',D:'D',E:'E',F:'F'};
const bandList=()=>GMODE==='af'?['A','B','C','D','E','F']:['good','ok','mid','bad'];
function toggleGrade(){GMODE=GMODE==='af'?'kh':'af';try{localStorage.setItem('res_grade_mode',GMODE)}catch(e){}$('lblLang').textContent=GMODE==='af'?'A–F':'ខ្មែរ';if(SD.length)render()}

/* ═══ ទិន្នន័យ ═══ */
let CLS='',ST=[],SC=[],PER='auto';
async function stRows(){
  let pw='';try{pw=localStorage.getItem('krou_pw')||''}catch(e){}
  if(!USER||!USER.username||!pw)throw new Error('សូមចូលប្រព័ន្ធឡើងវិញ');
  const r=await sb.rpc('staff_student_list',{p_u:USER.username,p_p:pw});
  if(r.error)throw r.error;
  if(r.data&&r.data.error){if(r.data.error==='auth'){try{localStorage.removeItem('krou_pw')}catch(e){}}throw new Error(String(r.data.error))}
  return (r.data&&r.data.rows)||[];
}
async function allScores(cls){
  const PS=1000;let out=[],from=0;
  for(;;){
    const q=()=>tbq('scores').select('student_id, score_type, period, average').eq('assigned_class',cls);
    let r=await (from===0?q().range(0,PS-1):q().order('id',{ascending:true}).range(from,from+PS-1));
    if(r.error)throw new Error(r.error.message||'កំហុស');
    let d=r.data||[];
    if(from===0&&d.length>=PS){ /* ច្រើនជាង ១០០០ ជួរ → ទាញតាមលំដាប់ id ដើម្បីកុំឱ្យច្រលំទំព័រ */
      const r2=await q().order('id',{ascending:true}).range(0,PS-1);if(!r2.error)d=r2.data||d;}
    out=out.concat(d);if(d.length<PS)break;from+=PS;
  }
  return out;
}
function calcSem(my,months,exam){
  let s=0,c=0;
  months.forEach(m=>{const r=my.find(x=>x.score_type==='monthly'&&x.period===m);if(r&&Number(r.average)>0){s+=Number(r.average);c++}});
  const mo=c?s/c:0;
  const er=my.find(x=>x.score_type==='semester'&&x.period===exam);
  const ex=(er&&Number(er.average)>0)?Number(er.average):0;
  return{monthly:mo,exam:ex,sem:R2(combine2(mo,ex))};
}
/* គណនាសិស្សម្នាក់ៗ */
function buildStudents(){
  const byId={};SC.forEach(r=>{(byId[String(r.student_id)]=byId[String(r.student_id)]||[]).push(r)});
  return ST.map(s=>{
    const id=String(s.student_id||s.id),my=byId[id]||[];
    const mon={};MONTHS.forEach(m=>{const r=my.find(x=>x.score_type==='monthly'&&x.period===m);const v=r?Number(r.average):0;mon[m]=v>0?v:0});
    const ex1=my.find(x=>x.score_type==='semester'&&x.period==='ឆមាសទី១'),ex2=my.find(x=>x.score_type==='semester'&&x.period==='ឆមាសទី២');
    const c1=calcSem(my,SEM1,'ឆមាសទី១'),c2=calcSem(my,SEM2,'ឆមាសទី២');
    return{id,name:s.student_name||'គ្មានឈ្មោះ',sex:s.gender||'',mon,
      ex1:ex1&&Number(ex1.average)>0?Number(ex1.average):0,ex2:ex2&&Number(ex2.average)>0?Number(ex2.average):0,
      s1:c1.sem,s2:c2.sem,year:R2(combine2(c1.sem,c2.sem))};
  });
}
let SD=[];
/* តម្លៃតាមរយៈពេល */
function valOf(s,p){
  if(p==='ប្រចាំឆ្នាំ')return s.year;
  if(p==='ប្រចាំឆមាសទី១')return s.s1;
  if(p==='ប្រចាំឆមាសទី២')return s.s2;
  if(p==='ឆមាសទី១')return s.ex1;
  if(p==='ឆមាសទី២')return s.ex2;
  return s.mon[p]||0;
}
function periods(){
  return ['ប្រចាំឆ្នាំ','ប្រចាំឆមាសទី១','ប្រចាំឆមាសទី២','ឆមាសទី១','ឆមាសទី២'].concat(MONTHS);
}
function latestMonth(){for(let i=MONTHS.length-1;i>=0;i--){if(SD.some(s=>s.mon[MONTHS[i]]>0))return MONTHS[i]}return null}
function effPer(){
  if(PER!=='auto')return PER;
  return SD.some(s=>s.year>0)?'ប្រចាំឆ្នាំ':(latestMonth()||'ប្រចាំឆ្នាំ');
}

/* ═══ រៀបចំ UI ═══ */
function fillPeriods(){
  const sel=$('selPer');
  sel.innerHTML='<option value="auto">ស្វ័យប្រវត្តិ</option>'+periods().map(p=>'<option value="'+p+'">'+(MONTHS.includes(p)?'ខែ'+p:p)+'</option>').join('');
  sel.value=PER;
}
function onPer(){PER=$('selPer').value;render()}
async function onCls(){CLS=$('selCls').value;try{sessionStorage.setItem('res_last_cls_'+USER.username,CLS)}catch(e){}await load()}

function kpiHtml(list,p){
  const vals=list.map(s=>valOf(s,p)).filter(v=>v>0);
  const n=list.length,e=vals.length,pass=vals.filter(v=>v>=5).length,weak=vals.filter(v=>v<7).length;
  const avg=e?vals.reduce((a,b)=>a+b,0)/e:0;
  const card=(bg,ic,v,l)=>'<div class="card kpi"><div class="ic" style="background:'+bg+'"><i class="fa-solid '+ic+'"></i></div><div><div class="v">'+v+'</div><div class="l">'+l+'</div></div></div>';
  return card('#e11d48','fa-user-group',n,'សិស្សសរុប · បានដាក់ '+e)
   +card('#059669','fa-circle-check',pass+'/'+e,'ជាប់ · '+(e?Math.round(pass*100/e):0)+'%')
   +card('#0284c7','fa-arrow-trend-up',e?avg.toFixed(2):'—','មធ្យមភាគ · /10')
   +card('#ef4444','fa-triangle-exclamation',weak,'សិស្សខ្សោយ · band D–F');
}
function trendHtml(){
  const pts=MONTHS.map(m=>{const v=SD.map(s=>s.mon[m]).filter(x=>x>0);return v.length?{m,v:v.reduce((a,b)=>a+b,0)/v.length}:null}).filter(Boolean);
  if(pts.length<2)return '<div class="empty">មានទិន្នន័យតែ '+pts.length+' ខែ។ ត្រូវការច្រើនខែដើម្បីបង្ហាញនិន្នាការ</div>';
  const W=900,H=230,L=36,Rr=20,T=16,B=34,iw=W-L-Rr,ih=H-T-B;
  const x=i=>L+iw*(pts.length===1?.5:i/(pts.length-1)),y=v=>T+ih*(1-v/10);
  let g='';for(let k=0;k<=10;k+=2)g+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(k)+'" y2="'+y(k)+'" stroke="var(--border)" stroke-dasharray="3 4"/><text x="'+(L-8)+'" y="'+(y(k)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+k+'</text>';
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+' L'+x(pts.length-1).toFixed(1)+' '+y(0)+' L'+x(0).toFixed(1)+' '+y(0)+' Z';
  const dots=pts.map((p,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="4.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/><text x="'+x(i).toFixed(1)+'" y="'+(y(p.v)-10).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">'+p.v.toFixed(2)+'</text><text x="'+x(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+esc(p.m)+'</text>').join('');
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:560px;height:auto;display:block"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".28"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#ga)"/><path d="'+line+'" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg></div>';
}
/* ការចែកចាយ */
const DS={m:null,e:null,s:null};
function distBlock(title,sel,p){
  const vals=SD.map(s=>valOf(s,p)).filter(v=>v>0);
  const BL=bandList(),cnt={};BL.forEach(b=>cnt[b]=0);vals.forEach(v=>cnt[band(v)]++);
  const mx=Math.max(1,...Object.values(cnt));
  let body;
  if(!vals.length)body='<div class="empty" style="padding:18px 0">មិនទាន់មាន</div>';
  else body='<div class="bars'+(GMODE==='af'?' six':'')+'">'+BL.map(b=>'<div><div class="n c-'+b+'">'+cnt[b]+'</div><div class="b bg-'+b+'" style="height:'+(cnt[b]?Math.max(8,Math.round(cnt[b]/mx*64)):4)+'px;opacity:'+(cnt[b]?1:.35)+'"></div><div class="lb">'+BANDN[b]+'</div></div>').join('')+'</div>';
  return '<div class="dist"><div class="hd"><span>'+title+'</span>'+(sel||'')+'<span class="cnt">'+(vals.length?vals.length+' នាក់':'')+'</span></div>'+body+'</div>';
}
function selHtml(id,opts,cur){return '<select id="'+id+'" onchange="onDist()">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>'}
function distHtml(){
  if(DS.m==null)DS.m=latestMonth()||MONTHS[0];
  if(DS.e==null)DS.e=SD.some(s=>s.ex2>0)?'ឆមាសទី២':'ឆមាសទី១';
  if(DS.s==null)DS.s=SD.some(s=>s.s2>0)?'ប្រចាំឆមាសទី២':'ប្រចាំឆមាសទី១';
  return '<h2>ការចែកចាយនិទ្ទេស</h2>'
   +distBlock('ខែ',selHtml('dsM',MONTHS.map(m=>[m,m]),DS.m),DS.m)
   +distBlock('ឆមាស',selHtml('dsE',[['ឆមាសទី១','1'],['ឆមាសទី២','2']],DS.e),DS.e)
   +distBlock('ប្រចាំឆមាស',selHtml('dsS',[['ប្រចាំឆមាសទី១','1'],['ប្រចាំឆមាសទី២','2']],DS.s),DS.s)
   +distBlock('ប្រចាំឆ្នាំ','','ប្រចាំឆ្នាំ');
}
function onDist(){DS.m=$('dsM').value;DS.e=$('dsE').value;DS.s=$('dsS').value;$('dist').innerHTML=distHtml()}

/* បញ្ជី */
const OPEN=new Set();
function ranked(){
  const p=effPer();
  const L=SD.map(s=>({s,v:valOf(s,p)}));
  L.sort((a,b)=>b.v-a.v||String(a.s.name).localeCompare(String(b.s.name),'km'));
  let cur=0,prev=null;
  L.forEach((o,i)=>{if(o.v>0){if(o.v!==prev){cur=i+1;prev=o.v}o.rk=cur}else o.rk=0});
  return L;
}
function detHtml(s){
  const c=(l,v)=>'<span class="c">'+esc(l)+'<b>'+(v>0?v.toFixed(2):'—')+'</b></span>';
  return '<div class="chips">'+MONTHS.filter(m=>s.mon[m]>0).map(m=>c(m,s.mon[m])).join('')
    +c('ឆមាសទី១',s.ex1)+c('ឆមាសទី២',s.ex2)+c('ប្រចាំឆមាសទី១',s.s1)+c('ប្រចាំឆមាសទី២',s.s2)+c('ប្រចាំឆ្នាំ',s.year)+'</div>';
}
function renderList(){
  const q=$('q').value.trim().toLowerCase();
  const all=ranked().filter(o=>o.v>0);
  const L=all.filter(o=>!q||String(o.s.name).toLowerCase().includes(q));
  if(!L.length){$('rows').innerHTML='<div class="empty">'+(all.length?'រកមិនឃើញ':(SD.length?'មិនទាន់មានពិន្ទុសម្រាប់រយៈពេលនេះ':'ថ្នាក់នេះមិនទាន់មានសិស្ស'))+'</div>';return}
  $('rows').innerHTML=L.map(o=>{
    const b=band(o.v),rk=o.rk,cls=rk===1?'':rk===2?' r2':rk===3?' r3':' rn';
    const open=OPEN.has(o.s.id);
    return '<div class="row'+(open?' open':'')+'" onclick="tg(\''+esc(o.s.id)+'\')"><div class="rk'+(rk?cls:' rn')+'">'+(rk||'–')+'</div><div class="nm"><b>'+esc(o.s.name)+'</b><small>'+esc(o.s.sex)+'</small></div>'
      +'<span class="badge '+b+'">'+BANDN[b]+'</span>'
      +'<div class="av">'+o.v.toFixed(2)+'</div><i class="fa-solid fa-chevron-right cv"></i></div>'
      +'<div class="det'+(open?' show':'')+'">'+detHtml(o.s)+'</div>';
  }).join('');
}
function tg(id){if(OPEN.has(id))OPEN.delete(id);else OPEN.add(id);renderList()}

function render(){
  const p=effPer();
  $('chipN').textContent=SD.length+' នាក់';
  $('kpis').innerHTML=kpiHtml(SD,p);
  $('trend').innerHTML=trendHtml();
  $('dist').innerHTML=distHtml();
  renderList();
}
let ALLST=null,ALLST_P=null;
function getStudents(){return ALLST?Promise.resolve(ALLST):(ALLST_P||(ALLST_P=stRows().then(r=>(ALLST=r)).catch(e=>{ALLST_P=null;throw e})))}
const CK=c=>'res_cache_'+(USER&&USER.username)+'_'+c;
function readCache(c){try{return JSON.parse(sessionStorage.getItem(CK(c))||'null')}catch(e){return null}}
function writeCache(c,st,sc){try{sessionStorage.setItem(CK(c),JSON.stringify({st:st,sc:sc}))}catch(e){}}
let LOADSEQ=0;
async function load(){
  const my=++LOADSEQ,cls=CLS;
  const ch=readCache(cls);
  if(ch&&ch.st){ /* បង្ហាញភ្លាមពីអង្គចាំ រួចធ្វើឱ្យថ្មីនៅផ្ទៃក្រោយ */
    ST=ch.st;SC=ch.sc||[];SD=buildStudents();DS.m=DS.e=DS.s=null;OPEN.clear();fillPeriods();render();
  }else{
    $('kpis').innerHTML='';
    $('trend').innerHTML=$('rows').innerHTML='<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> កំពុងទាញយក…</div>';
  }
  try{
    /* ទាញសិស្ស និងពិន្ទុ ព្រមគ្នា (មិនរង់ចាំម្តងមួយ) */
    const [all,sc]=await Promise.all([getStudents(),allScores(cls)]);
    if(my!==LOADSEQ)return;
    const st=all.filter(s=>cleanGrade(s.grade)===cls);
    writeCache(cls,st,st.length?sc:[]);
    const fresh=!(ch&&ch.st);
    ST=st;SC=st.length?sc:[];SD=buildStudents();
    if(fresh){DS.m=DS.e=DS.s=null;OPEN.clear();fillPeriods()}
    render();
  }catch(e){
    if(my!==LOADSEQ)return;
    if(!(ch&&ch.st))$('trend').innerHTML=$('rows').innerHTML='<div class="empty" style="color:var(--bad)">❌ '+esc(e.message||e)+'</div>';
  }
}
async function init(){
  if(!USER||!USER.username){$('app').innerHTML='<div class="empty">សូមចូលប្រព័ន្ធជាមុន</div>';return}
  $('lblLang').textContent=GMODE==='af'?'A–F':'ខ្មែរ';
  const sel=$('selCls');
  const mine=String(USER.assigned_classes||USER.assigned_class||'').split(/[,،;]/).map(cleanGrade).filter(Boolean);
  const fill=cl=>{sel.innerHTML=cl.map(c=>'<option value="'+esc(c)+'">ថ្នាក់ទី '+esc(c)+'</option>').join('');sel.style.display=cl.length>1?'':'none'};
  let first=null;
  if(!IS_ADMIN&&mine.length){ /* គ្រូ៖ ស្គាល់ថ្នាក់ហើយ → ចាប់ផ្តើមទាញភ្លាម ព្រមជាមួយបញ្ជីសិស្ស */
    fill(mine);CLS=mine[0];sel.value=CLS;first=load();
  }
  let all;
  try{all=await getStudents()}catch(e){
    $('kpis').innerHTML='';$('trend').innerHTML=$('rows').innerHTML='<div class="empty" style="color:var(--bad)">❌ '+esc(e.message||e)+'</div>';return;
  }
  const set=[...new Set(all.map(s=>cleanGrade(s.grade)).filter(Boolean))];
  if(IS_ADMIN||!mine.length){
    const classes=set;
    if(!classes.length){$('rows').innerHTML=$('trend').innerHTML='<div class="empty">⚠️ គណនីរបស់អ្នកមិនទាន់មានថ្នាក់</div>';return}
    fill(classes);
    let last='';try{last=sessionStorage.getItem('res_last_cls_'+USER.username)||''}catch(e){}
    CLS=classes.includes(last)?last:classes[0];sel.value=CLS;
    await load();
  }else await first;
}
/* នាំចេញ CSV */
function exportCsv(){
  if(!SD.length){toast('គ្មានទិន្នន័យ');return}
  const p=effPer(),L=ranked();
  const head=['ចំណាត់ថ្នាក់','ឈ្មោះ','ភេទ','រយៈពេល','មធ្យមភាគ','និទ្ទេស'].concat(MONTHS,['ឆមាសទី១','ឆមាសទី២','ប្រចាំឆមាសទី១','ប្រចាំឆមាសទី២','ប្រចាំឆ្នាំ']);
  const f=v=>v>0?v.toFixed(2):'';
  const rows=L.map(o=>{const s=o.s,b=band(o.v);return [o.rk||'',s.name,s.sex,p,f(o.v),b?BANDN[b]:''].concat(MONTHS.map(m=>f(s.mon[m])),[f(s.ex1),f(s.ex2),f(s.s1),f(s.s2),f(s.year)])});
  const csv='﻿'+[head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='លទ្ធផលសិក្សា_ថ្នាក់'+CLS+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('✅ បាននាំចេញ');
}
init();
</script>
