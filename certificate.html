<!DOCTYPE html>
<html lang="km" data-theme="dark">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>បណ្ណសរសើរសិស្ស (ប្រចាំឆ្នាំ លេខ១ ដល់ ៥)</title>

  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Moul&family=Siemreap&family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @font-face {
      font-family: 'Tacteing';
      src: local('Tacteing'),
           local('Khmer OS Tacteing'),
           local('Tacteing Regular'),
           local('Tacteing-Regular'),
           url('https://cdn.jsdelivr.net/gh/SOMONSOUM/Latex-Project@master/pptexam/Tacteing.ttf') format('truetype');
      font-display: block;
    }

    :root {
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.96);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    [data-theme="dark"] {
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.95);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-family: 'Siemreap', sans-serif;
      padding: 0 0 60px 0 !important;
      overflow-x: auto;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ */
    .auth-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 30px 20px;
    }
    .auth-card {
      background: var(--card-panel-bg);
      border: 1.5px solid var(--tb-border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 8px; color: #ef4444; font-weight: 700; }
    .auth-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      border: none;
    }

    /* ══════════════ 🎛️ TOOLBAR ══════════════ */
    .no-print-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      margin-bottom: 18px;
    }
    .tb-group { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .tb-filters { flex: 1 1 auto; }
    .tb-actions { flex: 0 0 auto; margin-left: auto; }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 10px;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .toolbar-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .form-control {
      padding: 5px 8px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
      height: 32px;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    /* 🔤 Font Battambang */
    .font-battambang,
    .font-battambang option {
      font-family: 'Battambang', 'Siemreap', sans-serif !important;
    }

    /* 🔤 Custom dropdown (Battambang ទាំងស្រុង ព្រោះ native picker មិនគោរព font) */
    .bb-dropdown { position: relative; }
    .bb-dropdown, .bb-dropdown * { font-family: 'Battambang', 'Siemreap', sans-serif !important; }
    .bb-dd-btn {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
      min-width: 170px; height: 32px; padding: 5px 10px;
      font-size: 13px; font-weight: 700;
      color: var(--text-main); background: var(--input-bg);
      border: 1.5px solid var(--input-border); border-radius: 8px; cursor: pointer;
    }
    .bb-dd-btn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bb-dd-btn:focus { outline: none; border-color: var(--input-focus); }
    .bb-dd-menu {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      min-width: 220px; max-width: calc(100vw - 16px); max-height: 60vh; overflow-y: auto; z-index: 2000;
      background: var(--card-panel-bg); border: 1.5px solid var(--tb-border);
      border-radius: 10px; box-shadow: var(--shadow-sm);
    }
    .bb-dd-menu.open { display: block; }
    .bb-dd-item {
      padding: 10px 14px; font-size: 14px; font-weight: 400; cursor: pointer;
      color: var(--text-main); border-bottom: 1px solid var(--tb-border);
    }
    .bb-dd-item:last-child { border-bottom: none; }
    .bb-dd-item:hover { background: var(--ctrl-group-bg); }
    .bb-dd-item.active { background: #0284c7; color: #fff; }

    .btn {
      padding: 5px 12px;
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
      height: 32px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }

    /* 📅 ប៊ូតុងថ្ងៃហត្ថលេខា */
    .dt-btn {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
      min-width: 118px; height: 32px; padding: 5px 10px; font-size: 12.5px; font-weight: 700;
      color: var(--text-main); background: var(--input-bg); border: 1.5px solid var(--input-border);
      border-radius: 8px; cursor: pointer; outline: none; transition: all 0.2s ease;
      font-family: 'Battambang', 'Siemreap', sans-serif;
    }
    .dt-btn:hover, .dt-btn.open { border-color: var(--input-focus); box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15); }
    .dt-btn .dt-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dt-btn .dt-chev { font-size: 10px; color: #0284c7; flex-shrink: 0; transition: transform .2s ease; }
    .dt-btn.open .dt-chev { transform: rotate(180deg); }

    /* 📅 ប្រតិទិនជ្រើសថ្ងៃហត្ថលេខា */
    .cal-popup, .cal-popup * { font-family: 'Battambang', 'Siemreap', sans-serif; }
    .cal-popup {
      display: none; position: fixed; z-index: 99999; width: 340px; max-width: calc(100vw - 16px);
      background: var(--card-panel-bg); color: var(--text-main);
      border: 1px solid var(--tb-border); border-radius: 20px; overflow: hidden;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.35); max-height: calc(100vh - 20px); overflow-y: auto;
    }
    .cal-popup.show { display: block; }
    .cal-hero { background: linear-gradient(135deg, #132d56 0%, #1e3a8a 60%, #7c1d3a 130%); color: #fff; padding: 14px 14px 12px; }
    .cal-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cal-title { text-align: center; flex: 1; min-width: 0; }
    .cal-month { font-family: 'Moul', cursive !important; font-weight: normal !important; font-size: 17px; line-height: 1.6; }
    .cal-sub { font-size: 11.5px; opacity: .85; line-height: 1.4; }
    .cal-nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.12); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .cal-nav:hover { background: rgba(255,255,255,.25); }
    .cal-role { margin-top: 8px; font-size: 12px; opacity: .9; text-align: center; }
    .cal-sel { margin-top: 6px; background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 10px; font-size: 13px; line-height: 1.55; text-align: center; min-height: 40px; }
    .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-dow { padding: 8px 8px 2px; }
    .cal-dow div { text-align: center; font-size: 12px; color: var(--text-muted); padding: 2px 0; }
    .cal-dow div:first-child { color: #dc2626; }
    .cal-grid { padding: 2px 8px 8px; gap: 2px; }
    .cal-day { position: relative; border: none; background: transparent; color: var(--text-main); cursor: pointer; border-radius: 12px; padding: 4px 0 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 46px; line-height: 1.15; transition: background .12s ease; }
    .cal-day .n { font-size: 15px; font-weight: 700; }
    .cal-day .l { font-size: 9.5px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; }
    .cal-day.sun .n { color: #dc2626; }
    .cal-day.out { opacity: .38; }
    .cal-day:hover { background: var(--ctrl-group-bg); }
    .cal-day.holy .l { color: #b45309; font-weight: 700; }
    .cal-day.holy::after { content: ''; position: absolute; top: 4px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: #f59e0b; }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--input-focus); }
    .cal-day.sel { background: linear-gradient(135deg, #e11d48, #be123c); color: #fff; box-shadow: 0 4px 12px rgba(225, 29, 72, .35); }
    .cal-day.sel .n, .cal-day.sel .l { color: #fff; }
    .cal-day.sel::after { background: #fde68a; }
    .cal-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 12px 12px; border-top: 1px solid var(--tb-border); }
    .cal-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--tb-border); background: var(--ctrl-group-bg); color: var(--text-main); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
    .cal-btn:hover { border-color: var(--input-focus); }
    .cal-blank { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; color: var(--text-muted); }

    /* ✍️ ថ្ងៃខែក្នុងបណ្ណសរសើរ */
    .sd-l { font-size: 11.5px; line-height: 1.45; white-space: nowrap; }
    .sd-s { font-size: 12px; line-height: 1.45; white-space: nowrap; }

    /* 📱 RESPONSIVE (មិនចាំបាច់អូស Toolbar ទៀតទេ) */
    @media screen and (max-width: 1100px) {
      .tb-filters { flex: 1 1 100%; }
      .tb-actions { flex: 1 1 100%; justify-content: flex-end; margin-left: 0; }
    }
    @media screen and (max-width: 720px) {
      body { padding: 0 0 50px 0 !important; }
      .no-print-toolbar { position: static; padding: 6px 8px; gap: 6px; margin-bottom: 12px; }
      .tb-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px; width: 100%; }
      .tb-filters .panel-pill-box { display: flex; width: 100%; }
      .tb-filters .form-control { flex: 1 1 auto; min-width: 0; width: 100% !important; }
      .tb-filters .bb-dropdown { flex: 1 1 auto; min-width: 0; }
      .tb-filters .bb-dd-btn, .tb-filters .dt-btn { width: 100%; min-width: 0 !important; flex: 1 1 auto; }
      .tb-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 100%; }
      .tb-actions .btn { width: 100%; justify-content: center; }
      .form-control, .btn, .bb-dd-btn, .dt-btn { height: 34px; font-size: 12.5px; }
    }
    @media screen and (max-width: 420px) {
      .toolbar-label .lbl { display: none; }
    }

    /* ══════════════ 📜 CERTIFICATES (A4 LANDSCAPE) ══════════════ */
    .certificate-list {
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
      margin-top: 10px;
      transform-origin: top center;
    }

    .certificate-container {
      width: 960px;
      height: 710px;
      margin: 0 auto;
      background-color: #fffdf7 !important;
      color: #000000 !important;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      page-break-after: always;
      break-after: page;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .outer-border {
      border: 4px solid #800000;
      padding: 5px;
      height: 100%;
      position: relative;
      z-index: 2;
    }

    .inner-border {
      border: 2px solid #d4af37;
      outline: 1px solid #800000;
      outline-offset: 4px;
      height: 100%;
      padding: 22px 35px 18px 35px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: radial-gradient(circle, rgba(255, 255, 255, 1) 55%, rgba(253, 248, 235, 1) 100%);
    }

    .frame-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      pointer-events: none;
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;
      display: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .frame-overlay.active { display: block; }
    .certificate-container.has-frame { padding: 130px 55px 70px 55px; }

    .corner-kbach {
      position: absolute;
      width: 48px;
      height: 48px;
      fill: #d4af37;
      z-index: 2;
    }

    .top-left { top: -2px; left: -2px; }
    .top-right { top: -2px; right: -2px; transform: rotate(90deg); }
    .bottom-left { bottom: -2px; left: -2px; transform: rotate(-90deg); }
    .bottom-right { bottom: -2px; right: -2px; transform: rotate(180deg); }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      padding: 0 45px;
    }

    .header-left {
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      flex-shrink: 0;
      margin-top: 8px;
    }

    .header-right {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex-shrink: 0;
      margin-top: -5px;
    }

    .header-admin-line1, .header-admin-line2 {
      font-family: 'Moul', serif;
      color: #002b66;
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
      white-space: nowrap;
    }

    .header-admin-line3 {
      font-family: 'Siemreap', sans-serif;
      color: #002b66;
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
      white-space: nowrap;
    }

    .kingdom-line {
      font-family: 'Moul', serif;
      color: #800000;
      font-size: 13px;
      line-height: 1.7;
      margin: 0;
      text-align: center;
      white-space: nowrap;
    }

    .motto-line {
      font-family: 'Moul', serif;
      color: #800000;
      font-size: 12.5px;
      line-height: 1.7;
      margin: 0;
      text-align: center;
      white-space: nowrap;
    }

    .flagRow {
      color: #d4af37;
      font-family: 'Tacteing', 'Khmer OS Tacteing', sans-serif;
      font-size: 40px;
      line-height: 0.3;
      margin-top: 8px;
      user-select: none;
      display: block;
      text-align: center;
    }

    .cert-title-block { margin-top: -10px; text-align: center; }

    .cert-title {
      font-family: 'Moul', serif;
      color: #800000;
      font-size: 32px;
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0px rgba(212, 175, 55, 0.4);
    }

    .cert-subtitle-school {
      font-family: 'Moul', serif;
      color: #4B0082;
      font-size: 15px;
      margin-top: 3px;
    }

    .cert-body {
      font-family: 'Siemreap', sans-serif;
      font-size: 13px;
      color: #222;
      line-height: 1.8;
    }

    .nowrap-group { white-space: nowrap; display: inline-block; margin: 0 1px; }

    .field-highlight {
      font-family: 'Moul', serif;
      font-weight: 400;
      font-size: 14.5px;
      color: #800000;
      padding: 0 3px;
      line-height: 1.6;
    }

    .student-name {
      font-family: 'Moul', serif;
      font-weight: 400;
      font-size: 15px;
      color: #800000;
      display: inline-block;
      padding: 4px 10px 2px 10px;
      line-height: 1.6;
    }

    .student-photo-box {
      width: 113px;
      height: 151px;
      transform: translateY(-8px);
      flex-shrink: 0;
      flex-grow: 0;
      border: 3px solid #d4af37;
      border-radius: 4px;
      background-color: #f8f9fa;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .student-photo-box img { width: 100%; height: 100%; object-fit: cover; }

    .footer-section {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      column-gap: 10px;
      font-family: 'Siemreap', sans-serif;
      font-size: 13px;
    }

    .signature-box { text-align: center; justify-self: center; }

    .signature-title {
      font-family: 'Moul', serif;
      font-size: 12px;
      color: #002b66;
      margin-top: 4px;
    }

    .signature-name.teacher-name-shift { position: relative; left: 28px; }
    .signature-space { height: 46px; }
    .signature-name {
      font-family: 'Moul', serif;
      font-size: 12px;
      color: #002b66;
      min-height: 20px;
      line-height: 1.6;
      white-space: nowrap;
    }

    /* ══════════════ 🖨️ PRINT (ដូចពេលបង្ហាញ ១០០% — គ្រាន់តែពង្រីកស្មើគ្នាឲ្យពេញ A4) ══════════════ */
    @media print {
      @page { size: A4 landscape; margin: 0; }

      html, body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
        width: auto !important;
        min-height: 0 !important;
      }

      .no-print-toolbar, .auth-wrapper, .cal-popup, .bb-dd-menu { display: none !important; }

      .certificate-list {
        display: block !important;

    const SD_LM = {0:'មិគសិរ',1:'បុស្ស',2:'មាឃ',3:'ផល្គុន',4:'ចេត្រ',5:'ពិសាខ',6:'ជេស្ឋ',7:'អាសាឍ',8:'ស្រាពណ៍',9:'ភទ្របទ',10:'អស្សុជ',11:'កត្តិក',12:'បឋមាសាឍ',13:'ទុតិយាសាឍ'};
    const SCHOOL_PLACE = 'កំពង់ល្ពៅ';

    function cleanSD(o) { return { blank: !!(o && o.blank), date: (o && /^\d{4}-\d{2}-\d{2}$/.test(o.date || '')) ? o.date : '' }; }
    function loadSignDates() {
      try {
        const o = JSON.parse(localStorage.getItem(SIGN_KEY) || 'null');
        if (o) { signDates.teacher = cleanSD(o.teacher); signDates.director = cleanSD(o.director); }
      } catch (e) {}
    }
    function saveSignDates() { try { localStorage.setItem(SIGN_KEY, JSON.stringify(signDates)); } catch (e) {} }
    function signParts(role) {
      const st = signDates[role || calRole];
      let y, m, d;
      if (st.date) { [y, m, d] = st.date.split('-').map(Number); }
      else { const t = new Date(); y = t.getFullYear(); m = t.getMonth() + 1; d = t.getDate(); }
      return { y, m, d };
    }
    function sdInfo(y, m, d) {
      const r = momentkh.fromGregorian(y, m, d), k = r.khmer;
      return { dow: r.gregorian.dayOfWeek, kd: k.day, ph: k.moonPhase, mi: k.monthIndex, mname: SD_LM[k.monthIndex] || k.monthName, be: k.beYear, animal: k.animalYearName, sak: k.sakName };
    }
    function sdIsHoly(y, m, d) {
      const o = sdInfo(y, m, d);
      if (o.kd === 8 || (o.ph === 0 && o.kd === 15)) return true;
      const t = new Date(y, m - 1, d + 1), n = sdInfo(t.getFullYear(), t.getMonth() + 1, t.getDate());
      return n.kd === 1 && n.ph === 0;
    }
    function lunarLine(o) {
      return 'ថ្ងៃ' + SD_DOW[o.dow] + ' ' + toKhmerDigits(o.kd) + (o.ph === 0 ? 'កើត' : 'រោច') + ' ខែ' + o.mname + ' ឆ្នាំ' + o.animal + ' ' + o.sak + ' ព.ស. ' + toKhmerDigits(o.be);
    }
    function dateLinesHTML(role, withPlace) {
      const { y, m, d } = signParts(role);
      const place = withPlace ? SCHOOL_PLACE + ', ' : '';
      const st = signDates[role];
      if (st.blank && role === 'director') {
        return '<div class="sd-l">&nbsp;</div><div class="sd-s">&nbsp;</div>';   // ទទេ : មិនបង្ហាញអ្វី
      }
      try {
        const o = sdInfo(y, m, d);
        if (st.blank) {
          return '<div class="sd-l">ថ្ងៃ.................... ខែ.......... ឆ្នាំ........... ព.ស. ' + toKhmerDigits(o.be) + '</div>'
               + '<div class="sd-s">' + place + 'ថ្ងៃទី...... ខែ...... ឆ្នាំ' + toKhmerDigits(y) + '</div>';
        }
        return '<div class="sd-l">' + lunarLine(o) + '</div>'
             + '<div class="sd-s">' + place + 'ថ្ងៃទី' + toKhmerDigits(d) + ' ខែ' + SD_GM[m - 1] + ' ឆ្នាំ' + toKhmerDigits(y) + '</div>';
      } catch (e) {
        return '<div class="sd-l">&nbsp;</div><div class="sd-s">' + place + 'ថ្ងៃទី...... ខែ...... ឆ្នាំ' + toKhmerDigits(y) + '</div>';
      }
    }
    function teacherDateHTML() { return dateLinesHTML('teacher', true); }
    function directorDateHTML() { return dateLinesHTML('director', false); }

    function renderSignLabels() {
      const lab = (role, who) => { const st = signDates[role], p = signParts(role); return st.blank ? who + ' · ទទេ' : who + ' · ' + toKhmerDigits(p.d) + ' ' + SD_GM[p.m - 1] + (st.date ? ' ' + toKhmerDigits(p.y) : ''); };
      const lt = document.getElementById('signLabelT'), ld = document.getElementById('signLabelD');
      if (lt) lt.textContent = lab('teacher', 'គ្រូ');
      if (ld) ld.textContent = lab('director', 'នាយក');
      const bi = document.getElementById('signBlankIn'); if (bi) bi.checked = signDates[calRole].blank;
      if (document.getElementById('calPopup')?.classList.contains('show')) calRender();
    }
    function signChanged() { saveSignDates(); renderSignLabels(); updateAllCertText(); }
    function setSignDate(v) {
      const st = signDates[calRole];
      st.date = /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : ''; st.blank = false;
      signChanged();
    }
    function setSignBlank(b) { signDates[calRole].blank = !!b; signChanged(); }

    function calRender() {
      if (typeof momentkh === 'undefined') return;
      if (!calView) { const p = signParts(calRole); calView = { y: p.y, m: p.m }; }
      const { y, m } = calView, sel = signParts(calRole), cur = signDates[calRole], t = new Date();
      const today = { y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate() };
      const dowEl = document.getElementById('calDow');
      if (dowEl && !dowEl.childElementCount) dowEl.innerHTML = ['អា','ច','អ','ព','ព្រ','សុ','ស'].map(x => '<div>' + x + '</div>').join('');
      const first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate(), total = Math.ceil((first + dim) / 7) * 7;
      const lm = [], be = [];
      let html = '';
      for (let i = 0; i < total; i++) {
        const dt = new Date(y, m - 1, 1 + i - first), Y = dt.getFullYear(), M = dt.getMonth() + 1, D = dt.getDate();
        const inM = (M === m && Y === y), o = sdInfo(Y, M, D);
        if (inM) { if (!lm.includes(o.mname)) lm.push(o.mname); if (!be.includes(o.be)) be.push(o.be); }
        const isSel = !cur.blank && sel.y === Y && sel.m === M && sel.d === D;
        const cls = 'cal-day' + (inM ? '' : ' out') + (o.dow === 0 ? ' sun' : '') + (sdIsHoly(Y, M, D) ? ' holy' : '')
          + (today.y === Y && today.m === M && today.d === D ? ' today' : '') + (isSel ? ' sel' : '');
        html += '<button type="button" class="' + cls + '" onclick="calPick(' + Y + ',' + M + ',' + D + ')"><span class="n">' + toKhmerDigits(D) + '</span><span class="l">' + toKhmerDigits(o.kd) + (o.ph === 0 ? 'កើត' : 'រោច') + '</span></button>';
      }
      document.getElementById('calGrid').innerHTML = html;
      document.getElementById('calMonth').textContent = SD_GM[m - 1] + ' ' + toKhmerDigits(y);
      document.getElementById('calSub').textContent = 'ខែ' + lm.join(' – ខែ') + ' · ព.ស. ' + be.map(toKhmerDigits).join(' – ');
      document.getElementById('calRole').textContent = '✍ ថ្ងៃខែហត្ថលេខា · ' + SIGN_ROLES[calRole];
      let selTxt = 'ទុកទទេ សម្រាប់សរសេរដោយដៃ';
      if (!cur.blank) {
        const o = sdInfo(sel.y, sel.m, sel.d);
        selTxt = '<div><b>' + lunarLine(o) + '</b></div><div>ថ្ងៃទី' + toKhmerDigits(sel.d) + ' ខែ' + SD_GM[sel.m - 1] + ' ឆ្នាំ' + toKhmerDigits(sel.y) + '</div>';
      }
      document.getElementById('calSel').innerHTML = selTxt;
    }
    function calShift(n) {
      if (!calView) { const p = signParts(calRole); calView = { y: p.y, m: p.m }; }
      const t = new Date(calView.y, calView.m - 1 + n, 1); calView = { y: t.getFullYear(), m: t.getMonth() + 1 }; calRender();
    }
    function calPick(y, m, d) { setSignDate(y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0')); calView = { y, m }; calRender(); }
    function calToday() { setSignDate(''); const p = signParts(calRole); calView = { y: p.y, m: p.m }; calRender(); }
    function closeCalPopup() {
      document.getElementById('calPopup')?.classList.remove('show');
      document.getElementById('signBtnT')?.classList.remove('open');
      document.getElementById('signBtnD')?.classList.remove('open');
    }
    function toggleCalPopup(e, role) {
      if (e) e.stopPropagation();
      const pop = document.getElementById('calPopup'), btn = document.getElementById(role === 'teacher' ? 'signBtnT' : 'signBtnD');
      const wasOpen = pop.classList.contains('show') && calRole === role;
      closeCalPopup(); closeAllDd();
      if (wasOpen) return;
      calRole = role;
      document.getElementById('signBlankIn').checked = signDates[calRole].blank;
      const p = signParts(calRole); calView = { y: p.y, m: p.m };
      calRender();
      const r = btn.getBoundingClientRect(), w = Math.min(340, window.innerWidth - 16);
      pop.style.width = w + 'px';
      if (window.innerWidth <= 720) {   // ទូរស័ព្ទ ៖ ដាក់ខាងក្រោម កុំបាំងប៊ូតុង Toolbar
        pop.style.left = Math.max(8, (window.innerWidth - w) / 2) + 'px';
        pop.style.top = 'auto'; pop.style.bottom = '8px';
        pop.style.maxHeight = Math.max(260, window.innerHeight - 16) + 'px';
      } else {
        pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
        pop.style.top = (r.bottom + 6) + 'px'; pop.style.bottom = 'auto'; pop.style.maxHeight = '';
      }
      pop.classList.add('show');
      btn.classList.add('open');
    }
    window.addEventListener('resize', closeCalPopup);

    function doPrint() {
      window.focus();
      setTimeout(() => {
        try { window.print(); } catch(e) { window.parent.print(); }
      }, 100);
    }

    /* 4. INITIALIZATION */
    window.addEventListener('DOMContentLoaded', async () => {
      if (!checkAuthentication()) return;

      document.getElementById('inYear').value = defaultAcademicYear();

      /* 👑 Admin៖ បង្ហាញប្រអប់ជ្រើសរើសថ្នាក់ទី */

    /* 5. LOAD TOP 5 STUDENTS (SUPABASE) */
    async function loadTopStudents() {
      const selectedClass = document.getElementById('selectClass').value || cleanGrade(USER_CLASS);
      const curPure = cleanGrade(selectedClass);
      const container = document.getElementById('certificateList');

      if (!curPure) return;

      container.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-size:15px; color:var(--text-muted); font-weight:600;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
          <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យសិស្សពូកែលេខ ១ ដល់ ៥ ប្រចាំឆ្នាំ (ថ្នាក់ទី ${curPure})...</p>
        </div>`;

      try {
        const { data: stList, error: stErr } = await sb
          .from('students')
          .select('id, student_id, student_name, gender, dob, grade, photo_url, dropout_semester')
          .order('id', { ascending: true });

        if (stErr) throw stErr;

        const students = (stList || [])
          .filter(s => cleanGrade(s.grade) === curPure)
          .filter(s => {
            const drop = String(s.dropout_semester || '').trim();
            if (drop.includes('ឆមាស១') || drop.includes('ឆមាសទី១') || drop === '១') return false;
            return true;
          });

        if (!students.length) {
          container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted); font-size:15px;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>`;
          return;
        }

        const studentIds = students.map(s => String(s.student_id || s.id));

        const { data: scData, error: scErr } = await sb
          .from('scores')
          .select('student_id, score_type, period, average, rank')
          .eq('assigned_class', curPure)
          .in('student_id', studentIds);

        if (scErr) console.warn("Scores fetch warning:", scErr);

        const sem1Months = ['វិច្ឆិកា', 'ធ្នូ', 'មករា', 'កុម្ភៈ', 'មីនា', 'មេសា'];
        const sem2Months = ['ឧសភា', 'មិថុនា', 'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា'];

        const studentRanks = students.map(st => {
          const sId = String(st.student_id || st.id);
          const myScores = (scData || []).filter(r => String(r.student_id) === sId);

          const yrRec = myScores.find(r => r.period === 'ប្រចាំឆ្នាំ');
          if (yrRec && Number(yrRec.average) > 0) {
            return {
              id: sId,
              name: st.student_name,
              gender: st.gender,
              dob: st.dob,
              grade: curPure,
              photoUrl: st.photo_url,
              avg: Number(yrRec.average).toFixed(2),
              rank: yrRec.rank
            };
          }

          let s1Sum = 0, s1Count = 0, s2Sum = 0, s2Count = 0;
          sem1Months.forEach(m => {
            const r = myScores.find(sc => sc.score_type === 'monthly' && sc.period === m);
            if (r && Number(r.average) > 0) { s1Sum += Number(r.average); s1Count++; }
          });
          const e1 = myScores.find(sc => sc.score_type === 'semester' && sc.period === 'ឆមាសទី១');
          if (e1 && Number(e1.average) > 0) { s1Sum += Number(e1.average); s1Count++; }

          sem2Months.forEach(m => {
            const r = myScores.find(sc => sc.score_type === 'monthly' && sc.period === m);
            if (r && Number(r.average) > 0) { s2Sum += Number(r.average); s2Count++; }
          });
          const e2 = myScores.find(sc => sc.score_type === 'semester' && sc.period === 'ឆមាសទី២');
          if (e2 && Number(e2.average) > 0) { s2Sum += Number(e2.average); s2Count++; }

          const avg1 = s1Count > 0 ? (s1Sum / s1Count) : 0;
          const avg2 = s2Count > 0 ? (s2Sum / s2Count) : 0;

          let yearlyAvg = 0;
          if (avg1 > 0 && avg2 > 0) yearlyAvg = (avg1 + avg2) / 2;
          else if (avg1 > 0) yearlyAvg = avg1;
          else if (avg2 > 0) yearlyAvg = avg2;

          return {
            id: sId,
            name: st.student_name,
            gender: st.gender,
            dob: st.dob,
            grade: curPure,
            photoUrl: st.photo_url,
            avg: yearlyAvg > 0 ? yearlyAvg.toFixed(2) : 0,
            rank: null
          };
        });

        studentRanks.sort((a, b) => Number(b.avg) - Number(a.avg));
        const validStudents = studentRanks.filter(s => Number(s.avg) > 0);

        let curRank = 0, prevA = null;
        validStudents.forEach((s, idx) => {
          const v = Number(s.avg);
          if (v !== prevA) {
            curRank = idx + 1;
            prevA = v;
          }
          s.rank = curRank;
        });

        const top5 = validStudents.slice(0, 5);
        HOMEROOM_NAME = await fetchHomeroomTeacher(curPure);
        renderAllCertificates(top5, curPure);

      } catch (err) {
        container.innerHTML = `<div style="text-align:center; padding:50px; color:#ef4444; font-weight:700;">❌ កំហុស៖ ${err.message}</div>`;
      }
    }

              </div>

              <div class="cert-body">
                សូមសរសើរចំពោះសិស្សឈ្មោះ
                <div class="student-name">${sName}</div>
                <span class="nowrap-group">ភេទ <span class="field-highlight">${sGender}</span></span>
                <span class="nowrap-group">កើតថ្ងៃទី <span class="field-highlight">${toKhmerDigits(sDob)}</span></span>
                <span class="nowrap-group">រៀនថ្នាក់ទី <span class="field-highlight">${toKhmerDigits(sClass)}</span></span>
                <br>
                នៃ <span class="field-highlight cert-out-school">${schoolInput}</span> ។ ដែលបានខិតខំសិក្សារៀនសូត្រ
                <span class="nowrap-group">
                  ទទួលបានចំណាត់ថ្នាក់លេខ <span class="field-highlight">${toKhmerDigits(sRank)}</span>
                  មធ្យមភាគ <span class="field-highlight">${toKhmerDigits(sAvg)}</span>
                </span>
                <br>
                <span class="nowrap-group">ក្នុងឆ្នាំសិក្សា <span class="field-highlight cert-out-year">${toKhmerDigits(yearInput)}</span></span> ។
                <br>
                បណ្ណសរសើរនេះប្រគល់ជូនសាមីខ្លួនប្រើប្រាស់តាមការដែលអាចប្រើបាន ។
              </div>

              <div class="footer-section">
                <div class="signature-box" style="align-self:start; margin-top:4px;">
                  <div class="cert-out-ddate">${directorDateHTML()}</div>
                  <span>បានឃើញ និងឯកភាព</span><br>
                  <div class="signature-title">នាយកសាលា</div>
                  <div class="signature-space"></div>
                  <div class="signature-name"></div>
                </div>

                <div class="student-photo-box">
                  <img src="${photoSrc}" alt="Student Photo" onerror="this.onerror=null; this.src=NO_PHOTO_SRC;">
                </div>

                <div class="signature-box" style="align-self:start; margin-top:4px;">
                  <div class="cert-out-tdate">${teacherDateHTML()}</div>
                  <div class="signature-title">គ្រូបន្ទុកថ្នាក់</div>
                  <div class="signature-space"></div>
                  <div class="signature-name teacher-name-shift">${escHtml(HOMEROOM_NAME)}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
        `;
      });

      container.innerHTML = html;
      updateAllFrames();
    }

    function updateAllCertText() {
      const schoolVal = document.getElementById('inSchool').value || '...................';
      const yearVal   = toKhmerDigits(document.getElementById('inYear').value || '...................');

      document.querySelectorAll('.cert-out-school').forEach(el => el.innerText = schoolVal);
      document.querySelectorAll('.cert-subtitle-school').forEach(el => el.innerText = 'នាយក' + schoolVal);
      document.querySelectorAll('.cert-out-year').forEach(el => el.innerText = yearVal);
      document.querySelectorAll('.cert-out-tdate').forEach(el => el.innerHTML = teacherDateHTML());
      document.querySelectorAll('.cert-out-ddate').forEach(el => el.innerHTML = directorDateHTML());
    }

    function updateAllFrames() {
      const val = document.getElementById('selectFrame').value;

      document.querySelectorAll('.certificate-container').forEach(container => {
        const overlay = container.querySelector('.frame-overlay');
        const outerBorder = container.querySelector('.outer-border');
        const innerBorder = container.querySelector('.inner-border');
        const cornerKbachEls = container.querySelectorAll('.corner-kbach');

        if (val && FRAME_IMAGES[val]) {
          overlay.style.backgroundImage = "url('" + FRAME_IMAGES[val] + "')";
          overlay.classList.add('active');
          container.classList.add('has-frame');
          outerBorder.style.border = 'none';
          innerBorder.style.border = 'none';
          innerBorder.style.outline = 'none';
          innerBorder.style.background = 'transparent';
          cornerKbachEls.forEach(el => el.style.display = 'none');
        } else {
          overlay.classList.remove('active');
          overlay.style.backgroundImage = '';
          container.classList.remove('has-frame');
          outerBorder.style.border = '';
          innerBorder.style.border = '';
          innerBorder.style.outline = '';
          innerBorder.style.background = '';
          cornerKbachEls.forEach(el => el.style.display = '');
        }
      });
    }
  </script>
</body>
</html>
