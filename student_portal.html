<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ផ្ទាំងសិស្ស</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#eef2f9;--bg2:#e3eaf6;--side:#1e3a8a;--sidet:#e0e7ff;--card:#fff;--line:#d9e1ef;--text:#0f172a;--muted:#5b6b86;--ac:#2563eb;--acs:#dbeafe;--in:#f8fafc;--ok:#059669;--oks:#d1fae5;--bad:#e11d48;--bads:#ffe4e6;--warn:#b45309;--warns:#fef3c7;--gold:#b45309}
[data-theme=dark]{--bg:#070d1c;--bg2:#0d1730;--side:#0f2557;--sidet:#c7d2fe;--card:#111c33;--line:#25355a;--text:#f1f5f9;--muted:#93a4c4;--ac:#3b82f6;--acs:#16294d;--in:#18253f;--ok:#34d399;--oks:#0f3a30;--bad:#fb7185;--bads:#3b1420;--warn:#fbbf24;--warns:#3a2c0e;--gold:#fbbf24}
*{box-sizing:border-box}
html{color-scheme:light}[data-theme=dark]{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Battambang',system-ui,sans-serif;font-size:15px;line-height:1.6;background:radial-gradient(1200px 600px at 80% -10%,var(--bg2),var(--bg))}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lg{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lg h1{font-family:'Moul',serif;font-weight:400;font-size:21px;text-align:center;margin:0 0 4px;color:var(--ac)}
.lg p{text-align:center;color:var(--muted);margin:0 0 16px;font-size:13.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--in);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:10px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ac);color:#fff}
label.f{display:block;margin:10px 0 4px;color:var(--muted);font-size:13.5px}
.in{width:100%;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.in:focus{border-color:var(--ac)}
.btn{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;width:100%;margin-top:14px}
.btn.sm{width:auto;margin:0;padding:9px 14px}
.btn.ghost{background:var(--in);color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{background:var(--bads);color:var(--bad);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13.5px;display:none}
.pw{position:relative}.pw button{position:absolute;right:8px;top:7px;background:none;border:0;cursor:pointer;font-size:18px}
/* app */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--side),#0a1530);color:var(--sidet);padding:14px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.who{display:flex;align-items:center;gap:10px;padding:8px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.av{width:44px;height:44px;border-radius:50%;background:#c2410c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.who b{display:block;line-height:1.3;color:#fff}.who small{opacity:.75}
nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:inherit;padding:12px;border-radius:12px;cursor:pointer;text-align:left;margin-bottom:2px}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 70%,#000));color:#fff;font-weight:700}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sp{flex:1}
.side-foot{display:flex;gap:8px}
.side-foot button{flex:1;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:9px;cursor:pointer}
main{padding:22px;min-width:0}
.top{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.hero{display:flex;align-items:center;gap:16px}
.hero .ic{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 70%,#fff),var(--ac));display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.hero small{color:var(--muted)}.hero h2{margin:0;font-size:26px;color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.st{border-radius:18px;padding:16px;border:1px solid var(--line);background:var(--card);min-height:150px}
.st .h{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px}
.st .v{font-size:38px;font-weight:700;text-align:center;margin:10px 0 2px}
.st .s{text-align:center;color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px;background:var(--card)}
.chip.g{color:var(--gold)}.chip.k{color:var(--ok)}.chip.b{color:var(--ac)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px;cursor:pointer;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .in{width:auto;min-width:130px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kv{border:1px solid var(--line);background:var(--in);border-radius:14px;padding:12px;text-align:center}
.kv small{color:var(--muted);display:block}.kv b{font-size:24px}
.sj-t{margin:18px 0 10px;font-size:15px}
.sj{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.sj-g{border:1px solid var(--line);background:var(--in);border-radius:14px;padding:10px 12px}
.sj-h{font-weight:800;color:var(--ac,#38bdf8);margin-bottom:6px;font-size:13px}
.sj-r{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.sj-r:first-of-type{border-top:0}
.sj-r b{font-size:15px}.sj-r small{color:var(--muted);font-weight:600;font-size:11px}
.sem-pick{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--in);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.sem-ic{width:44px;height:44px;border-radius:14px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.sem-pick small{display:block;color:var(--muted);font-size:12px}.sem-pick b{font-size:18px}
.sem-pick .in{width:auto;margin-left:auto;min-width:130px}
.sm-h{font-size:22px;margin:4px 0 2px}.sm-s{color:var(--muted);font-size:13px;margin-bottom:14px}
.sm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sm-st{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--in)}
.sm-l{color:var(--muted);font-size:12.5px}.sm-v{font-size:28px;font-weight:800;margin-top:6px}
.sm-st.c1{background:linear-gradient(135deg,rgba(14,165,233,.14),transparent)}.sm-st.c1 .sm-v{color:#38bdf8}
.sm-st.c2{background:linear-gradient(135deg,rgba(245,158,11,.16),transparent)}.sm-st.c2 .sm-v{color:#fbbf24}
.sm-st.c3{background:linear-gradient(135deg,rgba(59,130,246,.16),transparent)}.sm-st.c3 .sm-v{color:#60a5fa}
.sm-st.c4{background:linear-gradient(135deg,rgba(16,185,129,.14),transparent)}
.sm-st.c5{background:linear-gradient(135deg,rgba(139,92,246,.16),transparent)}.sm-st.c5 .sm-v{color:#a78bfa}
.sm-list{display:grid;gap:0;border-top:1px solid var(--line)}
.sm-sub{padding:14px 4px;border-bottom:1px solid var(--line)}
.sm-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sm-top b{font-size:17px;display:block}.sm-top small{color:var(--muted);font-size:12px}
.sm-bd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--in);border:1px solid var(--line)}
.sm-bd.gA{color:#34d399;background:rgba(16,185,129,.16)}.sm-bd.gB{color:#60a5fa;background:rgba(59,130,246,.16)}.sm-bd.gC{color:#38bdf8;background:rgba(14,165,233,.14)}.sm-bd.gD{color:#fb923c;background:rgba(249,115,22,.16)}.sm-bd.gE{color:#f472b6;background:rgba(236,72,153,.16)}.sm-bd.gF{color:#f87171;background:rgba(239,68,68,.16)}
.sm-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.sm-3>div{border:1px solid var(--line);background:var(--in);border-radius:14px;text-align:center;padding:8px 4px}
.sm-3 small{display:block;color:var(--muted);font-size:11.5px}.sm-3 b{font-size:20px}
@media(max-width:560px){.sm-grid{grid-template-columns:1fr 1fr}.sem-pick .in{min-width:110px}}
.cl-sec{font-size:22px;font-weight:800;margin:4px 0 16px}
.cl-item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:16px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:transform .12s}
.cl-item:hover{transform:translateY(-1px);border-color:var(--ac)}
.cl-av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#9f1239,#be185d);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;color:#fff}
.cl-av.sm{width:40px;height:40px;font-size:18px}
.cl-mid{flex:1;min-width:0}.cl-mid b{display:block;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-mid small{display:block;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.cl-mid small.dim{opacity:.8}
.cl-end{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.cl-t{color:var(--bad);font-size:13px;font-weight:700}
.cl-bd{min-width:28px;height:26px;padding:0 8px;border-radius:999px;background:#be123c;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.cr-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cr-h small{display:block;color:var(--muted);font-size:12px}.cr-h b{display:block}
.cr-b{border:1px solid var(--line);background:var(--in);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:22px;cursor:pointer;line-height:1}
.empty{border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--in);color:var(--muted);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.pP{background:var(--oks);color:var(--ok)}.pA{background:var(--bads);color:var(--bad)}.pL{background:var(--warns);color:var(--warn)}.pC{background:var(--acs);color:var(--ac)}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.cnt .st{min-height:0;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.cnt .st .v{font-size:30px;margin:0}
.doc{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--in)}
.doc .di{font-size:26px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;border-radius:10px;padding:2px}.doc .di img{border-radius:6px;object-fit:contain}
.doc a{margin-left:auto;color:var(--ac);font-weight:700;text-decoration:none;white-space:nowrap}
body.inroom{overflow:hidden}
body.inroom main{height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;padding-bottom:14px!important}
body.inroom #view{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-room{display:flex;flex-direction:column;flex:1;min-height:0;padding:0;background:transparent;border:0;margin-bottom:0}
.chat-room .cr-h{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:8px 14px 8px 10px;margin-bottom:8px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.chat-room .cr-h b{font-size:15px;line-height:1.35}
#msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:6px 4px;gap:0;overscroll-behavior:contain}
.cx-date{align-self:center;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;margin:14px 0 8px}
.cx-row{display:flex;align-items:flex-end;gap:8px;max-width:92%;margin-top:3px}.cx-row.first{margin-top:10px}
.cx-row.cl{align-self:flex-start}.cx-row.cr{align-self:flex-end;flex-direction:row-reverse}
.cx-av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.18)}.cx-av.sp{visibility:hidden;box-shadow:none}
.cx-bub{background:var(--bg-in,#fff);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:7px 13px 6px;box-shadow:0 2px 8px rgba(0,0,0,.06);line-height:1.55;word-break:break-word;overflow-wrap:anywhere;min-width:0}
[data-theme=dark] .cx-bub{background:var(--in)}
:root:not([data-theme=dark]) .cx-bub{background:#fff}
.cx-row.cl:not(.last) .cx-bub{border-bottom-left-radius:20px}.cx-row.cl.last .cx-bub{border-bottom-left-radius:6px}
.cx-row.cr .cx-bub{background:var(--acs);border-color:transparent;border-bottom-right-radius:6px}.cx-row.cr:not(.last) .cx-bub{border-bottom-right-radius:20px}
.cx-who{font-size:13px;font-weight:700;color:var(--ok);margin-bottom:1px}.cx-who.t{color:var(--gold)}
.cx-t{float:right;margin:7px 0 -2px 12px;font-size:11.5px;color:var(--muted)}.cx-bub::after{content:"";display:block;clear:both}
.cx-dock{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:8px 8px 8px 14px;margin-top:8px;display:flex;align-items:flex-end;gap:6px;box-shadow:0 -2px 14px rgba(0,0,0,.08)}
.cx-dock textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-family:inherit;font-size:15px;line-height:1.5;padding:9px 4px;max-height:120px;height:42px}
.cx-send{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,#000));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.25)}.cx-send:active{transform:scale(.92)}
.cx-tool{width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--text);font-size:20px;cursor:pointer;flex-shrink:0}.cx-tool:hover{background:var(--in)}
.cx-send.rec{background:#ef4444;animation:cxp 1s infinite}@keyframes cxp{50%{opacity:.6}}
.cx-recbar{flex:1;display:none;align-items:center;gap:10px;color:#ef4444;font-weight:700;padding:0 6px}.cx-recbar button{background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;margin-left:auto}
.cx-img{display:block;max-width:min(260px,64vw);max-height:300px;width:100%;object-fit:cover;border-radius:14px;cursor:zoom-in;margin:2px 0 4px}
.cx-audio{display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:12px;min-width:min(250px,62vw);padding:4px 0 0}
.cx-play{width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:17px;cursor:pointer;grid-row:1/3;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.cx-spd{grid-row:1/3;background:none;border:0;color:var(--ac);font-weight:700;font-size:14px;cursor:pointer;padding:4px;min-width:34px;font-family:inherit}
.cx-wave{display:flex;align-items:center;gap:2px;height:30px}.cx-wave i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:var(--line);display:block}.cx-wave i.on{background:var(--ac)}
.cx-am{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px;gap:8px}
.cx-cap{display:block}
.cx-lb{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out}.cx-lb img{max-width:96vw;max-height:94vh;border-radius:8px}
.cx-mem{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}.cx-mem:last-child{border:0}.cx-mem b{font-weight:600}.cx-mem small{color:var(--muted);display:block;font-size:12px}
.cx-sec{font-size:12px;font-weight:700;color:var(--muted);padding:10px 6px 2px}
.cx-ban{margin-top:8px;padding:12px;border-radius:18px;background:rgba(239,68,68,.12);color:#ef4444;font-size:13.5px;text-align:center;display:none}
.info{display:grid;grid-template-columns:150px 1fr;gap:8px 12px}.info span{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.notice{background:var(--warns);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.tip{padding:10px 12px;border-left:3px solid var(--ac);background:var(--in);border-radius:8px;margin-top:8px}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;z-index:50;transform:none;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -6px 22px rgba(0,0,0,.25)}
  aside .who,aside .sp,aside .side-foot{display:none}
  aside nav{display:flex;width:100%;gap:2px}
  nav button{flex:1;min-width:0;flex-direction:column;justify-content:center;gap:3px;padding:7px 2px;margin:0;font-size:10.5px;text-align:center;border-radius:12px}
  nav button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav svg{width:22px;height:22px}
  nav button.on{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,#000))}
  main{padding-bottom:92px!important}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .top button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
  main{padding:14px}
  .stats{grid-template-columns:1fr 1fr}.cnt{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}
  .tabs{grid-template-columns:1fr 1fr}.info{grid-template-columns:1fr}
  .hero h2{font-size:21px}
}
</style>
<style id="acctCss">
.ac-bg{position:fixed;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(6px);z-index:9000;display:none;align-items:center;justify-content:center;padding:14px}
.ac-bg.show{display:flex}
.ac{width:min(460px,100%);max-height:calc(100vh - 28px);overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.ac-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;font-weight:800;font-size:17px;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--line)}
.ac-x{border:0;background:var(--in);color:var(--muted);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
.ac-top{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 20px 16px;background:linear-gradient(160deg,var(--acs),transparent)}

<body>

<!-- កម្មវិធី -->
<div id="app" class="hide">
  <aside id="side">
    <div class="who" onclick="openAcct()" style="cursor:pointer" title="ព័ត៌មានគណនី"><div class="av" id="avSide"></div><div><b id="nmSide"></b><small>សិស្ស</small></div></div>
    <nav id="nav"></nav>
    <div class="sp"></div>
    <div class="side-foot"><button onclick="toggleTheme()" title="ពណ៌ងងឹត/ភ្លឺ">🌓</button><button onclick="logout()">ចាកចេញ</button></div>
  </aside>
  <main>
    <div class="top"><div class="av" id="avTop" onclick="openAcct()" style="width:38px;height:38px;font-size:16px;cursor:pointer" title="ព័ត៌មានគណនី"></div><b id="ttl" style="flex:1"></b><button onclick="toggleTheme()" title="ពណ៌ងងឹត/ភ្លឺ">🌓</button></div>
    <div id="view"></div>
  </main>
</div>

<script>
const SB=window.supabase?supabase.createClient("https://nggnuobnrxiqjtcwlvwk.supabase.co","sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML"):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='krou_student_session';
const MONTHS=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
const SEM1=['វិច្ឆិកា','ធ្នូ','មករា','កុម្ភៈ','មីនា','មេសា'],SEM2=['ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា'];
const ORDER=[...SEM1,...SEM2];
const CHAT_CAN_SEND=true; // កំណត់ false ដើម្បីឱ្យសិស្សអានតែប៉ុណ្ណោះ
let TOKEN=null,ME=null,SCORES=[],view='dash',sTab='month',chatLast=0,chatTimer=null;

/* ── ពណ៌ ── */
function applyPrimary(c){const r=document.documentElement.style;
  if(!c){['--ac','--acs','--side'].forEach(k=>r.removeProperty(k));return}
  r.setProperty('--ac',c);r.setProperty('--acs','color-mix(in srgb,'+c+' 16%,var(--card))');r.setProperty('--side','color-mix(in srgb,'+c+' 55%,#0b1220)')}
function applyTheme(v){document.documentElement.setAttribute('data-theme',v==='light'?'light':'dark')}
function syncFromIndex(){try{
  let t=localStorage.getItem('krou_theme_manual');
  if(localStorage.getItem('krou_theme_auto')==='1'){const h=new Date().getHours();t=(h>=6&&h<18)?'light':'dark'}
  applyTheme(t||localStorage.getItem('krou_student_theme')||'dark');
  applyPrimary(localStorage.getItem('krou_theme_primary'))}catch(e){applyTheme('dark')}}
syncFromIndex();
window.addEventListener('storage',e=>{if(['krou_theme_manual','krou_theme_auto','krou_theme_primary'].includes(e.key))syncFromIndex()});
function toggleTheme(){const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(n);try{localStorage.setItem('krou_theme_manual',n);localStorage.setItem('krou_student_theme',n);localStorage.removeItem('krou_theme_auto')}catch(e){}}

/* ── RPC ── */
async function rpc(n,a){
  if(!SB)throw new Error('មិនអាចភ្ជាប់ Supabase');
  const {data,error}=await SB.rpc(n,a);
  if(error)throw error;
  return data;
}
async function tk(n,a){ // function ដែលត្រូវការ token
  const d=await rpc(n,{p_token:TOKEN,...(a||{})});
  if(d===null){logout(true);throw new Error('session ផុតកំណត់')}
  return d;
}

/* ── ចូល/ចេញ (ទំព័រ login ស្ថិតក្នុង index.html) ── */
const LOGIN_URL='index.html?login=student';
function goLogin(q){location.replace(LOGIN_URL+(q||''))}
/* logout ស្របគ្នាគ្រប់ tab */
window.addEventListener('storage',function(e){if(e.key===KEY&&!e.newValue&&TOKEN){clearInterval(chatTimer);TOKEN=null;ME=null;goLogin();}});
async function logout(silent){
  clearInterval(chatTimer);
  try{if(TOKEN&&!silent)await rpc('student_logout',{p_token:TOKEN})}catch(e){}
  TOKEN=null;ME=null;try{localStorage.removeItem(KEY);localStorage.removeItem(STATE_KEY)}catch(e){}
  goLogin();
}
/* ── ចងចាំផ្នែកដែលកំពុងមើល (refresh នៅដដែល) ── */
const STATE_KEY='krou_student_state';
function saveState(){try{localStorage.setItem(STATE_KEY,JSON.stringify({view,sTab,sMonth,aM,aY}))}catch(e){}}
function loadState(){
  try{
    const st=JSON.parse(localStorage.getItem(STATE_KEY)||'null');if(!st)return;
    if(NAV.some(n=>n[0]===st.view))view=st.view;
    if(['month','sem','semavg','year'].includes(st.sTab))sTab=st.sTab;
    if(MONTHS.includes(st.sMonth))sMonth=st.sMonth;
    if(Number.isInteger(st.aM)&&st.aM>=0&&st.aM<=11)aM=st.aM;
    if(Number.isInteger(st.aY)&&st.aY>2000&&st.aY<2100)aY=st.aY;
  }catch(e){}
}

/* ── ចាប់ផ្តើម ── */
const ICONS={
 dash:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 score:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
 att:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/>',
 lib:'<path d="M4 4v16M9 4v16M14 6l5 14M14 6l3-1"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8 8 0 1 1 21 12z"/>',
 me:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/>'
};
const NAV=[['dash','ផ្ទាំងខ្ញុំ'],['score','ពិន្ទុខ្ញុំ'],['att','វត្តមានខ្ញុំ'],['lib','បណ្ណាល័យឯកសារ'],['chat','សារសន្ទនា'],['me','ព័ត៌មានផ្ទាល់ខ្លួន']];
function start(){
  $('app').classList.remove('hide');
  const av=ME.photo_url?`<img src="${esc(ME.photo_url)}" alt="">`:esc((ME.student_name||'?').trim().charAt(0));
  $('avSide').innerHTML=av;$('avTop').innerHTML=av;$('nmSide').textContent=ME.student_name||'';
  $('nav').innerHTML=NAV.map(([k,t])=>`<button data-k="${k}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICONS[k]}</svg><span>${t}</span></button>`).join('');
  loadState();
  go(ME.must_change?'me':(view||'dash'));
}
function go(k){document.body.classList.remove('inroom');
  if(ME&&ME.must_change&&k!=='me'){return}
  view=k;saveState();clearInterval(chatTimer);chatTimer=null;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('ttl').textContent=(NAV.find(n=>n[0]===k)||[])[1]||'';
  side.classList.remove('open');
  ({dash:vDash,score:vScore,att:vAtt,lib:vLib,chat:vChat,me:vMe})[k]();
}
const load=m=>{$('view').innerHTML=`<div class="empty">⏳ ${m||'កំពុងទាញយក...'}</div>`};
const R2=x=>Number(Number(x).toFixed(2));
const combine2=(a,b)=>(a>0&&b>0)?(a+b)/2:(a>0?a:(b>0?b:0));
const rowOf=(t,p)=>SCORES.find(s=>s.score_type===t&&s.period===p&&!s.hidden);
const hiddenOf=(t,p)=>SCORES.some(s=>s.score_type===t&&s.period===p&&s.hidden);
async function getScores(){SCORES=await tk('student_scores')||[];return SCORES}
const lockedBox=(what)=>`<div style="text-align:center;padding:30px 14px"><div style="font-size:42px">🔒</div><b style="font-size:16px">${what?esc(what)+' ':''}មិនទាន់ត្រូវបានផ្សាយ</b><p style="color:var(--muted);margin:8px 0 0">សូមរង់ចាំគ្រូផ្សាយលទ្ធផលនេះ។</p></div>`;
const noRes=()=>`<div class="card">${lockedBox('លទ្ធផល')}</div>`;
const semHidden=(months,exam)=>hiddenOf('semester',exam)||months.some(m=>hiddenOf('monthly',m));
async function ensureScores(){if(!SCORES.length||view==='dash'){await getScores()}}
function semCalc(months,exam){
  let sum=0,c=0;months.forEach(m=>{const r=rowOf('monthly',m);if(r&&+r.average>0){sum+=+r.average;c++}});
  const mo=c?sum/c:0,er=rowOf('semester',exam),ex=er&&+er.average>0?+er.average:0;
  return {mo,ex,sem:R2(combine2(mo,ex))};
}
function gradeOf(a){a=+a;return a>=9?'A':a>=8?'B':a>=7?'C':a>=6?'D':a>=5?'E':'F'}

/* ── ផ្ទាំងខ្ញុំ ── */
async function vDash(){
  load();
  try{await ensureScores()}catch(e){$('view').innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
  if(!SCORES.some(x=>!x.hidden)&&SCORES.some(x=>x.hidden)){$('view').innerHTML=noRes();return}
  const done=ORDER.map((m,i)=>({m,i,r:rowOf('monthly',m)})).filter(x=>x.r&&+x.r.average>0);
  const cur=done.length?done[done.length-1]:null,prev=done.length>1?done[done.length-2]:null;
  const r=cur&&cur.r;
  const avg=r?+r.average:0,rank=r&&r.rank?+r.rank:null,grade=r?(r.grade_label||gradeOf(avg)):'—';
  const pass=r?(r.result||(avg>=5?'ជាប់':'ធ្លាក់')):'—';
  const up=prev&&avg>+prev.r.average;
  const gt={A:'ពូកែ',B:'ល្អណាស់',C:'ធ្វើបានល្អ',D:'មធ្យម',E:'ខ្សោយ',F:'ត្រូវខំប្រឹងបន្ថែម'}[grade]||'';
  $('view').innerHTML=`
  <div class="card hero"><div class="ic">🎓</div><div><small>សួស្តី</small><h2>${esc(ME.student_name)}</h2><div style="color:var(--muted)">មើលពិន្ទុ ចំណាត់ថ្នាក់ និងគន្លឹះរៀនឲ្យកាន់តែប្រសើរ។</div></div></div>
  ${r?`<div class="stats">
    <div class="st"><div class="h">🏆 ចំណាត់ថ្នាក់</div><div class="v" style="color:var(--gold)">${rank??'—'}</div><div class="s">${rank?`ក្នុងថ្នាក់ (${r.class_size} នាក់)`:'មិនទាន់មាន'} · ខែ${esc(cur.m)}</div></div>
    <div class="st"><div class="h">📈 មធ្យមភាគ</div><div class="v">${avg.toFixed(2)}</div><div class="bar"><i style="width:${Math.min(100,avg*10)}%"></i></div><div class="s">${avg.toFixed(2)} / 10</div></div>
    <div class="st"><div class="h">🏅 និទ្ទេស</div><div class="v">${esc(grade)}</div><div class="s">${esc(gt)}</div></div>
    <div class="st"><div class="h">🎯 ស្ថានភាព</div><div class="v" style="color:${pass==='ជាប់'?'var(--ok)':'var(--bad)'}">${esc(pass)}</div><div class="s">${pass==='ជាប់'?'បន្តខិតខំរក្សាលទ្ធផលល្អ':'ត្រូវខិតខំបន្ថែម'}</div></div>
  </div>
  <div class="chips">${rank&&rank<=3?`<span class="chip g">🏅 កំពូលលេខ ${rank}</span>`:''}${pass==='ជាប់'?'<span class="chip k">✔ ឡើងថ្នាក់</span>':''}${up?'<span class="chip b">↗ រីកចម្រើន</span>':''}</div>`
  :`<div class="card"><div class="empty">មិនទាន់មានពិន្ទុនៅឡើយទេ។ សូមរង់ចាំគ្រូបញ្ចូលពិន្ទុ។</div></div>`}
  <div class="card"><b>✨ គន្លឹះរៀនបន្ទាប់</b><div style="color:var(--muted);margin:4px 0 10px">ចុចដើម្បីទទួលបានគន្លឹះរៀនខ្លីៗ ផ្អែកលើលទ្ធផលរបស់អ្នក។</div>
    <button class="btn sm" onclick="tips(${avg},${up?1:0},${prev?1:0})">បង្កើតគន្លឹះរៀន</button><div id="tips"></div></div>`;
}
function tips(avg,up,hasPrev){
  const t=[];
  if(!avg)t.push('រង់ចាំគ្រូបញ្ចូលពិន្ទុ ហើយត្រឡប់មកមើលម្តងទៀត។');

let SUBJ=null;

function groupsOf(type){
  const t=type==='monthly'?'monthly':'semester',rows=(SUBJ||[]).filter(x=>x.subject_type===t);
  if(!rows.length)return (t==='monthly'?TPL_M:TPL_S).map(g=>({l:g.l,c:g.c.map(x=>({k:x[0],n:x[1],m:10}))}));
  return rows.filter(x=>!x.parent_id).map(p=>{
    const ch=rows.filter(x=>String(x.parent_id)===String(p.id));
    const mk=x=>({k:x.code||('sub_'+x.id),n:x.name,m:+x.max_score||10});
    return {l:p.name,c:ch.length?ch.map(mk):[mk(p)]};

}

}

async function toggleRecS(){

    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    recChunks=[];recCancelS=false;rec=new MediaRecorder(stream,Object.assign(mt?{mimeType:mt}:{},{audioBitsPerSecond:24000}));
    rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
    rec.onstop=async()=>{clearInterval(recTm);recUiS(false);stream.getTracks().forEach(t=>t.stop());
      if(recCancelS||!recChunks.length)return;
      const blob=new Blob(recChunks,{type:rec.mimeType||'audio/mp4'});

    rec.start(250);recSec=0;document.getElementById('cxRecT').textContent='0:00';recUiS(true);

  const dobT=dob&&!isNaN(dob)?`ថ្ងៃទី ${dob.getDate()} ខែ${MONTHS[dob.getMonth()]} ឆ្នាំ ${dob.getFullYear()}`:'—';
  const rows=[['លេខសិស្ស',m.student_id],['ភេទ',m.gender],['ថ្នាក់',m.grade],['ថ្ងៃខែឆ្នាំកំណើត',dobT],['ទីកន្លែងកំណើត',m.pob],['ឈ្មោះឪពុក',[m.father_name,m.father_job].filter(Boolean).join(' · ')],['ឈ្មោះម្តាយ',[m.mother_name,m.mother_job].filter(Boolean).join(' · ')],['លេខទូរស័ព្ទ',m.phone],['អាសយដ្ឋាន',m.address]];
  $('view').innerHTML=`${m.must_change?'<div class="notice">🔐 នេះជាការចូលលើកដំបូង។ សូមប្តូរពាក្យសម្ងាត់ថ្មី មុននឹងប្រើមុខងារផ្សេង។</div>':''}
  <div class="two"><div class="card"><div class="hero" style="margin-bottom:14px"><div class="av" style="width:72px;height:72px;font-size:28px">${m.photo_url?`<img src="${esc(m.photo_url)}" alt="">`:esc((m.student_name||'?').charAt(0))}</div><div><h2 style="font-size:22px;color:var(--text)">${esc(m.student_name)}</h2><small>${esc(m.username)}</small></div></div>
    <div class="info">${rows.map(([k,v])=>`<span>${k}៖</span><b style="font-weight:400">${esc(v||'—')}</b>`).join('')}</div></div>
  <div class="card"><b>🔒 ផ្លាស់ប្តូរពាក្យសម្ងាត់</b>
    <label class="f">ពាក្យសម្ងាត់បច្ចុប្បន្ន</label><input id="po" type="password" class="in" autocomplete="current-password">
    <label class="f">ពាក្យសម្ងាត់ថ្មី (យ៉ាងតិច ៦ តួ)</label><input id="pn" type="password" class="in" autocomplete="new-password">
    <label class="f">បញ្ជាក់ពាក្យសម្ងាត់ថ្មី</label><input id="pc" type="password" class="in" autocomplete="new-password">
    <button class="btn" onclick="changePw()">ផ្លាស់ប្តូរ</button><div class="err" id="perr"></div></div></div>`;
}
async function changePw(){
  const o=po.value,n=pn.value,c=pc.value,e=$('perr');e.style.display='block';e.style.background='var(--bads)';e.style.color='var(--bad)';
  if(!o||!n){e.textContent='សូមបំពេញគ្រប់ប្រអប់';return}
  if(n.length<6){e.textContent='ពាក្យសម្ងាត់ថ្មីត្រូវមានយ៉ាងតិច ៦ តួ';return}
  if(n!==c){e.textContent='ពាក្យសម្ងាត់បញ្ជាក់មិនដូចគ្នា';return}
  if(n===o){e.textContent='ពាក្យសម្ងាត់ថ្មីត្រូវខុសពីចាស់';return}
  try{
    const ok=await tk('student_change_password',{p_old:o,p_new:n});
    if(!ok){e.textContent='ពាក្យសម្ងាត់បច្ចុប្បន្នមិនត្រឹមត្រូវ';return}
    ME.must_change=false;e.style.background='var(--oks)';e.style.color='var(--ok)';e.textContent='✅ ផ្លាស់ប្តូរពាក្យសម្ងាត់ជោគជ័យ';
    po.value=pn.value=pc.value='';setTimeout(()=>go('dash'),900);
  }catch(x){e.textContent='❌ '+(x.message||x)}
}

/* ── ចាប់ផ្តើមទំព័រ ── */
(async function init(){
  const qs=new URLSearchParams(location.search),qr=qs.get('qr');
  if(qr){
    try{history.replaceState(null,'',location.pathname)}catch(e){}
    try{
      const d=await rpc('student_login_qr',{p_qr:qr});
      if(d&&d.token){TOKEN=d.token;ME=d.profile;try{localStorage.setItem(KEY,JSON.stringify({token:TOKEN}));localStorage.removeItem(STATE_KEY)}catch(e){}start();return}
    }catch(e){}
    goLogin('&err=qr');return;
  }
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(s&&s.token){
    TOKEN=s.token;
    try{const me=await rpc('student_me',{p_token:TOKEN});if(me){ME=me;start();return}}catch(e){console.error('student init',e)}
    try{localStorage.removeItem(KEY);localStorage.removeItem(STATE_KEY)}catch(e){}
  }
  goLogin();
})();
</script>
<div class="ac-bg" id="acBg" onclick="if(event.target===this)closeAcct()"><div class="ac" role="dialog" aria-label="ព័ត៌មានគណនី">
  <div class="ac-h"><span>ព័ត៌មានគណនី</span><button class="ac-x" onclick="closeAcct()" aria-label="បិទ">✕</button></div>
  <div class="ac-top"><div class="ac-av" id="acAv" onclick="acFile.click()"></div>
    <input type="file" id="acFile" accept="image/jpeg,image/png,image/webp" hidden onchange="pickPhoto(this.files[0]);this.value=''">
    <a href="#" onclick="acFile.click();return false" style="color:var(--ac);font-size:13px;font-weight:700">📷 ផ្លាស់ប្តូររូបភាព</a>
    <div class="ac-nm" id="acNm"></div><div class="ac-sub" id="acSub"></div><div class="err" id="acPhErr"></div></div>
  <div class="ac-b">
    <div class="ac-code"><div><small>លេខសម្គាល់ (ឈ្មោះចូលប្រើ)</small><b id="acCode"></b></div><button class="ac-cp" onclick="copyAcct()">ចម្លង</button></div>
    <div class="ac-sec">🔒 ផ្លាស់ប្តូរពាក្យសម្ងាត់</div>
    <div class="ac-pw"><input id="ao" type="password" class="in" placeholder="ពាក្យសម្ងាត់បច្ចុប្បន្ន" autocomplete="current-password"><button type="button" class="ac-eye" onclick="eyeT('ao')">👁</button></div>
    <div class="ac-pw"><input id="an" type="password" class="in" placeholder="ពាក្យសម្ងាត់ថ្មី (យ៉ាងតិច ៦ តួ)" autocomplete="new-password"><button type="button" class="ac-eye" onclick="eyeT('an')">👁</button></div>
    <div class="ac-pw"><input id="ac" type="password" class="in" placeholder="បញ្ជាក់ពាក្យសម្ងាត់ថ្មី" autocomplete="new-password"><button type="button" class="ac-eye" onclick="eyeT('ac')">👁</button></div>
    <button class="btn" style="margin-top:2px" onclick="changePw2()">ផ្លាស់ប្តូរពាក្យសម្ងាត់</button><div class="err" id="aerr"></div>
    <button class="btn ghost" style="margin-top:4px" onclick="logout()">ចាកចេញពីគណនី</button>
  </div></div></div>
<script>
function acAvHtml(){return ME.photo_url?`<img src="${esc(ME.photo_url)}" alt="">`:esc((ME.student_name||'?').trim().charAt(0))}
function openAcct(){
  if(!ME)return;
  $('acAv').innerHTML=acAvHtml()+'<div class="ac-cam">📷</div>';$('acNm').textContent=ME.student_name||'';
  $('acSub').textContent='សិស្ស'+(ME.grade?' · ថ្នាក់ទី '+ME.grade:'');$('acCode').textContent=ME.username||ME.student_id||'';
  ['ao','an','ac'].forEach(i=>{$(i).value='';$(i).type='password'});$('aerr').style.display='none';$('acPhErr').style.display='none';
  $('acBg').classList.add('show');
}
function closeAcct(){$('acBg').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAcct()});
function eyeT(id){const i=$(id);i.type=i.type==='password'?'text':'password'}
function copyAcct(){const v=$('acCode').textContent;try{navigator.clipboard.writeText(v)}catch(e){const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const b=document.querySelector('.ac-cp');b.textContent='✓ បានចម្លង';setTimeout(()=>b.textContent='ចម្លង',1400)}
function acMsg(el,t,ok){el.style.display='block';el.className='err'+(ok?' ac-ok':'');el.textContent=t}
async function pickPhoto(f){
  const e=$('acPhErr');if(!f)return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){acMsg(e,'សូមជ្រើសរូប JPG/PNG/WEBP');return}
  if(f.size>8*1024*1024){acMsg(e,'រូបធំពេក (អតិបរមា 8 MB)');return}
  try{
    const url=URL.createObjectURL(f),img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    const S=320,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',.82);
    acMsg(e,'កំពុងរក្សាទុក…',true);
    const ok=await tk('student_set_photo',{p_photo:data});
    if(!ok)throw new Error('រក្សាទុកមិនបាន');
    ME.photo_url=data;$('acAv').innerHTML=acAvHtml()+'<div class="ac-cam">📷</div>';$('avSide').innerHTML=acAvHtml();$('avTop').innerHTML=acAvHtml();
    acMsg(e,'✅ បានផ្លាស់ប្តូររូបភាព',true);
  }catch(x){acMsg(e,'❌ '+(x.message||x))}
}
async function changePw2(){
  const o=$('ao').value,n=$('an').value,c=$('ac').value,e=$('aerr');
  if(!o||!n){acMsg(e,'សូមបំពេញគ្រប់ប្រអប់');return}
  if(n.length<6){acMsg(e,'ពាក្យសម្ងាត់ថ្មីត្រូវមានយ៉ាងតិច ៦ តួ');return}
  if(n!==c){acMsg(e,'ពាក្យសម្ងាត់បញ្ជាក់មិនដូចគ្នា');return}
  if(n===o){acMsg(e,'ពាក្យសម្ងាត់ថ្មីត្រូវខុសពីចាស់');return}
  try{
    const ok=await tk('student_change_password',{p_old:o,p_new:n});
    if(!ok){acMsg(e,'ពាក្យសម្ងាត់បច្ចុប្បន្នមិនត្រឹមត្រូវ');return}
    ME.must_change=false;acMsg(e,'✅ ផ្លាស់ប្តូរពាក្យសម្ងាត់ជោគជ័យ',true);['ao','an','ac'].forEach(i=>$(i).value='');
  }catch(x){acMsg(e,'❌ '+(x.message||x))}
}
</script>
