<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>វេនសម្អាត - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root,[data-theme="light"]{--bg:#e8f6fb;--bg2:#f4fbf7;--surface:#fff;--elev:#eef4f8;--border:#cfe3ee;--text:#0f172a;--muted:#5b6b80;--primary:#0369a1;--ok:#059669;--danger:#dc2626;--warn:#d97706;--shadow:0 8px 24px rgba(15,23,42,.07)}
[data-theme="dark"]{--bg:#0a1220;--bg2:#0c1626;--surface:#131e33;--elev:#1a2840;--border:#23324d;--text:#f1f5f9;--muted:#9aa8bd;--primary:#38bdf8;--ok:#34d399;--danger:#f87171;--warn:#fbbf24;--shadow:0 8px 24px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Khmer OS Battambang','Battambang',sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:16px 16px 90px;font-size:13.5px;line-height:1.5}
button,input,select,textarea{font-family:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.back{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:18px;flex-shrink:0}
h1{font-size:19px;font-weight:800;flex:1;min-width:160px}
.in,select.in{height:38px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);padding:0 10px;font-size:13.5px;min-width:0}
.btn{height:38px;padding:0 15px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);font-weight:700;cursor:pointer;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dirty{box-shadow:0 0 0 3px rgba(245,158,11,.45)}
.btn.dng{color:var(--danger)}
.panel{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.tw{overflow:auto;border:1px solid var(--border);border-radius:12px;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--elev);padding:8px 8px;font-weight:800;border-bottom:1px solid var(--border);white-space:nowrap;text-align:center;z-index:1}
td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:center}
td.l{text-align:left}
td input,td select{width:100%;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);padding:0 8px;font-size:13px;text-align:center}
td input.l{text-align:left}
.note{color:var(--muted);font-size:12.5px;margin:6px 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:4px 12px;font-weight:700}
.auth{display:none;text-align:center;padding:80px 16px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;z-index:100001;display:none;max-width:92vw}
.dlg-bg{position:fixed;inset:0;z-index:100000;background:rgba(10,18,32,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px}
.dlg{background:var(--surface);border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dlg h3{margin:6px 0}.dlg p{color:var(--muted);white-space:pre-line;margin-bottom:16px}
.dlg .acts{display:flex;gap:10px}.dlg .acts button{flex:1;height:44px;border-radius:12px;border:0;font-weight:800;font-size:15px;cursor:pointer;background:rgba(127,127,127,.16)}
.dlg .acts .pri{background:var(--ok);color:#fff}.dlg.danger .acts .pri{background:var(--danger)}
.printhead{display:none}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.g{border:1.5px solid var(--border);border-radius:12px;padding:8px 10px}.g h4{margin-bottom:4px;font-size:14px}.g li{margin-left:18px;font-size:13px}.g .day{color:var(--primary);font-weight:700;font-size:12.5px;margin-bottom:4px}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff!important;color:#000!important;padding:0}
  .bar,.noprint,.toast{display:none!important}
  .panel,.tw{border:0!important;box-shadow:none!important;max-height:none!important;overflow:visible!important;padding:0!important}
  th{position:static;background:#eee!important;color:#000!important}
  td,th{border:1px solid #444!important;color:#000!important}
  td input,td select{border:0!important;background:transparent!important;color:#000!important;appearance:none;-webkit-appearance:none}
  .printhead{display:block;text-align:center;margin-bottom:8px}
  .printhead b{font-size:16px}
}
</style>
</head>
<body>
<div class="auth" id="auth"><h2>🔒 សូមចូលប្រព័ន្ធជាមុន</h2></div>
<div id="main">
<div class="bar">
  <button class="back" onclick="goHub()" title="ត្រឡប់">‹</button>
  <h1>🧹 វេនសម្អាត</h1>
  <select class="in" id="clsSel" onchange="onClass()" style="display:none"></select>
  <span class="chip" id="clsBadge" style="display:none"></span>
  <input class="in" id="ng" type="number" min="2" max="10" value="5" style="width:70px" title="ចំនួនក្រុម" onchange="D.n=+this.value||5">
  <button class="btn" onclick="autoSplit(false)">⚖️ ចែកស្មើ (ប្រុសស្រីលាយ)</button>
  <button class="btn" onclick="autoSplit(true)">🎲 ចែកចៃដន្យ</button>
  <button class="btn" onclick="window.print()">🖨️ បោះពុម្ព</button>
  <button class="btn pri" id="saveBtn" onclick="save()">💾 រក្សាទុក</button>
</div>
<div class="printhead"><b>សាលាបឋមសិក្សាកំពង់ល្ពៅ</b><br><b id="phTitle">វេនសម្អាត</b> · <span id="phSub"></span></div>
<div class="panel"><div class="bar" style="margin:0 0 8px"><b>ប្រធានថ្នាក់៖</b> <select class="in" id="leader" onchange="D.leader=this.value;setDirty(true)"></select>
  <span class="note noprint">ជ្រើសក្រុមឱ្យសិស្សម្នាក់ៗ ឬចុចប៊ូតុងចែកស្វ័យប្រវត្តិខាងលើ ហើយកំណត់ក្រុមតាមថ្ងៃ។</span></div>
  <div class="tw" style="margin-bottom:12px"><table><thead><tr><th>ថ្ងៃ</th><th>ច័ន្ទ</th><th>អង្គារ</th><th>ពុធ</th><th>ព្រហស្បតិ៍</th><th>សុក្រ</th></tr></thead><tbody><tr><td>ក្រុម</td>
    <td><select id="d1" onchange="setDay(1,this.value)"></select></td><td><select id="d2" onchange="setDay(2,this.value)"></select></td><td><select id="d3" onchange="setDay(3,this.value)"></select></td><td><select id="d4" onchange="setDay(4,this.value)"></select></td><td><select id="d5" onchange="setDay(5,this.value)"></select></td></tr></tbody></table></div>
  <div class="bar" style="margin:0 0 8px"><b>ភារកិច្ច៖</b> <input class="in" id="task" style="flex:1" placeholder="ឧ. បោសសម្អាតថ្នាក់ · ជូតក្តារខៀន · ស្រោចដើមឈើ" oninput="D.task=this.value;setDirty(true)"></div></div>
<div class="panel"><div id="groups" class="gwrap"></div></div>
<div class="panel noprint"><div class="tw"><table><thead><tr><th>ល.រ</th><th>ឈ្មោះសិស្ស</th><th>ភេទ</th><th>ក្រុម</th></tr></thead><tbody id="tb"></tbody></table></div></div>
<div id="body"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=supabase.createClient("https://nggnuobnrxiqjtcwlvwk.supabase.co","sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML");
let USER=null;try{USER=JSON.parse(localStorage.getItem('krou_supabase_user')||'null')}catch(e){}
const IS_ADMIN=String(USER&&USER.role||'').toLowerCase().trim()==='admin';
const USER_CLASS=(USER&&(USER.assigned_classes||USER.assigned_class))||'';
const KIND='cleaning';
function cleanGrade(g){return String(g||'').replace(/^(ថ្នាក់ទី|ថ្នាក់)\s*/,'').trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}
applyTheme(new URLSearchParams(location.search).get('theme')||localStorage.getItem('krou_theme_manual')||'dark');
window.addEventListener('message',e=>{if(e.data&&(e.data.type==='THEME_CHANGE'||e.data.theme))applyTheme(e.data.theme||e.data)});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function uiConfirm(msg,o){o=o||{};return new Promise(res=>{const bg=document.createElement('div');bg.className='dlg-bg';
  bg.innerHTML='<div class="dlg '+(o.danger?'danger':'')+'"><div style="font-size:30px">'+(o.danger?'🗑️':'❓')+'</div><h3>'+esc(o.title||'សូមបញ្ជាក់')+'</h3><p>'+esc(msg)+'</p><div class="acts"><button data-v="0">បដិសេធ</button><button class="pri" data-v="1">'+esc(o.okText||'យល់ព្រម')+'</button></div></div>';
  bg.addEventListener('click',e=>{const b=e.target.closest('button');if(b){bg.remove();res(b.dataset.v==='1')}else if(e.target===bg){bg.remove();res(false)}});document.body.appendChild(bg)})}
function goHub(){try{parent.postMessage({type:'NAVIGATE',page:'classes'},'*')}catch(e){}if(window.parent===window)location.href='classes.html'}
let curClass='',students=[],D={},dirty=false,seq=0;
function setDirty(v){dirty=v;document.getElementById('saveBtn').classList.toggle('dirty',v)}
async function rpc(fn,args){
  let pw='';try{pw=localStorage.getItem('krou_pw')||''}catch(e){}
  if(!USER||!USER.username||!pw)throw new Error('សូមចាកចេញ រួចចូលប្រព័ន្ធឡើងវិញ');
  const {data,error}=await sb.rpc(fn,Object.assign({p_u:USER.username,p_p:pw},args||{}));
  if(error)throw error;
  if(data&&data.error){if(data.error==='auth'){try{localStorage.removeItem('krou_pw')}catch(e){}}throw new Error(data.error==='forbidden'?'គ្មានសិទ្ធិលើថ្នាក់នេះ':data.error==='auth'?'ពាក្យសម្ងាត់មិនត្រឹមត្រូវ សូមចូលប្រព័ន្ធឡើងវិញ':data.error)}
  return data;
}
async function init(){
  if(!USER||!USER.username){document.getElementById('main').style.display='none';document.getElementById('auth').style.display='block';return}
  const sel=document.getElementById('clsSel'),badge=document.getElementById('clsBadge'),mine=cleanGrade(USER_CLASS);
  if(!IS_ADMIN){
    if(!mine){document.getElementById('body').innerHTML='<div class="panel" style="text-align:center;color:var(--warn);font-weight:700">⚠️ អ្នកមិនទាន់មានថ្នាក់ — សូមបង្កើតថ្នាក់ក្នុង «ថ្នាក់ និងសិស្ស» ជាមុន</div>';return}
    badge.textContent='ថ្នាក់ទី '+mine;badge.style.display='inline-block';curClass=mine;await load();return;
  }
  sel.style.display='inline-block';
  try{
    const {data}=await sb.from('students').select('grade');
    const cls=[...new Set((data||[]).map(d=>cleanGrade(d.grade)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'km'));
    sel.innerHTML=cls.map(c=>'<option value="'+esc(c)+'">ថ្នាក់ទី '+esc(c)+'</option>').join('')||'<option value="">គ្មានថ្នាក់</option>';
    if(mine&&cls.includes(mine))sel.value=mine;curClass=sel.value;await load();
  }catch(e){sel.innerHTML='<option value="">កំហុសទាញថ្នាក់</option>'}
}
async function onClass(){
  if(dirty&&!await uiConfirm('មានការកែមិនទាន់រក្សាទុក។ ប្តូរថ្នាក់ហើយបោះបង់?',{okText:'ប្តូរ'})){document.getElementById('clsSel').value=curClass;return}
  curClass=document.getElementById('clsSel').value;await load();
}
async function load(){
  const my=++seq;students=[];D={};setDirty(false);
  document.getElementById('phSub').textContent='ថ្នាក់ទី'+curClass;
  if(!curClass){draw();return}
  try{
    const {data,error}=await sb.from('students').select('id,student_id,student_name,gender,grade,dob,dropout_semester').order('id',{ascending:true});
    if(error)throw error;if(my!==seq)return;
    students=(data||[]).filter(s=>cleanGrade(s.grade)===curClass).filter(s=>{const d=String(s.dropout_semester||'').trim();return!(d.includes('ឆមាស១')||d.includes('ឆមាសទី១')||d==='១')})
      .map(s=>({id:String((s.student_id&&String(s.student_id).trim())||s.id),name:s.student_name||'គ្មានឈ្មោះ',sex:s.gender||'',dob:s.dob||''}))
      .sort((a,b)=>a.name.localeCompare(b.name,'km'));
  }catch(e){toast('❌ ទាញសិស្សមិនបាន៖ '+e.message)}
  try{const d=await rpc('staff_class_tool_get',{p_class:curClass,p_kind:KIND});D=(d&&d.data)||{}}
  catch(e){D={};toast('⚠️ ទាញទិន្នន័យមិនបាន — ត្រូវ run class_tools.sql ឬ '+e.message)}
  if(my!==seq)return;
  if(typeof afterLoad==='function')afterLoad();
  draw();
}
async function save(){
  if(!curClass)return;
  try{await rpc('staff_class_tool_save',{p_class:curClass,p_kind:KIND,p_data:D});setDirty(false);toast('✅ បានរក្សាទុក')}
  catch(e){toast('❌ រក្សាទុកមិនបាន៖ '+(e.message||e))}
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function afterLoad(){D.n=D.n||5;D.g=D.g||{};D.days=D.days||{};D.leader=D.leader||'';D.task=D.task||''}
const DAYN={1:'ច័ន្ទ',2:'អង្គារ',3:'ពុធ',4:'ព្រហស្បតិ៍',5:'សុក្រ'};
function N(){return Math.max(2,Math.min(10,D.n||5))}
function setG(id,v){D.g[id]=+v;setDirty(true);draw()}
function setDay(d,v){D.days[d]=v===''?null:+v;setDirty(true);draw()}
function autoSplit(rand){const n=N();document.getElementById('ng').value=n;D.n=n;let arr=students.slice();
  if(rand){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}
  else{const f=arr.filter(s=>String(s.sex).includes('ស្រី')),m=arr.filter(s=>!String(s.sex).includes('ស្រី'));arr=[];const L=Math.max(f.length,m.length);for(let i=0;i<L;i++){if(m[i])arr.push(m[i]);if(f[i])arr.push(f[i])}}
  D.g={};arr.forEach((s,i)=>D.g[s.id]=(i%n)+1);
  for(let d=1;d<=5;d++)D.days[d]=((d-1)%n)+1;
  setDirty(true);draw()}
function draw(){
  const n=N();document.getElementById('ng').value=n;
  const opts=(v)=>'<option value="">—</option>'+Array.from({length:n},(_,i)=>'<option value="'+(i+1)+'"'+(v===i+1?' selected':'')+'>ក្រុម '+(i+1)+'</option>').join('');
  for(let d=1;d<=5;d++)document.getElementById('d'+d).innerHTML=opts((D.days||{})[d]);
  document.getElementById('leader').innerHTML='<option value="">— ជ្រើស —</option>'+students.map(s=>'<option value="'+esc(s.id)+'"'+(D.leader===s.id?' selected':'')+'>'+esc(s.name)+'</option>').join('');
  document.getElementById('task').value=D.task||'';
  const gs=Array.from({length:n},(_,i)=>i+1);
  document.getElementById('groups').innerHTML=(D.leader?'<div class="g" style="grid-column:1/-1"><b>ប្រធានថ្នាក់៖</b> '+esc((students.find(s=>s.id===D.leader)||{}).name||'')+(D.task?' · <span>'+esc(D.task)+'</span>':'')+'</div>':'')
   +gs.map(g=>{const ds=Object.keys(D.days||{}).filter(d=>D.days[d]===g).map(d=>DAYN[d]).join(' · ');const m=students.filter(s=>D.g[s.id]===g);
     return '<div class="g"><h4>ក្រុម '+g+' ('+m.length+')</h4><div class="day">'+(ds?'ថ្ងៃ៖ '+ds:'មិនទាន់កំណត់ថ្ងៃ')+'</div><ol>'+m.map(s=>'<li>'+esc(s.name)+'</li>').join('')+'</ol></div>'}).join('');
  document.getElementById('tb').innerHTML=students.map((s,i)=>'<tr><td>'+i+1+'</td><td class="l">'+esc(s.name)+'</td><td>'+esc(s.sex)+'</td><td><select onchange="setG(\''+esc(s.id).replace(/'/g,"\\'")+'\',this.value)">'+opts(D.g[s.id]||0).replace('>—<','>មិនទាន់<')+'</select></td></tr>').join('')
   ||'<tr><td colspan="4" style="padding:30px;color:var(--muted)">មិនទាន់មានសិស្សក្នុងថ្នាក់នេះ</td></tr>';
}
init();
</script>
</body>
</html>
