<!DOCTYPE html>
<html lang="km" data-theme="light">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>គណៈកម្មការគ្រប់គ្រងថ្នាក់ និងកំណត់ហេតុប្រជុំ</title>
<link href="https://fonts.googleapis.com/css2?family=Moul&family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2f9;--tb:rgba(255,255,255,.96);--line:#dfe6f1;--text:#0f172a;--muted:#64748b;--card:#fff;--in:#f8fafc;--inl:#cbd5e1;--ac:#4f46e5;--acs:#e0e7ff;--ok:#059669;--oks:#d1fae5;--bad:#e11d48;--bads:#ffe4e6;--thead:#eef2ff;--hd:#fff;color-scheme:light}
[data-theme=dark]{--bg:#0a1220;--tb:rgba(17,26,43,.96);--line:#24344f;--text:#f1f5f9;--muted:#9aa8bd;--card:#16233a;--in:#0f1b30;--inl:#34496b;--ac:#7dd3fc;--acs:#173a57;--ok:#34d399;--oks:#12392f;--bad:#fb7185;--bads:#3b1520;--thead:#101c31;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Battambang','Kantumruy Pro',sans-serif;font-size:14px;padding-bottom:90px}
button{font-family:inherit}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tb{position:sticky;top:0;z-index:50;background:var(--tb);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.pill label{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.fc{font:500 13px 'Battambang','Kantumruy Pro',sans-serif;background:var(--in);color:var(--text);border:1.5px solid var(--inl);border-radius:9px;padding:5px 9px;height:34px;outline:none;min-width:0}
.fc:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
textarea.fc{height:auto;min-height:74px;padding:8px 10px;line-height:1.7;resize:vertical;width:100%}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:12px;font:700 13px 'Battambang','Kantumruy Pro',sans-serif;cursor:pointer;background:var(--acs);color:var(--ac);transition:transform .15s,filter .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.07)}
.btn.ok{background:var(--oks);color:var(--ok)}
.btn.pri{background:#0369a1;color:#fff}
.btn.gh{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--bads);color:var(--bad)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px}
.sp{flex:1}
.dbst{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}.dbst i{width:8px;height:8px;border-radius:50%;background:#94a3b8}.dbst.ok i{background:#10b981}.dbst.err i{background:#f43f5e}.dbst.busy i{background:#f59e0b;animation:pl 1s infinite}@keyframes pl{50%{opacity:.3}}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:0 8px 28px rgba(15,23,42,.08)}
.hero .h1{display:flex;align-items:center;gap:14px}
.hero .ico{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#14b8a6,#0ea5e9);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 18px rgba(14,165,233,.35)}
.hero .ico svg{width:26px;height:26px}
.hero h1{font-size:18px;line-height:1.6;font-weight:700}
.hero .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.hero .cap{text-align:center;color:var(--muted);font-size:12.5px;margin:14px 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.acts .btn{height:42px;padding:0 16px;border-radius:14px;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ac)}
.acts .btn.x{background:var(--oks);color:var(--ok)}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:11px 18px;font:700 13.5px 'Battambang',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab.on{background:color-mix(in srgb,var(--ac) 16%,var(--card));border-color:var(--ac);color:var(--ac)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:0 8px 28px rgba(15,23,42,.06)}
.ph2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ph2 h2{font-size:15.5px;line-height:1.6}
.chip{display:inline-flex;align-items:center;background:var(--acs);color:var(--ac);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:10px 0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.ed{width:100%;border-collapse:collapse;min-width:1060px}
table.ed th{background:var(--thead);color:var(--text);font-size:12.5px;font-weight:700;padding:10px 6px;text-align:center;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.ed th.g{background:color-mix(in srgb,#10b981 16%,var(--thead))}
table.ed td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 5px;vertical-align:middle;text-align:center}
table.ed td:last-child{border-right:0}
table.ed td.no{color:var(--muted);width:44px}
table.ed td.sel{background:color-mix(in srgb,var(--ac) 18%,transparent)}
table.ed input.fc,table.ed .csb{width:100%;height:36px}
table.ed td[data-c="0"] input{min-width:130px}
table.ed td[data-c="4"] input{min-width:100px}
table.ed td[data-c="5"] .csb{min-width:170px;max-width:230px}
.ph{width:54px;height:54px;border-radius:50%;border:1.5px dashed var(--inl);background:var(--in);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;padding:0}
.phw{position:relative;display:inline-block}
.phx{position:absolute;top:-4px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--card);background:#e11d48;color:#fff;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.locked .phx{display:none}
.fc.bad,.csb.bad{border-color:var(--bad)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:22px;height:22px}
.del{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.del:hover{background:var(--bads);color:var(--bad)}
.cust{margin-top:5px}
.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.locked input.fc,.locked textarea.fc{pointer-events:none;opacity:.85}
.locked .csb,.locked .ph,.locked .del,.locked .addbtn{pointer-events:none;opacity:.55}
.mcard{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;background:var(--in)}
.mcard .mh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mcard .mh b{font-size:14.5px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mgrid label,.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 4px}
.att{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.at{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px 6px 8px;font:600 12.5px 'Battambang',sans-serif;cursor:pointer;color:var(--text)}
.at i{width:20px;height:20px;border-radius:50%;border:2px solid var(--inl);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff}
.at.on{background:var(--oks);border-color:var(--ok)}.at.on i{background:var(--ok);border-color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;line-height:1.9}
/* preview */
#pv{display:none}
.pvbar{position:sticky;top:0;z-index:60;background:#1f2328;color:#f1f5f9;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pvbar .btn{background:#363c45;color:#f1f5f9}
.pvbar .btn.pri{background:#0a84c9}
.pvbar .lb{flex-shrink:0;font-size:12.5px;font-weight:700;color:#e2e8f0;white-space:nowrap}
.pvbar .fc,.pvbar .csb{background:#1f2328;color:#e2e8f0;border:1px solid #4b5563;height:38px;border-radius:10px;font-weight:600}
.pvbar .dot{width:7px;height:7px;border-radius:50%;background:#818cf8;display:inline-block}
.stage{padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:18px;background:#4a5057;min-height:70vh}
.pvz{transform-origin:top center}
.sheet{width:210mm;min-height:297mm;background:#fff;color:#0f172a;padding:var(--mt,10mm) var(--ms,12mm) var(--mb,10mm);box-shadow:0 12px 40px rgba(0,0,0,.4);font-size:calc(14.5px*var(--fz,1));line-height:1.75;font-family:'Battambang','Kantumruy Pro',sans-serif;position:relative}
.sheet .inner{width:100%}
.moul{font-family:'Moul','Khmer OS Muol Light',serif;font-weight:400}
.kh1{text-align:center;font-size:1.45em;line-height:1.7}
.kh2{text-align:center;font-size:1.12em;line-height:1.7;margin-top:.1em}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:.15em 0 .5em;color:#334155}
.orn:before,.orn:after{content:'';width:68px;border-top:1.5px solid #334155}
.org{font-family:'Moul',serif;font-size:.88em;line-height:1.65;margin-top:.3em}
.dtl{text-align:center;font-family:'Moul',serif;font-size:1.28em;line-height:1.8;margin-top:.2em}
.yr{text-align:center;font-size:1.08em;margin-bottom:.4em}
table.dt{width:100%;border-collapse:collapse;font-size:1em;margin:.4em 0}
table.dt th,table.dt td{border:1px solid #1f2937;padding:.28em .5em;vertical-align:middle}
table.dt th{background:#eaeefb;text-align:center;font-weight:700}
table.dt td.c{text-align:center}
table.dt tr.grp td{background:#eaeefb;font-weight:700}
table.dt tr.sub td{background:#f4f6fc;font-weight:700;text-align:center}
table.dt td.mt{text-align:center;color:#64748b;font-style:italic}
.sig{display:flex;justify-content:space-between;gap:12px;margin-top:1.1em;align-items:flex-start}
.sg{text-align:center;line-height:1.9;min-width:0}
.sg .tt{font-family:'Moul',serif;font-size:.95em}
.sg .gap{height:3.4em}
.sg.blue{color:#1d4ed8}
.dots{display:inline-block;min-width:9em;border-bottom:0;letter-spacing:.06em}
.lt p{text-indent:2em;text-align:justify;margin:.3em 0}
.lt .ref{margin:.4em 0}
.lt h4{font-family:'Moul',serif;font-weight:400;text-align:center;font-size:1em;margin:.7em 0 .15em}
.lt ol{list-style:none;margin:.2em 0 0}
.lt ol li{padding-left:1.7em;text-indent:-1.7em;text-align:justify;margin:.1em 0}
.mn .meta{margin:.3em 0}
.mn h4{font-family:'Moul',serif;font-weight:400;font-size:1em;margin:.7em 0 .2em}
.mn .box{border:1px solid #94a3b8;border-radius:.4em;padding:.4em .7em;min-height:3.6em;white-space:pre-wrap;text-align:justify}
.mn .box.big{min-height:7em}
/* org chart */
.chart{--c1:#1e3a8a;--c2:#0f766e;--c3:#475569;--cb:#fff;--cd:#cbd5e1;--cl:#8b9bb4;--cp:#e2e8f0;--rad:.7em;--pr:50%;--dut:#475569}
.sheet[data-th=classic] .chart{--c1:#2f5597;--c2:#4472c4;--c3:#5b9bd5;--cb:#e2efd9;--cd:#5b7fbf;--cl:#2f5aa8;--cp:#deeaf6;--rad:0;--pr:.5em;--dut:#1f2937}
.sheet[data-th=mono] .chart{--c1:#111;--c2:#2b2b2b;--c3:#4a4a4a;--cb:#fff;--cd:#111;--cl:#111;--cp:#eee;--rad:.2em;--dut:#111}
.sheet[data-th=gold] .chart{--c1:#7c2d12;--c2:#b45309;--c3:#92400e;--cb:#fffbeb;--cd:#e5c07b;--cl:#a16207;--cp:#fef3c7;--rad:.7em;--dut:#5b3a0f}
.sheet[data-th=green] .chart{--c1:#14532d;--c2:#15803d;--c3:#3f6212;--cb:#f0fdf4;--cd:#bbf7d0;--cl:#4d7c0f;--cp:#dcfce7;--rad:.7em;--dut:#14532d}
.chart{display:flex;flex-direction:column;align-items:center;margin-top:.6em}
.cd{background:var(--cb);border:1px solid var(--cd);border-radius:var(--rad);overflow:hidden;text-align:center;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(15,23,42,.1);position:relative;width:100%}
.cd .hd{color:#fff;font-weight:700;padding:.35em .3em;font-size:1.02em;line-height:1.5}
.cd.k1 .hd{background:var(--c1);font-size:1.1em}.cd.k2 .hd{background:var(--c2)}.cd.k3 .hd{background:var(--c3);font-size:.95em}
.cd .bd{padding:.3em .4em .55em;display:flex;flex-direction:column;align-items:center;flex:1}
.cd .pp{width:5.4em;height:5.4em;border-radius:var(--pr);background:var(--cp);border:2px solid color-mix(in srgb,var(--cd) 70%,#fff);margin-top:-0.4em;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;top:-.15em}
.cd.k1 .pp{width:6.4em;height:6.4em}.cd.k3 .pp{width:4.9em;height:4.9em}
.cd .pp img{width:100%;height:100%;object-fit:cover}
.cd .pp svg{width:55%;height:55%;fill:none;stroke:color-mix(in srgb,var(--c3) 55%,#fff);stroke-width:1.5}
.cd .nm{font-weight:700;margin-top:.4em;font-size:.98em;line-height:1.5;min-height:1.5em;letter-spacing:.02em}
.cd .nm.e{font-weight:400;letter-spacing:.1em;color:#111}
.cd .du{font-size:.8em;line-height:1.55;color:var(--dut);margin-top:.15em}
.cd.k3 .du{font-size:.74em}
.cw1{width:62%}
.lv{display:flex;width:100%;justify-content:center}
.stem{width:0;height:1.05em;border-left:2px solid var(--cl);position:relative}
.br{display:flex;flex-direction:column;align-items:center;min-width:0}
.br2{display:flex;width:100%}
.br2>.br{flex:1 1 0;padding:0 .35em}
.kids{display:flex;width:100%;justify-content:center}
.kd{flex:1 1 0;max-width:36%;min-width:0;position:relative;padding:1.2em .3em 0}
.br>.kd,.dtk>.kd{max-width:none}
.kd:before{content:'';position:absolute;top:0;left:0;right:0;border-top:2px solid var(--cl)}
.kd:first-child:before{left:50%}.kd:last-child:before{right:50%}.kd:only-child:before{display:none}
.kd:after{content:'';position:absolute;top:0;left:50%;height:calc(1.2em - 5px);border-left:2px solid var(--cl)}
.kd i.ar{position:absolute;top:calc(1.2em - 6px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--cl);border-bottom:0}
.kd:only-child:after{height:calc(1.2em - 5px)}
.kids{align-items:stretch}.kd{display:flex;flex-direction:column}.kd>.cd{flex:1}
.dtk{display:flex;flex-direction:column;align-items:center;width:100%}
.br>.vl{position:absolute;top:0;left:50%;height:calc(1.2em - 5px);border-left:2px solid var(--cl)}
.br>.hl{position:absolute;top:0;border-top:2px solid var(--cl)}
.br>i.ar{position:absolute;top:calc(1.2em - 6px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--cl);border-bottom:0}
.br2>.br{padding-left:.35em;padding-right:.35em}
/* dialogs & misc */
.ov{position:fixed;inset:0;z-index:200;background:rgba(10,18,32,.55);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.md{width:min(100%,540px);max-height:88vh;background:var(--card);color:var(--text);border-radius:22px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.md header{padding:16px 18px 10px;display:flex;align-items:center;gap:10px}
.md header h4{flex:1;font-size:15px;line-height:1.5}
.md .x{width:34px;height:34px;border:0;border-radius:10px;background:var(--acs);color:var(--ac);font-size:16px;cursor:pointer}
.md .bd2{overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:10px}
.md .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md .ft{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--in);cursor:pointer;user-select:none}
.it.on{background:var(--oks);border-color:var(--ok)}
.it .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--inl);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
.it.on .ck{background:var(--ok);border-color:var(--ok)}
.it .n{flex:1;font-weight:600;line-height:1.4}.it .m{font-size:11.5px;color:var(--muted)}
.ask{width:min(92vw,360px);text-align:center;padding:26px 22px 20px}
.ask .q{font-size:15.5px;font-weight:700;line-height:1.7;margin-bottom:18px}
.ask .bt{display:flex;gap:10px}.ask .bt .btn{flex:1;justify-content:center;height:44px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;font-weight:700;z-index:5000;display:none}
.auth{display:none;min-height:70vh;align-items:center;justify-content:center;text-align:center;padding:24px}
.auth div{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 26px;max-width:380px}
#mnav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--tb);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:none;gap:7px}
#mnav button{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font:700 13px 'Battambang',sans-serif;min-width:46px}
#mnav button.w{flex:1;background:#0369a1;color:#fff;border-color:#0369a1}
#mnav.show{display:flex}
.set label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
.set .fc{width:100%}
@media(max-width:700px){.wrap{padding:10px}.hero{padding:14px}.hero h1{font-size:15.5px}.acts .btn{flex:1 1 44%;justify-content:center}}
@media print{
  @page{size:A4 portrait;margin:var(--pgm,0)}
  html{background:#fff!important;color-scheme:light!important}
  html,body{background:#fff!important;padding:0!important;margin:0!important;border:0!important;outline:0!important}
  .sheet,.sheet .inner{border:0!important;outline:0!important;background:#fff!important}
  .tb,.pvbar,#ed,.ov,.toast,#mnav,.cal-modal,.cal-modal-backdrop,#csPop,.auth{display:none!important}
  #pv{display:block!important}
  .stage{display:block!important;padding:0!important;background:#fff!important;min-height:0!important}
  .pvz{zoom:1!important;transform:none!important;width:auto!important;height:auto!important}

function csSync(sel){const b=sel._cs;if(!b)return;const o=sel.options[sel.selectedIndex];b.querySelector('.cl').textContent=o?o.textContent:'';b.classList.toggle('empty',!sel.value)}
function csEnhance(sel){
  if(sel.dataset.native)return;
  if(!sel._cs){
    const b=document.createElement('button');b.type='button';
    b.className='csb '+(sel.closest('.cal-nav')?'cal-b':'');
    if(sel.dataset.f)b.dataset.f=sel.dataset.f;
    b.innerHTML='<span class="cl"></span><i class="ca"></i>';
    sel.style.display='none';sel.insertAdjacentElement('afterend',b);sel._cs=b;
    b.addEventListener('click',e=>{e.stopPropagation();csOpen(sel)});
    b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();e.stopPropagation();csOpen(sel)}});
  }
  csSync(sel);
}
function enhanceAll(root){(root||document).querySelectorAll('select').forEach(csEnhance)}
function csClose(){const p=$('csPop');p.style.display='none';p.innerHTML='';p._for=null}
function csOpen(sel){
  const p=$('csPop');
  if(p.style.display==='block'&&p._for===sel){csClose();return}
  p._for=sel;
  p.innerHTML=[...sel.options].map((o,i)=>`<div class="csi ${i===sel.selectedIndex?'on':''}" data-i="${i}">${esc(o.textContent)}</div>`).join('');
  const r=sel._cs.getBoundingClientRect();
  p.style.display='block';p.style.minWidth=Math.max(r.width,150)+'px';
  const vh=window.innerHeight,h=Math.min(p.scrollHeight,Math.max(180,vh*.5));
  p.style.maxHeight=Math.min(vh*.6,360)+'px';
  let top=r.bottom+6;if(top+h>vh-8&&r.top>h+8)top=r.top-h-6;
  let left=Math.min(Math.max(8,r.left),window.innerWidth-p.offsetWidth-8);
  p.style.top=Math.max(8,top)+'px';p.style.left=left+'px';
  const on=p.querySelector('.on');if(on)p.scrollTop=on.offsetTop-p.clientHeight/2+on.offsetHeight/2;
  p.onclick=e=>{const it=e.target.closest('.csi');if(!it)return;e.stopPropagation();sel.selectedIndex=+it.dataset.i;csSync(sel);csClose();sel.dispatchEvent(new Event('change',{bubbles:true}))};
}
document.addEventListener('click',e=>{if(!e.target.closest('#csPop'))csClose()});
window.addEventListener('resize',csClose);

/* ===== cell navigation / selection / paste ===== */
const COLS=['name','sex','role','type','phone','duty','under'];
let ANCH=null,SEL=null;
function cellEl(r,c){const tr=$('mBody')&&$('mBody').querySelector(`tr[data-i="${r}"]`);if(!tr)return null;const td=tr.querySelector(`td[data-c="${c}"]`);return td&&td.querySelector('input.cell:not(.cust),.csb')}
function focusCell(r,c){
  if(r<0||c<0||c>6||r>=D.members.length)return false;
  const el=cellEl(r,c);if(!el)return focusCell(r,c+1);
  el.focus();try{el.select&&el.select()}catch(e){}ANCH={r,c};return true;
}
function curRC(){const a=document.activeElement,td=a&&a.closest&&a.closest('td[data-c]');if(!td||td.dataset.c==='p')return null;const tr=td.closest('tr');return{r:+tr.dataset.i,c:+td.dataset.c}}
function navMove(dr,dc){
  const p=curRC()||ANCH;if(!p)return;
  if(dr===1&&p.r===D.members.length-1){addMember();saveNow();renderMembers();updHero();focusCell(p.r+1,p.c);return}
  let r=p.r+dr,c=p.c+dc;
  if(dc>0&&c>6){c=0;r++}if(dc<0&&c<0){c=6;r--}
  if(r>=D.members.length){addMember();saveNow();renderMembers();updHero()}
  focusCell(Math.max(0,r),c);
}
document.addEventListener('keydown',e=>{
  const t=e.target;

});
document.addEventListener('focusin',e=>{
  const td=e.target.closest&&e.target.closest('#mBody td[data-c]');
  if(td&&td.dataset.c!=='p'){ANCH={r:+td.closest('tr').dataset.i,c:+td.dataset.c};showNav()}
  else if(!e.target.closest('#mnav'))hideNav();
});
function showNav(){if(window.matchMedia('(max-width:900px),(pointer:coarse)').matches)$('mnav').classList.add('show')}
function hideNav(){$('mnav').classList.remove('show')}
document.addEventListener('click',e=>{
  const td=e.target.closest&&e.target.closest('#mBody td[data-c]');
  if(!td||td.dataset.c==='p'){if(!e.target.closest('#mnav')&&!e.target.closest('#csPop')){if(SEL){SEL=null;paintSel()}}return}
  const p={r:+td.closest('tr').dataset.i,c:+td.dataset.c};
  if(e.shiftKey&&ANCH){SEL={r1:Math.min(ANCH.r,p.r),r2:Math.max(ANCH.r,p.r),c1:Math.min(ANCH.c,p.c),c2:Math.max(ANCH.c,p.c)};paintSel();e.preventDefault()}
  else{ANCH=p;if(SEL){SEL=null;paintSel()}}
},true);
function paintSel(){

  if(!SEL)return;
  for(let r=SEL.r1;r<=SEL.r2;r++)for(let c=SEL.c1;c<=SEL.c2;c++){const tr=$('mBody').querySelector(`tr[data-i="${r}"]`);const td=tr&&tr.querySelector(`td[data-c="${c}"]`);if(td)td.classList.add('sel')}

document.addEventListener('paste',e=>{
  if(!$('mBody')||D.locked)return;
  const a=document.activeElement;if(!a||!a.closest||!a.closest('#mBody'))return;

  lines.forEach((ln,ri)=>{

/* ===== org chart ===== */
function arrange(ms){
  const empty=!ms.length;
  let chair=ms.find(m=>m.role==='ប្រធាន')||null;
  let vices=ms.filter(m=>m.role==='អនុប្រធាន');
  const mems=ms.filter(m=>m.role==='សមាជិក');
  if(empty){vices=[null,null]}
  const br=vices.map(v=>({v,kids:[]}));
  const place=[];
  if(empty){for(let i=0;i<6;i++)place.push({m:null,idx:i});}
  else mems.forEach((m,i)=>place.push({m,idx:i}));
  if(!br.length)return {chair,br:[],direct:place};
  const target=Math.ceil(place.length/br.length)||1;
  place.forEach(p=>{
    let bi=-1;
    if(p.m&&(p.m.under==='1'||p.m.under==='2')){bi=Math.min(+p.m.under-1,br.length-1)}
    else{bi=br.findIndex(b=>b.kids.length<target);if(bi<0){bi=0;br.forEach((b,k)=>{if(b.kids.length<br[bi].kids.length)bi=k})}}
    br[bi].kids.push(p);
  });
  return {chair,br,direct:[]};
}
function cardH(m,k,du,role){
  const du2=m&&m.duty?m.duty:'';
  const nm=m&&m.name?`<div class="nm">${esc(m.name)}</div>`:`<div class="nm e">...........................</div>`;
  return `<div class="cd ${k}"><div class="hd">${role}</div><div class="bd"><div class="pp">${m&&m.photo?`<img src="${m.photo}" alt="">`:PERSON}</div>${nm}<div class="du">${esc(du2||du)}</div></div></div>`;
}
function docChart(){
  return scopeList().map(c=>{
    const d=dataOf(c),ms=sortedMembers(d),A=arrange(ms);
    const th=d.theme||'modern';
    const kidsHtml=(arr,vi)=>arr.map((p,j)=>{
      const m=p.m;let du;
      if(vi===0)du=DUTIES[3+(j%3)];else if(vi===1)du=DUTIES[6+(j%3)];else du=DUTIES[3+(p.idx%6)];
      return `<div class="kd"><i class="ar"></i>${cardH(m,'k3',du,'សមាជិក')}</div>`;
    }).join('');
    let body='';
    const chairH=`<div class="cw1">${cardH(A.chair,'k1',DUTIES[0],'ប្រធាន គ.គ.ថ.')}</div>`;
    if(A.br.length){
      const n=A.br.length;
      body=`<div class="dtk">${chairH}<div class="stem"></div><div class="br2">${A.br.map((b,vi)=>`<div class="br" style="position:relative;padding-top:1.2em"><i class="ar"></i><div class="vl"></div><div class="hl" style="${n===1?'display:none;':''}${vi===0?'left:50%;right:0':vi===n-1?'left:0;right:50%':'left:0;right:0'}"></div>${cardH(b.v,'k2',DUTIES[1+Math.min(vi,1)],'អនុប្រធាន')}${b.kids.length?`<div class="stem"></div><div class="kids">${kidsHtml(b.kids,vi)}</div>`:''}</div>`).join('')}</div></div>`;
    }else{
      body=`<div class="dtk">${chairH}${A.direct.length?`<div class="stem"></div><div class="kids" style="width:100%">${kidsHtml(A.direct,2)}</div>`:''}</div>`;
    }
    const sd=d.signDate||todayIso(),sp=isoParts(sd),pp=isoParts(GL.pDate);
    const html=`<div class="kh1 moul">ព្រះរាជាណាចក្រកម្ពុជា</div><div class="kh2 moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</div><div class="orn">❖</div>
      <div class="org">${esc(GL.page.office)}<br>${esc(GL.page.school)}</div>
      <div class="dtl" style="margin-top:.1em">រចនាសម្ព័ន្ធគណៈកម្មការគ្រប់គ្រងថ្នាក់រៀន ថ្នាក់ទី${esc(toKh(c))}</div><div class="yr">ឆ្នាំសិក្សា ${yrTxt()}</div>
      <div class="chart">${body}</div>
      <div style="display:flex;justify-content:flex-end;margin-top:1em"><div class="sg" style="min-width:48%"><div>${esc(lunarOf(sd))}</div><div>${esc(solarTxt(sp))}</div>
      <div class="tt" style="color:#1d4ed8;font-weight:700">នាយកសាលា</div><div class="gap" style="height:3.2em"></div><div style="color:#1d4ed8;font-weight:700">${GL.page.principal?esc(GL.page.principal):'<span class="dots">...........................</span>'}</div></div></div>`;
    return sheet(html,'one',th);
  });
}

/* ===== print / pdf / excel ===== */
function fitAll(){
  const p=GL.page,mm=96/25.4,wmm=210-2*p.ms,target=(297-p.mt-p.mb-2)*mm;
  document.querySelectorAll('.sheet.one .inner').forEach(inn=>{
    inn.style.zoom='';inn.style.width='';let z=1;
    for(let i=0;i<8;i++){inn.style.zoom=z;inn.style.width=(wmm/z)+'mm';const h=inn.scrollHeight*z;if(h<=target)break;z*=target/h*.985}
  });
}
function unfit(){document.querySelectorAll('.sheet .inner').forEach(i=>{i.style.zoom='';i.style.width=''})}
window.addEventListener('beforeprint',()=>{if($('pv').style.display==='block')fitAll()});
window.addEventListener('afterprint',unfit);
function doPrint(){window.focus();setTimeout(()=>{try{window.print()}catch(e){window.parent.print()}},100)}
async function doPdf(){
  if(!window.html2canvas||!window.jspdf){toast('មិនអាចផ្ទុក library PDF បានទេ');return}
  toast('កំពុងបង្កើត PDF...');
  const z=$('pvz'),zz=z.style.zoom;z.style.zoom='1';
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4');let first=true;
    for(const sh of document.querySelectorAll('.sheet')){
      const c=await html2canvas(sh,{scale:2.4,backgroundColor:'#fff',useCORS:true});
      const pageH=c.width*297/210,one=sh.classList.contains('one');
      const n=one?1:Math.max(1,Math.ceil(c.height/pageH-0.02));
      for(let k=0;k<n;k++){
        if(!first)pdf.addPage();first=false;
        if(one){let ih=c.height*210/c.width,iw=210;if(ih>297){iw=210*297/ih;ih=297}pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',(210-iw)/2,0,iw,ih,undefined,'FAST')}
        else{const sl=document.createElement('canvas');sl.width=c.width;sl.height=Math.min(pageH,c.height-k*pageH);const x=sl.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sl.width,sl.height);x.drawImage(c,0,k*pageH,c.width,sl.height,0,0,c.width,sl.height);pdf.addImage(sl.toDataURL('image/jpeg',.95),'JPEG',0,0,210,sl.height*210/c.width,undefined,'FAST')}
      }
    }
    pdf.save('គ.គ.ថ._'+CUR.cls+'_'+PV.type+'.pdf');
  }catch(err){toast('❌ PDF៖ '+err.message)}
  z.style.zoom=zz;
}
function doExcel(){
  const list=(PV&&$('pv').style.display==='block'&&PV.scope==='all')?classesFor():[CUR.cls];
  const mem=[['ថ្នាក់','ល.រ.','ឈ្មោះ','ភេទ','តួនាទី','ប្រភេទ','ទូរស័ព្ទ','ភារកិច្ច']],mt=[['ថ្នាក់','លើកទី','ថ្ងៃ','ម៉ោង','ទីកន្លែង','ប្រធានបទ','របៀបវារៈ','ខ្លឹមសារ','សេចក្តីសម្រេច','ចូលរួម','សរុប']];
  list.forEach(c=>{const d=dataOf(c);
    sortedMembers(d).forEach((m,i)=>mem.push([c,i+1,m.name,sexOf(m),m.role,m.type==='មិនកំណត់'?'':m.type,m.phone,m.duty||'']));
    d.meetings.forEach((x,i)=>mt.push([c,i+1,x.date,x.time,x.place,x.title,x.agenda,x.notes,x.decision,d.members.filter(z=>x.att[z.id]).length,nm(d).length]));
  });
  try{
    if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(mem),'សមាជិក');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(mt),'កិច្ចប្រជុំ');XLSX.writeFile(wb,'គ.គ.ថ._'+CUR.year+'.xlsx');return}
  }catch(e){}
  const csv='﻿'+mem.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='គ.គ.ថ._'+CUR.year+'.csv';a.click();
}
