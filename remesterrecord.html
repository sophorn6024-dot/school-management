<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>សៀវភៅសិក្ខាគារិក</title>
  
  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      --sheet-w: 297mm;
      --sheet-h: 210mm;
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.96);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    [data-theme="dark"] {
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.95);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 🌟 បង្ខំឱ្យប៊ូតុង និង DROPDOWN ទាំងអស់ប្រើ FONT BATTAMBANG 100% */
    .sp-btn, .sp-popup, .sp-popup *,
    .custom-dd-btn, .custom-dd-popup, .custom-dd-popup *,
    .form-control, select, option, input, button,
    .panel-pill-box, .toolbar-label, .btn,
    .ps-popup, .ps-popup * {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif !important;
      font-weight: 700 !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 400; }

    /* ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ */
    .auth-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 30px 20px;
    }
    .auth-card {
      background: var(--card-panel-bg);
      border: 1.5px solid var(--tb-border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 8px; color: #ef4444; font-weight: 700; }
    .auth-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      border: none;
    }

    /* =========================================================
       🎛️ SLEEK SINGLE-ROW TOOLBAR
    ========================================================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
    }

    .tb-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }
    .tb-filters { flex: 1 1 auto; }
    .tb-actions { flex: 0 0 auto; margin-left: auto; }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 9px;
      padding: 3px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .toolbar-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .form-control {
      padding: 4px 7px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
      height: 30px;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .btn {
      padding: 4px 11px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
      height: 30px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 2px 7px rgba(2, 132, 199, 0.25);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 7px rgba(16, 185, 129, 0.25);
    }

    .btn-secondary {
      background: var(--ctrl-group-bg);
      color: var(--text-main);
      border-color: var(--input-border);
    }
    .btn-secondary:hover, .btn-secondary.open { border-color: var(--input-focus); color: var(--input-focus); }

    /* =========================================================
       🌟 CUSTOM DROPDOWN SYSTEM (រចនាដូចរូបភាព ១០០% - BATTAMBANG)
    ========================================================= */
    .custom-dd-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 135px;
      height: 30px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .custom-dd-btn:hover, .custom-dd-btn.open {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }
    .custom-dd-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .custom-dd-chev {
      font-size: 10px;
      color: #0284c7;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .custom-dd-btn.open .custom-dd-chev {
      transform: rotate(180deg);
    }

    .custom-dd-popup {
      display: none;
      position: fixed;
      z-index: 99999;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      padding: 8px 6px;
      animation: ddPopIn 0.15s ease-out;
    }
    .custom-dd-popup.show { display: block; }
    @keyframes ddPopIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .custom-dd-list {
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .custom-dd-list::-webkit-scrollbar { width: 4px; }
    .custom-dd-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .custom-dd-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 1px solid #f1f5f9;
      transition: all 0.15s ease;
    }
    .custom-dd-item:last-child {
      border-bottom: none;
    }
    .custom-dd-item:hover {
      background: #f8fafc;
      color: #0284c7;
    }
    .custom-dd-item.active {
      background: #e0f2fe !important;
      color: #0284c7 !important;
      border-bottom-color: transparent;
    }
    .custom-dd-item .fa-check {
      display: none;
      font-size: 11px;
      color: #0284c7;
    }
    .custom-dd-item.active .fa-check {
      display: inline;
    }

    /* 🔎 Search Box ក្នុង Student Picker */
    .sp-search {
      display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 38px;
      background: #f8fafc; border: 1.5px solid #cbd5e1;
      border-radius: 12px; margin-bottom: 6px;
    }
    .sp-search:focus-within { border-color: #0284c7; }
    .sp-search i { color: #64748b; font-size: 12px; }
    .sp-search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      color: #0f172a; font-size: 13px; font-weight: 700;
    }
    .sp-empty { padding: 18px 10px; text-align: center; color: #64748b; font-size: 13px; font-weight: 700; }

    /* =========================================================
       📱 RESPONSIVE ADJUSTMENTS
    ========================================================= */
    /* =========================================================
       ⚙️ POPUP ការរៀបចំទំព័រ
    ========================================================= */
    .ps-popup {
      display: none; position: fixed; z-index: 99999; width: 360px; max-width: calc(100vw - 16px);
      background: var(--card-panel-bg); color: var(--text-main);
      border: 1px solid var(--tb-border); border-radius: 18px; padding: 16px 16px 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      max-height: calc(100vh - 80px); overflow-y: auto;
    }
    .ps-popup.show { display: block; }
    .ps-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .ps-title { font-size: 17px; }
    .ps-reset {
      display: inline-flex; align-items: center; gap: 6px; background: transparent; border: none;
      color: var(--text-muted); font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 8px;
    }
    .ps-reset:hover { color: var(--text-main); background: var(--ctrl-group-bg); }
    .ps-sec { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; margin: 12px 0 10px; }
    .ps-sec::after { content: ''; flex: 1; height: 1px; background: var(--tb-border); }
    .ps-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .ps-tile {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      min-height: 62px; padding: 6px 4px; border-radius: 12px; cursor: pointer;
      background: var(--ctrl-group-bg); color: var(--text-main); border: 1px solid var(--tb-border);
      font-size: 14px; transition: all 0.15s ease;
    }
    .ps-tile small { font-size: 11px; color: var(--text-muted); font-weight: 400 !important; }
    .ps-tile:hover { border-color: var(--input-focus); }
    .ps-tile.active { background: #e11d48; border-color: #fb7185; color: #ffffff; }
    .ps-tile.active small { color: rgba(255, 255, 255, 0.85); }
    .ps-ico { display: block; border: 2px solid currentColor; border-radius: 3px; }
    .ps-ico.p { width: 11px; height: 17px; }
    .ps-ico.l { width: 17px; height: 11px; }
    .ps-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ps-row > span.ps-lbl { font-size: 14px; min-width: 40px; }
    .ps-step {
      width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--tb-border); cursor: pointer;
      background: var(--ctrl-group-bg); color: var(--text-main); font-size: 18px; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ps-step:hover { border-color: var(--input-focus); }
    .ps-num {
      display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 10px; border-radius: 10px;
      background: var(--input-bg); border: 1px solid var(--input-border);
    }
    .ps-num input { width: 44px; border: none; outline: none; background: transparent; color: var(--text-main); text-align: center; font-size: 15px; }
    .ps-num span { color: var(--text-muted); font-size: 13px; }
    .ps-hint { flex: 1 1 100%; color: var(--text-muted); font-size: 12px; font-weight: 400 !important; }

    /* ធានាថាខ្លឹមសារក្នុងប្រអប់ទំព័រ មិនហៀរ (បង្រួមស្វ័យប្រវត្តិ) */
    .fit-outer { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
    .fit-inner { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; justify-content: space-between; }

    /* ទិសបញ្ឈរ ៖ ទំព័រទាំងពីរត្រូវរៀបជាជួរលើ-ក្រោម */
    .preview-wrapper.portrait .sheet-page { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 5mm; }
    .preview-wrapper.portrait .sheet-page > div:empty { display: none; }
    .preview-wrapper.portrait .sheet-page.sheet1 { grid-template-rows: minmax(0, 1fr); }

    /* =========================================================
       📱 RESPONSIVE (មិនចាំបាច់អូស Toolbar ទៀតទេ)
    ========================================================= */
    @media screen and (max-width: 1100px) {
      .tb-filters { flex: 1 1 100%; }
      .tb-actions { flex: 1 1 100%; justify-content: flex-end; }
    }
    @media screen and (max-width: 720px) {
      body { padding-bottom: 40px; }
      .no-print-bar { padding: 6px 8px; gap: 6px; }
      .tb-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; width: 100%; }
      .tb-filters .panel-pill-box { display: flex; width: 100%; }
      .tb-filters .panel-pill-box[style*="display:none"] { display: none !important; }
      .tb-filters .custom-dd-btn { flex: 1 1 auto; min-width: 0 !important; width: 100%; }
      .tb-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
      .tb-actions .btn { width: 100%; justify-content: center; padding: 2px 6px; }
      .form-control, .btn, .custom-dd-btn { height: 34px; font-size: 12.5px; }
      .preview-wrapper { padding: 10px 4px; gap: 14px; }
    }
    @media screen and (max-width: 420px) {
      .toolbar-label .lbl { display: none; }
      .btn .hide-xs { display: none; }
    }

    /* =========================================================
       📄 A4 BOOKLET PREVIEW (សៀវភៅសិក្ខាគារិក)
    ========================================================= */
    .preview-wrapper {
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      transition: zoom 0.2s ease;
      transform-origin: top center;
    }

    .sheet-page {
      background: #ffffff !important; 
      color: var(--navy) !important;
      width: var(--sheet-w); 
      height: var(--sheet-h); 
      max-height: var(--sheet-h);
      padding: 6mm 7.5mm; 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      grid-template-rows: minmax(0, 1fr);
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35); 
      page-break-after: always; 
      position: relative; 
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .page-box {
      border: 3.5px double var(--navy); 
      padding: 14px 18px 12px 18px; 
      display: flex;
      flex-direction: column; 
      justify-content: space-between; 
      height: 100%; 
      position: relative;
      background: #ffffff !important;
    }

    /* 📝 សេចក្តីណែនាំ (សន្លឹកទី២) — គម្លាតបន្ទាត់ធំជាងមុនឱ្យពេញក្រដាស */
    .guide-box { font-size: 14px; line-height: 1.75; text-align: justify; }
    .guide-box p { margin-bottom: 7px !important; font-weight: 400; }
    .guide-box .note-line { margin: 0 0 3px 14px !important; }
    .guide-box .calc-row { display: flex; align-items: center; gap: 8px; margin: 3px 0 3px 14px; text-align: left; }
    .guide-box .calc-label { font-weight: 700; white-space: nowrap; }
    .guide-box .frac { display: inline-flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.5; font-size: 13.5px; }
    .guide-box .frac .num { border-bottom: 1.2px solid var(--navy); padding: 0 4px; }
    .guide-box .frac .den { padding: 0 4px; }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-icons { font-size: 14px; letter-spacing: 6px; color: var(--red-star); margin: 3px 0 5px 0; }

    .dotted-row { display: flex; align-items: flex-end; width: 100%; margin-bottom: 12px; font-size: 15px; }
    .dotted-label { white-space: nowrap; font-weight: bold; font-size: 15px; }
    .dotted-space { flex: 1; border-bottom: 1.5px dotted var(--navy); margin-left: 6px; padding-left: 6px; min-height: 23px; font-weight: bold; font-size: 15px; }

    .cover-info-block {
      margin: 0 0 14px 0;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    .cover-dotted-row { display: flex; align-items: flex-end; width: 100%; font-size: 17px; }
    .cover-dotted-label { white-space: nowrap; font-weight: 400; font-size: 17px; }
    .cover-dotted-space {
      flex: 1; border-bottom: 1.4px dotted var(--navy); margin-left: 8px; padding: 0 6px; min-height: 28px;
      font-weight: 400; font-size: 17px; text-align: center;
    }
    .cover-corner { position: absolute; font-size: 18px; line-height: 1; color: var(--red-star); }
    .cover-corner.tl { top: 8px; left: 10px; }
    .cover-corner.tr { top: 8px; right: 10px; }
    .cover-corner.bl { bottom: 8px; left: 10px; }
    .cover-corner.br { bottom: 8px; right: 10px; }

    /* ── Table Styling ── */
    .custom-table {
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
      border: 1.35px solid var(--navy) !important; 
      margin-bottom: 3px; 
      table-layout: fixed;
      background: #ffffff !important;
    }
    .custom-table th, .custom-table td {
      border: 1.15px solid var(--navy) !important; 
      padding: 1.8px 2px; 
      height: 21.5px; 
      vertical-align: middle;
      background: #ffffff !important;
      color: var(--navy) !important;
    }
    .custom-table th { background: #f8fafc !important; font-weight: bold; font-size: 13.5px; }
    .custom-table td.text-left { text-align: left; padding-left: 7px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .red-bold { color: #dc2626 !important; font-weight: bold; font-size: 13.5px; }
    .sheet3 .custom-table th, .sheet3 .custom-table td { height: 25px; padding: 3px 2px; }
    .sheet3 .custom-table { font-size: 13.5px; }
    .sheet3 .custom-table td.eval-cell { text-align: left; vertical-align: top; padding: 6px 9px; font-size: 14px; line-height: 1.65; height: auto; white-space: normal; }

  <script>
    /* 1. SUPABASE CLIENT CONFIG */
    const SUPABASE_URL = "https://nggnuobnrxiqjtcwlvwk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* 2. AUTH GUARD */
    function readSession() {
      try { return JSON.parse(localStorage.getItem('krou_supabase_user') || 'null'); } catch(e) { return null; }
    }
    const CURRENT_USER = readSession();

    function checkAuthentication() {
      if (!CURRENT_USER || !CURRENT_USER.username) {
        document.getElementById('controlToolbar').style.display = 'none';
        document.getElementById('semesterContainer').style.display = 'none';

      return true;
    }

    function goToIndex(e) {
      if (e) e.preventDefault();
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage({ type: 'OPEN_LOGIN', action: 'LOGIN' }, '*');
          window.parent.location.href = 'index.html';
          return;
        } catch(err) {}
      }
      window.location.href = 'index.html';
    }

    const USER_ROLE    = CURRENT_USER?.role || "teacher";
    const USER_CLASS   = CURRENT_USER?.assigned_classes || CURRENT_USER?.assigned_class || "";
    const TEACHER_NAME = CURRENT_USER?.teacher_name || "";
    const IS_ADMIN     = String(USER_ROLE).toLowerCase().trim() === 'admin';
    const PRINCIPAL_NAME = '';   // ដាក់ឈ្មោះនាយកសាលានៅទីនេះ បើចង់ឱ្យបោះពុម្ពស្រាប់ (ទុកទទេ បើចង់ឱ្យចុះហត្ថលេខាផ្ទាល់)

    const KHMER_DIGITS = ['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
    function cleanGrade(g) { return String(g || '').replace(/^ថ្នាក់ទី\s*/, '').trim(); }
    function toKhmerNum(num) {
      if (num === null || num === undefined) return '';
      return num.toString().replace(/\d/g, d => KHMER_DIGITS[parseInt(d)] !== undefined ? KHMER_DIGITS[parseInt(d)] : d);
    }

    /* ថ្នាក់ឡើងបន្ទាប់ ៖ ១→២, ២→៣, ៤(ក)→៥ ... ៦→បញ្ចប់បឋម (ទទួលបានទាំងលេខខ្មែរ និងលេខអារ៉ាប់) */
    function getNextGrade(cls) {
      const ascii = String(cls || '').replace(/[០-៩]/g, d => KHMER_DIGITS.indexOf(d));
      const m = ascii.match(/\d+/);
      if (!m) return '.................';
      const n = parseInt(m[0], 10);
      return n < 6 ? toKhmerNum(n + 1) : 'បញ្ចប់បឋម';
    }

    function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme || 'dark'); }
    applyTheme(localStorage.getItem('krou_theme_manual') || 'dark');
    window.addEventListener('message', e => { if (e.data && (e.data.type === 'THEME_CHANGE' || e.data.theme)) applyTheme(e.data.theme || e.data); });

    /* 3. SEMESTER SUBJECT LIST */
    const SEMESTER_SUBJECTS = [
      { key: 'read',      label: 'អំណាន' },
      { key: 'listen',    label: 'ស្តាប់ និងនិយាយ' },
      { key: 'dictation', label: 'សរសេរតាមអាន' },
      { key: 'essay',     label: 'តែងសេចក្តី' },
      { key: 'math',      label: 'គណិតវិទ្យា' },
      { key: 'science',   label: 'វិទ្យាសាស្ត្រ' },
      { key: 'social',    label: 'សិក្សាសង្គម' },
      { key: 'homeArts',  label: 'គេហវិទ្យា-អប់រំសិល្បៈ' },
      { key: 'pe',        label: 'អប់រំកាយ-សុខភាព' },
      { key: 'ethics',    label: 'អប់រំបំណិនជីវិត' },
      { key: 'foreign',   label: 'ភាសាបរទេស' }
    ];

    /* បញ្ជីជម្រើសសន្លឹក */
    const SHEET_OPTIONS = [
      { id: 'ALL', label: 'ទាំងអស់ (៣ សន្លឹក)' },
      { id: '1',   label: 'សន្លឹកទី១ (ក្របក្រៅ)' },
      { id: '2',   label: 'សន្លឹកទី២ (ក្របក្នុង)' },
      { id: '3',   label: 'សន្លឹកទី៣ (លទ្ធផលប្រឡង)' }
    ];

    let bundleData = null;

    /* =========================================================
       ⚙️ ការរៀបចំទំព័រ (ក្រដាស / ទិស / ទំហំអក្សរ)
    ========================================================= */
    const PAGE_KEY = 'sk_page_setup_v1';
    const PAPERS = { A4: { w: 210, h: 297 }, F4: { w: 216, h: 330 } };
    const SCALE_MIN = 60, SCALE_MAX = 130;
    const PAGE_DEFAULT = { paper: 'A4', orient: 'landscape', scale: 100 };
    let pageSetup = Object.assign({}, PAGE_DEFAULT);

    function loadPageSetup() {
      try {
        const o = JSON.parse(localStorage.getItem(PAGE_KEY) || 'null');
        if (o && PAPERS[o.paper]) {
          pageSetup.paper = o.paper;
          pageSetup.orient = o.orient === 'portrait' ? 'portrait' : 'landscape';
          const sc = Number(o.scale);
          pageSetup.scale = (sc >= SCALE_MIN && sc <= SCALE_MAX) ? sc : 100;
        }
      } catch (e) {}
    }
    function savePageSetup() { try { localStorage.setItem(PAGE_KEY, JSON.stringify(pageSetup)); } catch (e) {} }

    function sheetDims() {
      const p = PAPERS[pageSetup.paper] || PAPERS.A4;
      return pageSetup.orient === 'portrait' ? { w: p.w, h: p.h } : { w: p.h, h: p.w };
    }

    /* ធ្វើឱ្យទំព័រមើលជាមុនសមនឹងអេក្រង់ (ស្វ័យប្រវត្តិ គ្មានប៊ូតុងទេ) */
    function applyPreviewScale() {
      const c = document.getElementById('semesterContainer');
      if (!c) return;
      const px = sheetDims().w * 96 / 25.4;
      let sc = window.innerWidth / (px + 24);
      sc = Math.min(1, Math.max(0.25, sc));
      c.style.zoom = sc >= 0.995 ? '' : sc;
    }

    function applyPageSetup() {
      const d = sheetDims();
      const root = document.documentElement;
      root.style.setProperty('--sheet-w', d.w + 'mm');
      root.style.setProperty('--sheet-h', d.h + 'mm');

      let st = document.getElementById('dynPageStyle');
      if (!st) { st = document.createElement('style'); st.id = 'dynPageStyle'; document.head.appendChild(st); }
      st.textContent = '@page { size: ' + d.w + 'mm ' + d.h + 'mm; margin: 0; }';

      document.getElementById('semesterContainer')?.classList.toggle('portrait', pageSetup.orient === 'portrait');

      document.getElementById('psA4')?.classList.toggle('active', pageSetup.paper === 'A4');
      document.getElementById('psF4')?.classList.toggle('active', pageSetup.paper === 'F4');
      document.getElementById('psPortrait')?.classList.toggle('active', pageSetup.orient === 'portrait');
      document.getElementById('psLandscape')?.classList.toggle('active', pageSetup.orient === 'landscape');
      const inp = document.getElementById('psScale');
      if (inp && document.activeElement !== inp) inp.value = pageSetup.scale;

      applyPreviewScale();
      fitSheetPages();
    }

    function setPaper(k) { if (!PAPERS[k]) return; pageSetup.paper = k; savePageSetup(); applyPageSetup(); }
    function setOrient(o) { pageSetup.orient = (o === 'portrait') ? 'portrait' : 'landscape'; savePageSetup(); applyPageSetup(); }
    function setScale(v) {
      v = Math.round(Number(v));
      if (!Number.isFinite(v)) v = 100;
      pageSetup.scale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, v));
      savePageSetup();
      applyPageSetup();
      const inp = document.getElementById('psScale'); if (inp) inp.value = pageSetup.scale;
    }
    function stepScale(delta) { setScale(pageSetup.scale + delta); }
    function resetPageSetup() { pageSetup = Object.assign({}, PAGE_DEFAULT); savePageSetup(); applyPageSetup(); }

    function togglePagePopup(e) {
      if (e) e.stopPropagation();
      const pop = document.getElementById('pagePopup');
      const btn = document.getElementById('pageSetupBtn');
      const wasOpen = pop.classList.contains('show');
      closeAllPopups();
      if (wasOpen) return;
      applyPageSetup();
      const r = btn.getBoundingClientRect();
      const w = Math.min(360, window.innerWidth - 16);
      pop.style.width = w + 'px';
      pop.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';
      pop.style.top = (r.bottom + 6) + 'px';
      pop.classList.add('show');
      btn.classList.add('open');
    }

    let _rsT = null;
    window.addEventListener('resize', () => {
      clearTimeout(_rsT);
      _rsT = setTimeout(() => { applyPreviewScale(); fitSheetPages(); }, 120);
    });

    function doPrint() {
      window.focus();
      setTimeout(() => {
        try { window.print(); } catch(e) { window.parent.print(); }
      }, 100);
    }

    function computeCompetitionRanks(items) {
      const valid = items.filter(x => x.val !== '' && x.val !== null && !isNaN(Number(x.val)));
      valid.sort((a, b) => Number(b.val) - Number(a.val));
      const ranks = {};
      let curRank = 1;
      for (let i = 0; i < valid.length; i++) {
        if (i > 0 && Number(valid[i].val) < Number(valid[i - 1].val)) {
          curRank = i + 1;
        }
        ranks[String(valid[i].id).trim()] = curRank;
      }
      return ranks;
    }

    function getGradeFromAverage(avg) {
      const n = Number(avg);
      if (!Number.isFinite(n) || n <= 0) return '-';
      if (n >= 9.00) return 'A';
      if (n >= 8.00) return 'B';
      if (n >= 7.00) return 'C';
      if (n >= 6.00) return 'D';
      if (n >= 5.00) return 'E';
      return 'F';
    }

    /* =========================================================
       📝 ការវាយតម្លៃ (គ. វាយតម្លៃសិស្សលើការសិក្សា / ង. ការសរសើរ និងកំណែលម្អ)
       ប្តូរលេខកំណត់ទាំងនេះបានតាមចិត្ត
    ========================================================= */
    const EVAL_STRONG_MIN  = 8;    // មុខវិជ្ជា "ពូកែ" ពេលពិន្ទុ ≥ លេខនេះ
    const EVAL_WEAK_MAX    = 5;    // មុខវិជ្ជា "គួរពង្រឹង" ពេលពិន្ទុ < លេខនេះ
    const EVAL_TREND_DELTA = 0.5;  // ឆមាសទី២ ខុសពីឆមាសទី១ ចាប់ពីប៉ុន្មានពិន្ទុ ទើបនិយាយថា ថយចុះ/រីកចម្រើន

    const GRADE_TEXT = {
      A: 'លទ្ធផលសិក្សាល្អឥតខ្ចោះ សូមរក្សាការខិតខំនេះបន្តទៀត។',
      B: 'លទ្ធផលសិក្សាល្អ បើខិតខំបន្ថែមទៀតនឹងកាន់តែប្រសើរ។',
      C: 'លទ្ធផលសិក្សាមធ្យម គួរខិតខំរៀនបន្ថែមទៀត។',
      D: 'លទ្ធផលសិក្សានៅខ្សោយបន្តិច ត្រូវប្រឹងប្រែងបន្ថែមទៀត។',
      E: 'លទ្ធផលសិក្សានៅខ្សោយ ត្រូវយកចិត្តទុកដាក់រៀន និងត្រូវការការជួយបន្ថែម។',
      F: 'លទ្ធផលសិក្សាមិនទាន់គ្រប់គ្រាន់ ត្រូវការតាមដានជួយពង្រឹងជាបន្ទាន់។'
    };

    /* បញ្ជីមុខវិជ្ជា + ពិន្ទុ (មួយឆមាស ឬមធ្យមនៃពីរឆមាស) */
    function subjectList(obj1, obj2) {
      const get = (o, key) => {
        const v = o ? o[key] : '';
        return (v !== '' && v !== undefined && v !== null && !isNaN(Number(v))) ? Number(v) : null;
      };
      return SEMESTER_SUBJECTS.map(sub => {
        const a = get(obj1, sub.key);
        if (obj2 === undefined) return a === null ? null : { label: sub.label, val: a };
        const b = get(obj2, sub.key);
        if (a === null && b === null) return null;
        return { label: sub.label, val: a === null ? b : (b === null ? a : (a + b) / 2) };
      }).filter(Boolean);
    }
    const joinLabels = list => list.map(x => x.label).join(' និង');

    function trendOf(sem1, sem2) {
      if (sem1 > 0 && sem2 > 0) {
        const d = sem2 - sem1;
        if (d <= -EVAL_TREND_DELTA) return 'down';
        if (d >= EVAL_TREND_DELTA) return 'up';
      }
      return '';
    }

    /* ឆមាសនីមួយៗ */
    function semesterEvalText(scoreObj, semAvg) {
      if (!(semAvg > 0)) return '';
      const g = getGradeFromAverage(semAvg);
      let t = GRADE_TEXT[g] || '';
      const subs = subjectList(scoreObj);
      if (!subs.length) return t;
      if (g === 'A' || g === 'B') {
        const best = subs.slice().sort((x, y) => y.val - x.val)[0];
        t += ' ពូកែខាង' + best.label + '។';
      } else {
        const worst = subs.slice().sort((x, y) => x.val - y.val)[0];
        if (worst.val < EVAL_WEAK_MAX) t += ' គួរពង្រឹងមុខវិជ្ជា' + worst.label + '។';
      }
      return t;
    }

    /* ប្រចាំឆ្នាំ */
    function yearEvalText(yAvg, sem1, sem2) {
      if (!(yAvg > 0)) return '';
      const g = getGradeFromAverage(yAvg);
      let t = 'និទ្ទេសប្រចាំឆ្នាំ ' + g + '។ ' + (GRADE_TEXT[g] || '');
      const tr = trendOf(sem1, sem2);
      if (tr === 'down') t += ' លទ្ធផលថយចុះនៅឆមាសទី២ គួរប្រុងប្រយ័ត្ន។';
      if (tr === 'up')   t += ' មានការរីកចម្រើនពីឆមាសទី១ ដល់ឆមាសទី២។';
      t += (yAvg >= 5) ? ' សមនឹងឡើងថ្នាក់បាន។' : ' មិនទាន់សមនឹងឡើងថ្នាក់ ត្រូវជួយពង្រឹងបន្ថែម។';
      return t;
    }

    /* ការសរសើរ */
    function praiseText(rank, s1Obj, s2Obj, sem1, sem2) {
      const parts = [];
      if (Number(rank) > 0 && Number(rank) <= 5) parts.push('បានចំណាត់ថ្នាក់ទី ' + toKhmerNum(rank) + ' ក្នុងថ្នាក់។');
      const strong = subjectList(s1Obj, s2Obj).filter(x => x.val >= EVAL_STRONG_MIN).sort((a, b) => b.val - a.val).slice(0, 2);
      if (strong.length) parts.push('ពូកែខាង' + joinLabels(strong) + '។');
      if (trendOf(sem1, sem2) === 'up') parts.push('មានការខិតខំរីកចម្រើនជាងឆមាសទី១។');
      return parts.join(' ');
    }

    /* កំណែលម្អ */
    function improveText(s1Obj, s2Obj, sem1, sem2) {
      const parts = [];
      const weak = subjectList(s1Obj, s2Obj).filter(x => x.val < EVAL_WEAK_MAX).sort((a, b) => a.val - b.val).slice(0, 2);
      if (weak.length) parts.push('គួរពង្រឹងមុខវិជ្ជា' + joinLabels(weak) + '។');
      if (trendOf(sem1, sem2) === 'down') parts.push('គួរខិតខំឡើងវិញ លទ្ធផលថយចុះនៅឆមាសទី២។');
      return parts.join(' ');
    }

    const dottedLines = n => '<div class="eval-dots"></div>'.repeat(n);

    /* ធានាថាខ្លឹមសារក្នុងទំព័រនីមួយៗ មិនហៀរចេញក្រៅប្រអប់ (ប្រើទំហំអក្សរតាមការកំណត់ ហើយបង្រួមបើវែងពេក) */
    function fitSheetPages() {
      const base = Math.min(SCALE_MAX, Math.max(SCALE_MIN, Number(pageSetup.scale) || 100)) / 100;
      document.querySelectorAll('#semesterContainer .page-box').forEach(box => {
        let outer = box.querySelector(':scope > .fit-outer');
        if (!outer) {
          outer = document.createElement('div');
          outer.className = 'fit-outer';
          const inner = document.createElement('div');
          inner.className = 'fit-inner';
          while (box.firstChild) inner.appendChild(box.firstChild);
          outer.appendChild(inner);
          box.appendChild(outer);
        }
        const inner = outer.firstElementChild;
        let z = base;
        inner.style.zoom = z;
        for (let i = 0; i < 4; i++) {
          const need = inner.scrollHeight, have = inner.clientHeight;
          if (have <= 0 || need <= have + 1) break;
          z = Math.max(0.4, z * (have / need) * 0.985);
          inner.style.zoom = z;
          if (z <= 0.4) break;
        }
      });
    }

    window.addEventListener('beforeprint', () => { try { fitSheetPages(); } catch(e) {} });

        }
        if (!classes.length) classes = ['១', '២', '៣', '៤(ក)', '៤(ខ)', '៥', '៦'];

        select.innerHTML = classes.map(c => `<option value="${c}">ថ្នាក់ទី ${c}</option>`).join('');

    /* =========================================================
       🌟 4.2 CUSTOM DROPDOWNS: POPUP LOGIC (ដូចរូបភាព ១០០%)
    ========================================================= */
    function closeAllPopups() {
      document.getElementById('spPopup')?.classList.remove('show');
      document.getElementById('spBtn')?.classList.remove('open');
      document.getElementById('sheetPopup')?.classList.remove('show');
      document.getElementById('sheetBtn')?.classList.remove('open');
      document.getElementById('classPopup')?.classList.remove('show');
      document.getElementById('classBtn')?.classList.remove('open');
      document.getElementById('pagePopup')?.classList.remove('show');
      document.getElementById('pageSetupBtn')?.classList.remove('open');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#pagePopup') && !e.target.closest('#pageSetupBtn') && !e.target.closest('#classPopup') && !e.target.closest('#classBtn') &&
          !e.target.closest('#spPopup') && !e.target.closest('#spBtn') &&
          !e.target.closest('#sheetPopup') && !e.target.closest('#sheetBtn')) {
        closeAllPopups();
      }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllPopups(); });

    /* ── 0. POPUP ថ្នាក់ (CLASS PICKER) ── */
    function updateClassLabel() {
      const sel = document.getElementById('classSelect');
      const cur = sel.options[sel.selectedIndex];
      document.getElementById('classLabel').textContent = cur ? cur.textContent : 'ជ្រើសរើសថ្នាក់';
    }

    function toggleClassPicker(e) {
      if (e) e.stopPropagation();
      const pop = document.getElementById('classPopup');
      const btn = document.getElementById('classBtn');
      if (pop.classList.contains('show')) { closeAllPopups(); return; }

      closeAllPopups();
      const sel = document.getElementById('classSelect');
      const list = document.getElementById('classList');
      list.innerHTML = '';
      Array.from(sel.options).forEach(opt => {
        if (!opt.value) return;
        const item = document.createElement('div');
        item.className = 'custom-dd-item' + (opt.value === sel.value ? ' active' : '');
        item.innerHTML = `<span>${opt.textContent}</span><i class="fa-solid fa-check"></i>`;
        item.onclick = (ev) => {
          ev.stopPropagation();
          sel.value = opt.value;
          updateClassLabel();
          closeAllPopups();
          loadSemesterData();
        };
        list.appendChild(item);
      });

      const r = btn.getBoundingClientRect();

      pop.style.width = w + 'px';
      pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
      pop.style.top = (r.bottom + 6) + 'px';
      pop.classList.add('show');
      btn.classList.add('open');
    }

    /* ── A. POPUP សន្លឹក (SHEET PICKER) ── */
    function toggleSheetPicker(e) {
      if (e) e.stopPropagation();
      const pop = document.getElementById('sheetPopup');
      const btn = document.getElementById('sheetBtn');
      if (pop.classList.contains('show')) { closeAllPopups(); return; }

      closeAllPopups();

    function renderSheetList() {
      const list = document.getElementById('sheetList');

      list.innerHTML = '';

      SHEET_OPTIONS.forEach(opt => {
        const item = document.createElement('div');
        item.className = 'custom-dd-item' + (opt.id === curVal ? ' active' : '');

    /* ── B. POPUP សិស្ស (STUDENT PICKER) ── */
    function updateSpLabel() {
      const sel = document.getElementById('studentSelect');
      const cur = sel.options[sel.selectedIndex];
      document.getElementById('spLabel').textContent = cur ? cur.textContent : 'ជ្រើសរើសសិស្ស';
    }

    function renderSpList(query) {
      const sel = document.getElementById('studentSelect');
      const list = document.getElementById('spList');
      const q = String(query || '').trim().toLowerCase();
      list.innerHTML = '';
      let count = 0;

      Array.from(sel.options).forEach(opt => {
        const label = opt.textContent;
        if (q && !label.toLowerCase().includes(q)) return;
        const item = document.createElement('div');
        item.className = 'custom-dd-item' + (opt.value === sel.value ? ' active' : '');
        item.innerHTML = `<span>${label}</span><i class="fa-solid fa-check"></i>`;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          chooseStudent(opt.value);
        });
        list.appendChild(item);
        count++;
      });

      if (!count) {
        const empty = document.createElement('div');
        empty.className = 'sp-empty';
        empty.textContent = 'រកមិនឃើញសិស្សទេ';
        list.appendChild(empty);
      }
    }

    /* 5. FETCH SEMESTER DATA BUNDLE FROM SUPABASE */
    async function loadSemesterData() {
      const cls = document.getElementById('classSelect').value || cleanGrade(USER_CLASS);
      const curPure = cleanGrade(cls);
      const container = document.getElementById('semesterContainer');

      if (!curPure) return;

      container.innerHTML = `
        <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
          <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${curPure}...</p>
        </div>`;

      try {
        const { data: stList, error: stErr } = await sb
          .from('students')
          .select('*')
          .order('id', { ascending: true });

        if (stErr) throw stErr;

        const students = (stList || [])
          .filter(s => cleanGrade(s.grade) === curPure)
          .map(s => ({
            id: String(s.student_id || s.id),
            name: s.student_name || 'គ្មានឈ្មោះ',
            sex: s.gender || 'ប្រុស',
            dob: s.dob || '',
            pob: s.pob || '',
            address: s.address || '',
            father: s.father_name || '',
            fatherJob: s.father_job || '',
            mother: s.mother_name || '',
            motherJob: s.mother_job || ''
          }));

        if (!students.length) {
          container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>';
          return;
        }

        const studentIds = students.map(s => s.id);

        const { data: scData, error: scErr } = await sb
          .from('scores')
          .select('student_id, score_type, period, scores, total, average, rank, grade_label')
          .eq('assigned_class', curPure)
          .in('student_id', studentIds);

        if (scErr) console.warn("Scores error:", scErr);

        const sem1Scores = {}, sem2Scores = {};
        const sem1RankMap = {}, sem2RankMap = {}, yearRankMap = {};
        const s1MonthlyAvgMap = {}, s2MonthlyAvgMap = {};

        const s1Months = ['វិច្ឆិកា', 'ធ្នូ', 'មករា', 'កុម្ភៈ', 'មីនា', 'មេសា'];
        const s2Months = ['ឧសភា', 'មិថុនា', 'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា'];

        students.forEach(st => {
          const sId = st.id;
          const myScores = (scData || []).filter(r => String(r.student_id) === sId);

          const e1 = myScores.find(r => r.score_type === 'semester' && r.period === 'ឆមាសទី១');
          if (e1) {
            sem1Scores[sId] = Object.assign({}, e1.scores || {}, { avg: e1.average, total: e1.total });
            sem1RankMap[sId] = { rank: e1.rank, avg: e1.average, grade: e1.grade_label };
          }

          const e2 = myScores.find(r => r.score_type === 'semester' && r.period === 'ឆមាសទី២');
          if (e2) {
            sem2Scores[sId] = Object.assign({}, e2.scores || {}, { avg: e2.average, total: e2.total });
            sem2RankMap[sId] = { rank: e2.rank, avg: e2.average, grade: e2.grade_label };
          }

          let sum1 = 0, c1 = 0;
          s1Months.forEach(m => {
            const r = myScores.find(sc => sc.score_type === 'monthly' && sc.period === m);
            if (r && Number(r.average) > 0) { sum1 += Number(r.average); c1++; }
          });
          if (c1 > 0) s1MonthlyAvgMap[sId] = (sum1 / c1).toFixed(2);

          let sum2 = 0, c2 = 0;
          s2Months.forEach(m => {
            const r = myScores.find(sc => sc.score_type === 'monthly' && sc.period === m);
            if (r && Number(r.average) > 0) { sum2 += Number(r.average); c2++; }
          });
          if (c2 > 0) s2MonthlyAvgMap[sId] = (sum2 / c2).toFixed(2);
        });

        const attMap = {};
        students.forEach(st => attMap[st.id] = { sem1_p:0, sem1_a:0, sem2_p:0, sem2_a:0 });

        const { data: attData } = await sb
          .from('attendance')
          .select('student_id, attendance_date, status')
          .eq('assigned_class', curPure)
          .in('student_id', studentIds)
          .in('status', ['A', 'C']);

        (attData || []).forEach(r => {
          const sid = String(r.student_id);
          if (!attMap[sid]) return;
          const dt = new Date(r.attendance_date);
          const m = dt.getMonth() + 1;
          const isSem1 = [11, 12, 1, 2, 3, 4].includes(m);
          if (isSem1) {
            if (r.status === 'C') attMap[sid].sem1_p++;
            if (r.status === 'A') attMap[sid].sem1_a++;
          } else {
            if (r.status === 'C') attMap[sid].sem2_p++;
            if (r.status === 'A') attMap[sid].sem2_a++;

      const s1SubRanks = {}, s2SubRanks = {};
      const s1TotList = [], s2TotList = [];
      const s1SemList = [], s2SemList = [], yAvgList = [];
      const calcMap = {};
      const r2 = x => Number(Number(x).toFixed(2));
      const combine2 = (a, b) => (a > 0 && b > 0) ? (a + b) / 2 : (a > 0 ? a : (b > 0 ? b : 0));

      SEMESTER_SUBJECTS.forEach(sub => {
        const s1Items = [], s2Items = [];
        studentsList.forEach(st => {
          const sc1 = (bundleData.sem1Scores && bundleData.sem1Scores[st.id]) ? bundleData.sem1Scores[st.id][sub.key] : '';
          const sc2 = (bundleData.sem2Scores && bundleData.sem2Scores[st.id]) ? bundleData.sem2Scores[st.id][sub.key] : '';
          if (sc1 !== '' && sc1 !== undefined && !isNaN(Number(sc1))) s1Items.push({ id: st.id, val: Number(sc1) });
          if (sc2 !== '' && sc2 !== undefined && !isNaN(Number(sc2))) s2Items.push({ id: st.id, val: Number(sc2) });

        s1SubRanks[sub.key] = computeCompetitionRanks(s1Items);

        let tot2 = 0, cnt2 = 0;

          const v2 = s2[sub.key]; if (v2 !== '' && v2 !== undefined && !isNaN(Number(v2))) { tot2 += Number(v2); cnt2++; }
        });

        if (tot1 > 0) s1TotList.push({ id: st.id, val: tot1 });
        if (tot2 > 0) s2TotList.push({ id: st.id, val: tot2 });

        /* ── ក្បួនគណនា ──
           មធ្យមភាគប្រចាំខែ   = មធ្យមភាគតាមខែក្នុងឆមាស / ចំនួនខែ

        const sem2 = r2(combine2(month2, exam2));
        const year = r2(combine2(sem1, sem2));

        if (sem2 > 0) s2SemList.push({ id: st.id, val: sem2 });
        if (year > 0) yAvgList.push({ id: st.id, val: year });
      });

            if (v2 !== '') s2Total += v2;

            const r2 = (v2 !== '' && s2SubRanks[sub.key] && s2SubRanks[sub.key][student.id]) ? s2SubRanks[sub.key][student.id] : '';

                      <th rowspan="2" style="width: 38%; font-size: 13.5px;">មុខវិជ្ជា</th>

                  <tbody>
                    ${tableRowsHtml}

                      <td class="text-left">សរុបពិន្ទុ</td>
                      <td>${s1Total > 0 ? s1Total.toFixed(2) : ''}</td>
                      <td rowspan="2" class="red-bold">${s1TotRank !== '' ? toKhmerNum(s1TotRank) : ''}</td>
                      <td>${s2Total > 0 ? s2Total.toFixed(2) : ''}</td>
                      <td rowspan="2" class="red-bold">${s2TotRank !== '' ? toKhmerNum(s2TotRank) : ''}</td>
                    </tr>
                    <tr class="f-bold">
                      <td class="text-left">មធ្យមភាគ</td>
                      <td>${s1AvgVal > 0 ? s1AvgVal.toFixed(2) : ''}</td>
                      <td>${s2AvgVal > 0 ? s2AvgVal.toFixed(2) : ''}</td>
                    </tr>
                    <tr class="f-bold">
                      <td class="text-left">មធ្យមភាគប្រចាំខែ</td>
                      <td>${s1MonthlyVal}</td>
                      <td></td>
                      <td>${s2MonthlyVal}</td>
                      <td></td>

                    <tr class="f-bold">
                      <td class="text-left">មធ្យមភាគប្រចាំឆមាស</td>
                      <td>${s1SemVal > 0 ? s1SemVal.toFixed(2) : '0'}</td>
                      <td class="red-bold">${s1RankNum !== '-' ? toKhmerNum(s1RankNum) : '-'}</td>
                      <td>${s2SemVal > 0 ? s2SemVal.toFixed(2) : '0'}</td>
                      <td class="red-bold">${s2RankNum !== '-' ? toKhmerNum(s2RankNum) : '-'}</td>

                    <tr class="f-bold" style="background: #f1f5f9; font-size: 13.5px;">
                      <td colspan="5" style="padding: 4.5px;">

                      <td class="eval-cell">${evS2}</td>

                  </tbody>
                </table>

                <div class="f-moul" style="margin: 10px 0 4px 0; font-size: 14.5px;">ឃ. លទ្ធផលប្រចាំឆ្នាំ</div>

                  <div>ត្រូវបានឡើងថ្នាក់ទី ៖ <strong class="f-bold">${getNextGrade(cls)}</strong></div>
                  <div>ត្រូវប្រឡងឡើងថ្នាក់ ៖ ................. មុខវិជ្ជាដែលត្រូវប្រឡង ៖ .................</div>
                  <div>ត្រូវរៀនត្រួតថ្នាក់ ៖ ................. ត្រូវរៀនឡើងថ្នាក់ទី ៖ .................</div>
                </div>

                <div class="f-moul" style="margin: 10px 0 6px 0; font-size: 14.5px;">ង. ការសរសើរ និងកំណែលម្អ</div>
                <div class="eval-boxes">
                  <div class="eval-box">
                    <div class="f-bold eval-box-title">ការសរសើរ</div>
                    ${evPraise || dottedLines(3)}
                  </div>
                  <div class="eval-box">
                    <div class="f-bold eval-box-title">កំណែលម្អ</div>
                    ${evImprove || dottedLines(3)}

                <div class="sig-block" style="margin-top: 8px; font-size: 13.5px;">
                  <div class="sig-inner principal">
                    <div>ថ្ងៃទី...... ខែ...... ឆ្នាំ២០២៦</div>

                    <div class="sign-space teacher"></div>
                    <div class="principal-name">${TEACHER_NAME || ''}</div>
                  </div>
                </div>

                <div class="f-bold" style="margin-top: 8px; font-size: 14px;">ច. មូលវិចាររបស់នាយកសាលា</div>

                    <div class="f-bold" style="margin-top: 2px;">នាយកសាលា</div>
                    <div class="sign-space"></div>
                    <div class="principal-name">${PRINCIPAL_NAME}</div>
                  </div>
                </div>
              </div>
