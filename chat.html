<!DOCTYPE html>
<html lang="km" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>បន្ទប់សន្ទនា</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html{font-size:clamp(16px,calc(11px + .6vw),24px)}
:root,[data-theme="light"]{
  --bg:linear-gradient(135deg,#cfeafb 0%,#eaf5fd 35%,#f7fbff 70%,#fbf8ee 100%);
  --surface:#fff;--card:#f4f7fa;--border:#e3e9ef;--text:#14202b;--muted:#6b7a89;--primary:#0a6aa6;
  --in:#fff;--in-text:#14202b;--out:#d9efff;--out-text:#0b2a40;--quote:#f1f1f1;
  --header:rgba(255,255,255,.86);--chip:#f3f6f9;--chip-text:#3d4b59;--chip-on:#dff0fb;--chip-on-text:#0a6aa6;
  --shadow:0 2px 0.625rem rgba(20,40,60,.07);--wave:#c4c9ce;--wave-on:#0a6aa6;
  --c-user:#0d7a5f;--c-admin:#c2570c;--c-ai:#a21caf}
[data-theme="dark"]{
  --bg:linear-gradient(160deg,#071822 0%,#091c28 50%,#07151e 100%);
  --surface:#0e202c;--card:#11222e;--border:#183347;--text:#f1f5f9;--muted:#94a3b8;--primary:#38bdf8;
  --in:#0e202c;--in-text:#e2e8f0;--out:#0d3856;--out-text:#f1f5f9;--quote:#16303f;
  --header:rgba(9,24,34,.9);--chip:#11222e;--chip-text:#94a3b8;--chip-on:#143852;--chip-on-text:#38bdf8;
  --shadow:0 2px 0.75rem rgba(0,0,0,.4);--wave:#3b5366;--wave-on:#38bdf8;
  --c-user:#34d399;--c-admin:#fbbf24;--c-ai:#e879f9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Kantumruy Pro','Khmer OS Battambang',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.auth{display:none;min-height:100vh;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:1.5rem;padding:2.125rem 1.5rem;max-width:25rem;width:100%;box-shadow:var(--shadow)}
.auth-card h2{color:#ef4444;font-size:1.0625rem;margin:0.75rem 0 0.5rem}.auth-card p{font-size:0.8125rem;color:var(--muted);line-height:1.6;margin-bottom:1.375rem}
.btn-primary{background:linear-gradient(135deg,#0a6aa6,#2563eb);color:#fff;border:0;padding:0.625rem 1.375rem;border-radius:0.75rem;font-weight:700;font-size:0.8438rem;cursor:pointer}
#app{display:none;flex-direction:column;position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:55rem;height:100vh;height:var(--vh,100dvh);overflow:hidden}
.header{flex:0 0 auto;margin:max(0.5rem,env(safe-area-inset-top)) 0.625rem 0;padding:0.5rem 0.75rem;background:var(--header);backdrop-filter:blur(0.625rem);border-radius:1.5rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:0.625rem;z-index:5}
.icon-btn{background:none;border:0;color:var(--text);font-size:1.1875rem;width:2.375rem;height:2.375rem;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:rgba(10,106,166,.1);color:var(--primary)}
.logo{width:2.75rem;height:2.75rem;border-radius:50%;background:#fff;border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain}
.title{flex:1;min-width:0;font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-bar{display:none;margin:0.5rem 0.625rem 0;padding:0.375rem 0.625rem;background:var(--surface);border-radius:1.25rem;box-shadow:var(--shadow);align-items:center;gap:0.5rem}
.search-bar input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:0.875rem;font-family:inherit;padding:0.375rem}
.stage{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}
#chatBox{flex:1;overflow-y:auto;overflow-x:hidden;padding:0.75rem 0.75rem 0.5rem;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.date-pill{align-self:center;background:rgba(255,255,255,.75);color:var(--muted);font-size:0.75rem;font-weight:600;padding:0.3125rem 1rem;border-radius:1.25rem;margin:0.875rem 0 0.5rem;box-shadow:var(--shadow)}
[data-theme="dark"] .date-pill{background:rgba(255,255,255,.08)}
.load-more{align-self:center;background:var(--surface);border:0;color:var(--primary);font-size:0.75rem;font-weight:700;padding:0.375rem 1rem;border-radius:1rem;margin-bottom:0.5rem;cursor:pointer;box-shadow:var(--shadow)}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:0.8438rem;line-height:1.8;padding:1.875rem}
.row{display:flex;align-items:flex-end;gap:0.5rem;max-width:94%;margin-top:0.1875rem}
.row.first{margin-top:0.625rem}
.row.in{align-self:flex-start}.row.out{align-self:flex-end;flex-direction:row-reverse}
.av{width:2.375rem;height:2.375rem;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.9375rem;overflow:hidden;background:#0d7a5f;box-shadow:var(--shadow)}
.av img{width:100%;height:100%;object-fit:cover;background:#fff}
.av.ai{background:linear-gradient(135deg,#a855f7,#7c3aed);font-size:1.0625rem}
.av.sp{visibility:hidden;box-shadow:none}
.bub{background:var(--in);color:var(--in-text);border-radius:1.25rem;border-bottom-left-radius:0.375rem;padding:0.5rem 0.875rem 0.4375rem;box-shadow:var(--shadow);min-width:0;max-width:100%;font-size:0.9375rem;line-height:1.55;word-break:break-word;overflow-wrap:anywhere}
.row.out .bub{background:var(--out);color:var(--out-text);border-bottom-left-radius:1.25rem;border-bottom-right-radius:0.375rem}
.row:not(.last) .bub{border-bottom-left-radius:1.25rem}
.row.out:not(.last) .bub{border-bottom-right-radius:1.25rem}
.who{font-size:0.8125rem;font-weight:700;color:var(--c-user);margin-bottom:2px}
.who.admin{color:var(--c-admin)}.who.ai{color:var(--c-ai)}
.meta{float:right;margin:0.4375rem 0 -2px 0.75rem;font-size:0.7188rem;color:var(--muted);display:inline-flex;align-items:center;gap:0.375rem;line-height:1.2}
.meta.block{float:none;display:flex;justify-content:flex-end;margin:2px 0 0}
.del{background:none;border:0;color:var(--muted);font-size:0.6875rem;cursor:pointer;opacity:.55;padding:2px}.del:hover{opacity:1;color:#ef4444}
.body a{color:var(--primary);text-decoration:underline}
.body::after{content:"";display:block;clear:both}
.img{display:block;max-width:min(16.25rem,64vw);max-height:18.75rem;width:100%;object-fit:cover;border-radius:0.875rem;cursor:zoom-in;margin:2px 0 0.25rem}
video.vid{display:block;max-width:min(17.5rem,66vw);max-height:18.75rem;border-radius:0.875rem;margin:2px 0 0.25rem;background:#000}
.audio{display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:0.75rem;min-width:min(18.125rem,66vw);padding:0.25rem 0 0}
.play{width:2.875rem;height:2.875rem;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:1.0625rem;cursor:pointer;display:flex;align-items:center;justify-content:center;grid-row:1/3;box-shadow:0 0.1875rem 0.5rem rgba(10,106,166,.3)}
[data-theme="dark"] .play{color:#07151e}
.spd{grid-row:1/3;background:none;border:0;color:var(--primary);font-weight:700;font-size:0.875rem;cursor:pointer;padding:0.25rem;min-width:2.125rem}
.wave{display:flex;align-items:center;gap:2px;height:1.875rem}
.wave i{flex:1;min-width:2px;max-width:0.25rem;border-radius:2px;background:var(--wave);display:block}
.wave i.on{background:var(--wave-on)}
.ameta{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--muted);margin-top:2px;gap:0.5rem}
.fab{position:absolute;right:0.875rem;bottom:0.75rem;width:2.625rem;height:2.625rem;border-radius:50%;background:var(--surface);color:var(--text);border:1px solid var(--border);box-shadow:0 0.25rem 0.875rem rgba(0,0,0,.15);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:0.9375rem;z-index:6}
.fab .badge{position:absolute;top:-0.375rem;right:-0.25rem;background:#ef4444;color:#fff;border-radius:0.625rem;font-size:0.625rem;font-weight:700;padding:1px 0.375rem;display:none}
.dock{flex:0 0 auto;background:var(--surface);margin:0 0.625rem max(0.625rem,env(safe-area-inset-bottom));border-radius:1.75rem;box-shadow:0 -2px 1.125rem rgba(20,40,60,.1);padding:0.625rem 0.75rem 0.5rem;display:flex;flex-direction:column;gap:0.375rem;position:relative;z-index:7}
.compose{display:flex;align-items:flex-end;gap:0.375rem}
.tools{display:flex;align-items:center;gap:2px;padding-bottom:0.1875rem}
.tool{background:none;border:0;color:var(--text);font-size:1.3125rem;width:2.625rem;height:2.625rem;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.85}
.tool:hover{color:var(--primary);background:rgba(10,106,166,.08)}
#msgInput{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-family:inherit;font-size:1rem;line-height:1.5;padding:0.625rem 0.375rem;max-height:7.5rem;min-height:2.75rem;height:2.75rem}
#msgInput::placeholder{color:#9aa7b4}
.send{width:3rem;height:3rem;border-radius:50%;border:0;background:linear-gradient(135deg,#0b7fc0,#0a5a8e);color:#fff;font-size:1.125rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0.25rem 0.75rem rgba(10,106,166,.35);transition:transform .12s}
.send:active{transform:scale(.92)}.send.rec{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.recbar{display:none;flex:1;align-items:center;gap:0.625rem;color:#ef4444;font-weight:700;font-size:0.875rem;padding:0.625rem 0.375rem}
.recbar button{background:none;border:0;color:var(--muted);cursor:pointer;font-family:inherit;font-size:0.8125rem}
.recdot{width:0.625rem;height:0.625rem;border-radius:50%;background:#ef4444;animation:pulse 1s infinite}
.emoji{display:none;position:absolute;left:0;right:0;bottom:calc(100% + 0.5rem);background:var(--surface);border:1px solid var(--border);border-radius:1.25rem;box-shadow:0 0.75rem 2rem rgba(0,0,0,.2);padding:0.5rem;max-height:13.125rem;overflow-y:auto;grid-template-columns:repeat(auto-fill,minmax(2.5rem,1fr));gap:2px}
.emoji button{font-size:1.4375rem;background:none;border:0;border-radius:0.5rem;padding:0.25rem;cursor:pointer}.emoji button:active{background:rgba(10,106,166,.18)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(0.25rem);display:none;align-items:center;justify-content:center;z-index:100;padding:0.875rem}
.modal{width:100%;max-width:27.5rem;max-height:82vh;background:var(--surface);border-radius:1.375rem;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:0.875rem 1.125rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:0.9375rem}
.mlist{padding:0.625rem;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem}
.mem{display:flex;align-items:center;gap:0.75rem;background:var(--card);border-radius:0.875rem;padding:0.5625rem 0.75rem}
.mem.me{background:var(--chip-on);box-shadow:inset 0 0 0 2px var(--primary)}
.chip{display:inline-block;margin-left:0.5rem;background:var(--primary);color:#fff;font-size:0.6875rem;font-weight:700;padding:2px 0.5625rem;border-radius:0.625rem;vertical-align:middle}
[data-theme="dark"] .chip{color:#07151e}
.mem .av{width:2.5rem;height:2.5rem;font-size:0.9375rem}.mem b{font-size:0.875rem;display:block}.mem small{font-size:0.75rem;color:var(--muted)}
.lightbox{background:rgba(0,0,0,.9);z-index:200}.lightbox img{max-width:96vw;max-height:92vh;border-radius:0.5rem}
.toast{position:fixed;left:50%;top:max(1rem,env(safe-area-inset-top));transform:translate(-50%,-5rem);background:#1f2937;color:#fff;padding:0.625rem 1.125rem;border-radius:0.875rem;font-size:0.8125rem;z-index:300;transition:.25s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}.toast.err{background:#dc2626}
@media (min-width:768px){.row{max-width:78%}.header,.dock{margin-left:0.875rem;margin-right:0.875rem}}
@media (max-width:420px){.tool{width:2.375rem}.av{width:2.125rem;height:2.125rem}.title{font-size:0.9375rem}}
.row{touch-action:pan-y}
.quote{background:rgba(10,106,166,.08);border-left:3px solid var(--primary);border-radius:.6rem;padding:.35rem .7rem;margin:.1rem 0 .45rem;font-size:.85rem;color:var(--muted);cursor:pointer;max-width:min(18rem,100%);overflow:hidden}
.row.out .quote{background:rgba(10,106,166,.14)}
.quote b{display:block;font-size:.78rem;color:var(--primary);margin-bottom:1px}
.quote span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote.gone{cursor:default;font-style:italic}
.ctxbar{display:none;align-items:center;gap:.6rem;background:var(--card);border-left:3px solid var(--primary);border-radius:.8rem;padding:.35rem .4rem .35rem .8rem}
.ctxbar>i{color:var(--primary)}
.ctxtxt{flex:1;min-width:0}.ctxtxt b{display:block;font-size:.8rem;color:var(--primary)}
.ctxtxt span{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmenu{position:fixed;z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:1rem;box-shadow:0 .6rem 2rem rgba(0,0,0,.22);padding:.3rem;min-width:9rem;display:flex;flex-direction:column}
.cmenu button{display:flex;align-items:center;gap:.7rem;background:none;border:0;color:var(--text);font-family:inherit;font-size:.95rem;padding:.6rem .8rem;border-radius:.7rem;cursor:pointer;text-align:left}
.cmenu button:hover{background:var(--card)}.cmenu button i{width:1.1rem;color:var(--muted)}
.cmenu button.danger,.cmenu button.danger i{color:#ef4444}
.row.flash .bub{animation:flash 1.3s}
@keyframes flash{0%,65%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:var(--shadow)}}
.av[data-act],.mem{cursor:pointer}
.prof{max-width:22rem;padding:1.6rem 1.2rem 1.3rem;position:relative;text-align:center;overflow-y:auto}
.pclose{position:absolute;top:.5rem;right:.5rem}
.pav{width:6.5rem;height:6.5rem;border-radius:50%;margin:0 auto .8rem;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.6rem;font-weight:700;box-shadow:var(--shadow);background:#0d7a5f}
.pav img{width:100%;height:100%;object-fit:cover;background:#fff}
.pname{font-size:1.2rem;font-weight:700}
.prole{display:inline-block;margin:.4rem 0 1rem;background:var(--chip-on);color:var(--chip-on-text);font-size:.8rem;font-weight:700;padding:.2rem .8rem;border-radius:1rem}
.prows{display:flex;flex-direction:column;gap:.5rem;text-align:left}
.prow{display:flex;align-items:center;gap:.8rem;background:var(--card);border-radius:.9rem;padding:.6rem .9rem}
.prow>i{width:1.2rem;text-align:center;color:var(--primary)}
.prow small{display:block;font-size:.75rem;color:var(--muted)}
.prow b,.prow a{font-size:.95rem;font-weight:600;color:var(--text);text-decoration:none;word-break:break-word}
</style>
</head>
<body>
<div class="auth" id="auth"><div class="auth-card"><div style="font-size:44px">🔒</div><h2>សូមចូលប្រើប្រាស់ជាមុនសិន!</h2><p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login គណនីរបស់អ្នកដើម្បីចូលរួមការសន្ទនា។</p><button class="btn-primary" onclick="goIndex()">🔑 ទៅកាន់ទំព័រដើម</button></div></div>

<div id="app">
  <div class="header">
    <button class="icon-btn" onclick="goIndex()" title="ថយក្រោយ"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="logo"><img src="logo.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fa-solid fa-school',style:'color:#eab308;font-size:20px'}))"></div>
    <div class="title" id="roomTitle"></div>
    <button class="icon-btn" onclick="toggleSearch()" title="ស្វែងរក"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button class="icon-btn" onclick="openMembers()" title="សមាជិក"><i class="fa-solid fa-user-group"></i></button>
  </div>
  <div class="search-bar" id="searchBar"><i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i><input id="searchInput" placeholder="ស្វែងរកសារ..." oninput="onSearch(this.value)"><button class="icon-btn" style="width:30px;height:30px;font-size:14px" onclick="toggleSearch()">✕</button></div>

  <div class="stage">
    <div id="chatBox"></div>
    <button class="fab" id="fab" onclick="scrollBottom(true)"><i class="fa-solid fa-chevron-down"></i><span class="badge" id="fabBadge"></span></button>
  </div>

  <div class="dock" id="dock">
    <div class="emoji" id="emoji"></div>
    <div class="ctxbar" id="ctxbar"><i class="fa-solid fa-reply" id="ctxIco"></i><div class="ctxtxt"><b id="ctxTitle"></b><span id="ctxSnip"></span></div><button class="icon-btn" onclick="clearCtx()" title="បោះបង់">✕</button></div>
    <div class="compose">
      <div class="tools" id="tools">
        <button class="tool" onclick="toggleEmoji()" title="Emoji"><i class="fa-regular fa-face-smile"></i></button>
        <button class="tool" onclick="pickFile('video')" title="វីដេអូ"><i class="fa-solid fa-video"></i></button>
        <button class="tool" onclick="pickFile('image')" title="រូបភាព"><i class="fa-regular fa-image"></i></button>
      </div>
      <div class="recbar" id="recbar"><span class="recdot"></span><span id="recTimer">0:00</span><button onclick="cancelRec()">បោះបង់</button></div>
      <textarea id="msgInput" rows="1" placeholder="ផ្ញើសារ..." oninput="onInput()" onfocus="closeEmoji()"></textarea>
      <button class="send" id="sendBtn" onclick="mainAction()"><i class="fa-solid fa-microphone" id="ico"></i></button>
    </div>
    <input type="file" id="fileIn" style="display:none" onchange="onFile(this)">
  </div>
</div>

<div class="overlay" id="memModal" onclick="if(event.target===this)closeMembers()"><div class="modal"><div class="mhead"><span><i class="fa-solid fa-user-group"></i> សមាជិកទាំងអស់</span><button class="icon-btn" onclick="closeMembers()">✕</button></div><div class="mlist" id="memList"></div></div></div>
<div class="overlay" id="profModal" style="z-index:120" onclick="if(event.target===this)closeProfile()"><div class="modal prof"><button class="icon-btn pclose" onclick="closeProfile()" title="បិទ">✕</button><div id="profBody"></div></div></div>
<div class="overlay lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const sb=supabase.createClient("https://nggnuobnrxiqjtcwlvwk.supabase.co","sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML");
/* ប្តូរឈ្មោះក្រុម និងបន្ទប់ (room_id) ក្នុងតារាង chat_messages នៅទីនេះ */
const APP_TITLE='Chat';
const ROOM='global';
const PAGE=60, MAX_VIDEO_MB=8, MAX_IMG_W=1200;

const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|data:(image|audio|video)\/)/.test(u)?u:''};
const pad=n=>(n<10?'0':'')+n;

/* ---------- viewport (keyboard-safe on all devices) ---------- */
let lastH=0;
function availH(){
  let h=window.innerHeight;
  try{
    if(window.parent!==window&&window.frameElement){            /* ក្នុង iframe របស់ index.html */
      const fr=window.frameElement.getBoundingClientRect(),P=window.parent;
      let bottom=fr.bottom;
      const nav=P.document.querySelector('.mobile-bottom-nav');   /* មីនុយខាងក្រោមលើទូរសព្ទ */
      if(nav&&P.getComputedStyle(nav).display!=='none')bottom=Math.min(bottom,nav.getBoundingClientRect().top);
      if(P.visualViewport)bottom=Math.min(bottom,P.visualViewport.offsetTop+P.visualViewport.height); /* keyboard */
      h=Math.max(200,Math.min(h,bottom-fr.top));
    }else if(window.visualViewport)h=window.visualViewport.height;
  }catch(e){}
  return Math.round(h);
}
function fitViewport(){
  const h=availH();if(h===lastH)return;lastH=h;
  document.documentElement.style.setProperty('--vh',h+'px');
  if(nearBottom(260))scrollBottom();
}
window.addEventListener('resize',fitViewport);
try{
  const VV=(window.parent!==window&&window.parent.visualViewport)||window.visualViewport;
  if(VV){VV.addEventListener('resize',fitViewport);VV.addEventListener('scroll',fitViewport)}
  if(window.parent!==window)window.parent.addEventListener('resize',fitViewport);
}catch(e){}
setInterval(fitViewport,700);

const PALETTE=['#0d7a5f','#2563eb','#c2410c','#7c3aed','#0891b2','#be185d','#4d7c0f','#b45309'];
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function userSub(u){if(!u)return'';if(String(u.role||'').toLowerCase()==='admin')return'Admin';return u.assigned_classes?'ថ្នាក់ទី '+u.assigned_classes:''}

let msgs=[], oldestReached=false, query='', lastSig='', unseen=0, chan=null, busy=false;

/* ---------- data ---------- */
async function refresh(force){
  if(busy)return;busy=true;const room=ROOM;
  try{
    const{data,error}=await sb.from('chat_messages').select('*').eq('room_id',room).order('created_at',{ascending:false}).limit(PAGE);
    if(error)throw error;if(room!==ROOM)return;
    const fresh=(data||[]).slice().reverse();
    const full=(data||[]).length>=PAGE;
    const keep=full&&fresh.length?msgs.filter(m=>m.created_at<fresh[0].created_at):[];
    if(!full)oldestReached=true;
    const prevLast=msgs.length?msgs[msgs.length-1].id:null;
    msgs=keep.concat(fresh);
    const added=msgs.filter(m=>prevLast!==null&&m.id>prevLast&&!isMine(m)).length;
    const stick=force||nearBottom(160);
    if(!stick)unseen+=added;
    render(stick);
  }catch(e){if(force)toast('មិនអាចទាញយកសារបាន៖ '+(e.message||e),true)}
  finally{busy=false}
}
async function loadOlder(){
  if(!msgs.length||oldestReached)return;
  const{data,error}=await sb.from('chat_messages').select('*').eq('room_id',ROOM).lt('created_at',msgs[0].created_at).order('created_at',{ascending:false}).limit(PAGE);
  if(error){toast('មិនអាចទាញសារចាស់បាន',true);return}
  if(!data||data.length<PAGE)oldestReached=true;
  const h=box.scrollHeight;msgs=(data||[]).slice().reverse().concat(msgs);render(false);box.scrollTop+=box.scrollHeight-h;
}
function subscribe(){
  try{if(chan)sb.removeChannel(chan);
    chan=sb.channel('chat_'+ROOM).on('postgres_changes',{event:'*',schema:'public',table:'chat_messages',filter:'room_id=eq.'+ROOM},()=>refresh()).subscribe()}catch(e){}
}
const isMine=m=>{const c=String(m.sender_code||'').toLowerCase();return(c&&c===MY_CODE)||(!c&&String(m.sender_name||'').trim()===MY_NAME)};

/* ---------- render ---------- */
const dateLabel=iso=>{const d=new Date(iso);if(isNaN(d))return'';const t=new Date(),y=new Date();y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString())return'ថ្ងៃនេះ';if(d.toDateString()===y.toDateString())return'ម្សិលមិញ';
  return d.toLocaleDateString('km-KH',{day:'numeric',month:'short',year:'numeric'})};
const linkify=s=>s.replace(/(https?:\/\/[^\s<]+)/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
function seededBars(id,n=34){let s=0;for(const c of String(id))s=(s*33+c.charCodeAt(0))>>>0;const out=[];for(let i=0;i<n;i++){s=(s*1664525+1013904223)>>>0;out.push(6+(s>>>8)%24)}return out}

function bodyHtml(m,time,del){
  const meta=`<span class="meta">${del}${time}</span>`;
  const url=safeUrl(m.content);
  if(m.type==='audio'){
    return`<div class="audio" data-id="${m.id}"><button class="play" data-act="play"><i class="fa-solid fa-play"></i></button><button class="spd" data-act="speed">1x</button>
      <div><div class="wave">${seededBars(m.id).map(h=>`<i style="height:${(h/16).toFixed(3)}rem"></i>`).join('')}</div><div class="ameta"><span class="dur">--:--</span><span>${del}${time}</span></div></div></div>`;
  }
  if(m.type==='image')return`<img class="img" src="${url}" data-act="zoom" loading="lazy" alt="">${m.caption?`<div class="body">${linkify(esc(m.caption))}${meta}</div>`:`<div class="meta block">${del}${time}</div>`}`;
  if(m.type==='video')return`<video class="vid" src="${url}" controls preload="metadata" playsinline></video>${m.caption?`<div class="body">${linkify(esc(m.caption))}${meta}</div>`:`<div class="meta block">${del}${time}</div>`}`;
  return`<div class="body">${linkify(esc(m.content)).replace(/\n/g,'<br>')}${meta}</div>`;
}
function render(stick){
  const q=query.trim().toLowerCase();
  const list=q?msgs.filter(m=>m.type==='text'&&String(m.content||'').toLowerCase().includes(q)):msgs;
  const sig=ROOM+'|'+q+'|'+list.map(m=>m.id+':'+(m.content||'').length+(m.edited_at||'')).join(',')+'|'+Object.keys(users).length+'|'+oldestReached+'|'+Object.keys(quoteCache).length;
  if(sig===lastSig)return;lastSig=sig;
  $('roomTitle').textContent=APP_TITLE;
  if(!list.length){box.innerHTML=`<div class="empty">${q?'រកមិនឃើញសារទេ':'មិនទាន់មានសារសន្ទនានៅឡើយទេ<br><small>វាយបញ្ចូលសារខាងក្រោមដើម្បីចាប់ផ្តើម</small>'}</div>`;updateFab();return}
  let h=!oldestReached&&!q?'<button class="load-more" data-act="older">ទាញសារចាស់ៗ</button>':'';
  let lastDate='';
  list.forEach((m,i)=>{
    const dl=dateLabel(m.created_at);if(dl&&dl!==lastDate){h+=`<div class="date-pill">${dl}</div>`;lastDate=dl}
    const s=sender(m),mine=isMine(m);
    const prev=list[i-1],next=list[i+1];
    const same=(a,b)=>a&&b&&String(a.sender_code||a.sender_name)===String(b.sender_code||b.sender_name)&&dateLabel(a.created_at)===dateLabel(b.created_at)&&Math.abs(new Date(b.created_at)-new Date(a.created_at))<300000;
    const first=!same(prev,m),last=!same(m,next);
    const wk=esc(m.sender_code||m.sender_name||'');
    let av='';
    {
      if(!last)av='<div class="av sp"></div>';
      else if(s.photo)av=`<div class="av" data-act="profile" data-who="${wk}"><img src="${esc(s.photo)}" data-ini="${esc(s.initial)}" alt=""></div>`;
      else if(s.isAdmin)av=`<div class="av" data-act="profile" data-who="${wk}"><img src="logo.png" data-ini="${esc(s.initial)}" alt=""></div>`;
      else av=`<div class="av" data-act="profile" data-who="${wk}" style="background:${s.color}">${esc(s.initial)}</div>`;
    }
    const who=(!mine&&first)?`<div class="who ${s.isAdmin?'admin':''}">${esc(s.name)}${s.sub?' · '+esc(s.sub):''}</div>`:'';
    const del='';
    h+=`<div class="row ${mine?'out':'in'} ${first?'first':''} ${last?'last':''}" data-id="${m.id}">${av}<div class="bub">${who}${quoteHtml(m)}${bodyHtml(m,(m.edited_at?'កែរួច · ':'')+timeStr(m.created_at),del)}</div></div>`;
  });
  const keep=box.scrollTop,h0=box.scrollHeight;
  box.innerHTML=h;
  if(stick)scrollBottom();else box.scrollTop=keep+(0);
  updateFab();hydrateAudio();fetchQuotes();
}

/* ---------- reply · edit · context menu ---------- */
const quoteCache={},pendingQ=new Set();let ctx=null,menuEl=null;
function snippetOf(m){if(!m)return'';return m.type==='image'?'🖼️ '+(m.caption||'រូបភាព'):m.type==='audio'?'🎙️ សំឡេង':m.type==='video'?'🎬 '+(m.caption||'វីដេអូ'):String(m.content||'').replace(/\s+/g,' ').slice(0,160)}
function quoteHtml(m){
  if(m.reply_to_id==null)return'';
  const id=m.reply_to_id,r=msgById(id)||quoteCache[id];
  if(!r)return`<div class="quote gone">${(id in quoteCache)?'សារដើមត្រូវបានលុប':'...'}</div>`;
  return`<div class="quote" data-act="goto" data-id="${r.id}"><b>${esc(sender(r).name)}</b><span>${esc(snippetOf(r))}</span></div>`;
}
async function fetchQuotes(){
  const ids=[...new Set(msgs.map(m=>m.reply_to_id).filter(x=>x!=null))].filter(id=>!msgById(id)&&!(id in quoteCache)&&!pendingQ.has(id));
  if(!ids.length)return;ids.forEach(id=>pendingQ.add(id));
  try{const{data}=await sb.from('chat_messages').select('*').in('id',ids);
    ids.forEach(id=>{quoteCache[id]=(data||[]).find(r=>String(r.id)===String(id))||null;pendingQ.delete(id)});
    lastSig='';render(false)}catch(e){ids.forEach(id=>pendingQ.delete(id))}
}
function showCtx(){
  const b=$('ctxbar');if(!ctx){b.style.display='none';return}
  b.style.display='flex';$('ctxIco').className='fa-solid '+(ctx.mode==='edit'?'fa-pen':'fa-reply');
  $('ctxTitle').textContent=ctx.mode==='edit'?'កែសារ':'ឆ្លើយតបទៅ '+ctx.name;$('ctxSnip').textContent=ctx.snip||'';
}
function keepBottom(){const was=nearBottom(220);setTimeout(()=>{if(was)scrollBottom()},80)}
function startReply(id){
  const m=msgById(id);if(!m)return;
  if(ctx&&ctx.mode==='edit')$('msgInput').value='';
  ctx={mode:'reply',id:m.id,name:sender(m).name,snip:snippetOf(m)};showCtx();onInput();$('msgInput').focus();keepBottom();
}
function startEdit(id){
  const m=msgById(id);if(!m||m.type!=='text'||!isMine(m))return;
  ctx={mode:'edit',id:m.id,snip:snippetOf(m)};const i=$('msgInput');i.value=m.content||'';
  showCtx();onInput();i.focus();i.setSelectionRange(i.value.length,i.value.length);keepBottom();
}
function clearCtx(){if(ctx&&ctx.mode==='edit')$('msgInput').value='';ctx=null;showCtx();onInput()}
function takeReply(){if(ctx&&ctx.mode==='reply'){const id=ctx.id;ctx=null;showCtx();return id}return null}
async function saveEdit(t){
  const id=ctx.id,m=msgById(id);
  if(m&&m.content===t){clearCtx();return}
  const stamp=new Date().toISOString();let hasStamp=true;
  let r=await sb.from('chat_messages').update({content:t,edited_at:stamp}).eq('id',id).select();
  if(r.error&&/edited_at/.test(r.error.message||'')){hasStamp=false;r=await sb.from('chat_messages').update({content:t}).eq('id',id).select();
    if(!r.error)toast('សូមបន្ថែមជួរ edited_at ក្នុង Supabase ដើម្បីបង្ហាញស្លាក "កែរួច"',true)}
  if(r.error)throw r.error;
  if(!r.data||!r.data.length)throw new Error('មិនមានសិទ្ធិកែសារនេះ');
  if(m){m.content=t;if(hasStamp)m.edited_at=stamp}
  clearCtx();render(false);
}
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null}}
function openMenu(id,bub){
  closeMenu();const m=msgById(id);if(!m)return;const mine=isMine(m);
  const items=[['reply','fa-reply','ឆ្លើយតប']];
  if(mine&&m.type==='text')items.push(['edit','fa-pen','កែសារ']);
  if(m.type==='text')items.push(['copy','fa-copy','ចម្លង']);
  if(mine||IS_ADMIN)items.push(['del','fa-trash-can','លុប','danger']);
  const el=document.createElement('div');el.className='cmenu';
  el.innerHTML=items.map(it=>`<button data-k="${it[0]}" class="${it[3]||''}"><i class="fa-solid ${it[1]}"></i>${it[2]}</button>`).join('');
  el.style.visibility='hidden';document.body.appendChild(el);menuEl=el;
  const r=bub.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
  let top=r.bottom+6;if(top+h>innerHeight-10)top=r.top-h-6;top=Math.max(10,Math.min(top,innerHeight-h-10));
  let left=mine?r.right-w:r.left;left=Math.max(8,Math.min(left,innerWidth-w-8));
  el.style.top=top+'px';el.style.left=left+'px';el.style.visibility='visible';
  el.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;ev.stopPropagation();closeMenu();
    ({reply:()=>startReply(id),edit:()=>startEdit(id),copy:()=>copyText(m.content),del:()=>deleteMsg(id)})[b.dataset.k]()});
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t||'');toast('បានចម្លង')}
  catch(e){const a=document.createElement('textarea');a.value=t||'';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('បានចម្លង')}catch(_){}a.remove()}
}
async function gotoMsg(id){
  for(let i=0;i<8;i++){
    const el=box.querySelector('.row[data-id="'+id+'"]');
    if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1400);return}
    if(oldestReached)break;await loadOlder();
  }
  toast('រកមិនឃើញសារដើម',true);

document.addEventListener('click',e=>{if(menuEl&&!e.target.closest('.cmenu'))closeMenu()},true);
box.addEventListener('scroll',closeMenu);window.addEventListener('resize',closeMenu);
box.addEventListener('contextmenu',e=>{const bub=e.target.closest('.bub');if(!bub)return;e.preventDefault();openMenu(bub.closest('.row').dataset.id,bub)});
/* អូសសារទៅឆ្វេងដើម្បីឆ្លើយតប (ដូច Telegram) */
let sw=null;
box.addEventListener('touchstart',e=>{const row=e.target.closest('.row');if(!row||e.touches.length!==1){sw=null;return}const t=e.touches[0];sw={row,x:t.clientX,y:t.clientY,dx:0,lock:false}},{passive:true});
box.addEventListener('touchmove',e=>{
  if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.lock){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)>10)sw.lock=true}
  if(sw.lock){sw.dx=Math.min(0,dx);sw.row.style.transition='none';sw.row.style.transform='translateX('+Math.max(sw.dx,-80)+'px)'}
},{passive:true});
function endSwipe(){if(!sw)return;const r=sw.row;r.style.transition='transform .2s';r.style.transform='';if(sw.dx<-60)startReply(r.dataset.id);sw=null}
box.addEventListener('touchend',endSwipe);box.addEventListener('touchcancel',()=>{if(sw){sw.row.style.transition='transform .2s';sw.row.style.transform='';sw=null}});

/* ---------- audio ---------- */
let audio=null,audioBtn=null,rate=1;
const fmt=s=>!isFinite(s)||s<0?'--:--':Math.floor(s/60)+':'+pad(Math.floor(s%60));
function msgById(id){return msgs.find(m=>String(m.id)===String(id))}
function hydrateAudio(){
  box.querySelectorAll('.audio').forEach(el=>{
    const m=msgById(el.dataset.id);if(!m||el._d)return;el._d=1;
    const a=new Audio();a.preload='metadata';a.src=safeUrl(m.content);
    const set=()=>{el.querySelector('.dur').textContent=fmt(a.duration)};
    a.onloadedmetadata=()=>{if(a.duration===Infinity){a.currentTime=1e101;a.ontimeupdate=()=>{a.ontimeupdate=null;a.currentTime=0;set()}}else set()};
  });
}
function paintWave(card,ratio){const bars=card.querySelectorAll('.wave i');const n=Math.round(bars.length*ratio);bars.forEach((b,i)=>b.classList.toggle('on',i<n))}
function stopAudio(){if(audio){audio.pause();audio=null}if(audioBtn){audioBtn.innerHTML='<i class="fa-solid fa-play"></i>';audioBtn=null}}
function playAudio(btn,row){
  const card=btn.closest('.audio');
  if(audio&&audioBtn===btn){if(audio.paused){audio.play();btn.innerHTML='<i class="fa-solid fa-pause"></i>'}else{audio.pause();btn.innerHTML='<i class="fa-solid fa-play"></i>'}return}
  stopAudio();const m=msgById(row.dataset.id);if(!m)return;
  audio=new Audio(safeUrl(m.content));audioBtn=btn;audio.playbackRate=rate;
  const dur=card.querySelector('.dur');
  audio.ontimeupdate=()=>{const d=isFinite(audio.duration)?audio.duration:0;paintWave(card,d?audio.currentTime/d:0);dur.textContent=fmt(audio.currentTime)};
  audio.onended=()=>{btn.innerHTML='<i class="fa-solid fa-play"></i>';paintWave(card,0);dur.textContent=fmt(audio.duration);audio=null;audioBtn=null};
  audio.onerror=()=>{toast('មិនអាចចាក់សំឡេងនេះបាន',true);stopAudio()};
  audio.play().then(()=>btn.innerHTML='<i class="fa-solid fa-pause"></i>').catch(()=>toast('មិនអាចចាក់សំឡេងបាន',true));
}
function cycleSpeed(btn){const s=[1,1.5,2];rate=s[(s.indexOf(rate)+1)%s.length];box.querySelectorAll('.spd').forEach(b=>b.textContent=rate+'x');if(audio)audio.playbackRate=rate}

/* ---------- sending ---------- */
async function send(type,content,caption,rid){
  if(rid===undefined)rid=takeReply();
  const payload={room_id:ROOM,sender_name:ME?.teacher_name||ME?.username||'',sender_code:ME?.username||ME?.teacher_id||'',sender_role:ME?.role||'teacher',type,content};
  if(caption)payload.caption=caption;
  if(rid!=null)payload.reply_to_id=rid;
  let r=await sb.from('chat_messages').insert([payload]).select();
  if(r.error&&rid!=null&&/reply_to_id/.test(r.error.message||'')){
    delete payload.reply_to_id;r=await sb.from('chat_messages').insert([payload]).select();
    if(!r.error)toast('សូមបន្ថែមជួរ reply_to_id ក្នុង Supabase ដើម្បីឱ្យការឆ្លើយតបដំណើរការ',true);
  }
  if(r.error)throw r.error;
  const data=r.data;
  if(data&&data[0]&&!msgs.some(m=>m.id===data[0].id)){msgs.push(data[0]);render(true)}else refresh(true);
}
function onInput(){const i=$('msgInput');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,7.5*parseFloat(getComputedStyle(document.documentElement).fontSize))+'px';
  const has=i.value.trim().length>0;$('ico').className='fa-solid '+(has?(ctx&&ctx.mode==='edit'?'fa-check':'fa-paper-plane'):'fa-microphone')}
$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendText()}else if(e.key==='Escape')clearCtx()});
async function sendText(){
  const i=$('msgInput'),t=i.value.trim();if(!t)return;
  closeEmoji();
  if(ctx&&ctx.mode==='edit'){try{await saveEdit(t)}catch(e){toast('កែសារមិនបាន៖ '+(e.message||e),true)}return}
  const rid=takeReply();i.value='';onInput();
  try{await send('text',t,null,rid)}
  catch(e){i.value=t;if(rid!=null)startReply(rid);onInput();toast('មិនអាចផ្ញើសារបានទេ៖ '+(e.message||e),true)}
}
function mainAction(){if($('msgInput').value.trim())sendText();else if(ctx&&ctx.mode==='edit')clearCtx();else toggleRec()}

/* ---------- media ---------- */
let pickType='image';
function pickFile(t){pickType=t;const f=$('fileIn');f.accept=t+'/*';f.click()}
function toDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height;if(w>MAX_IMG_W){h=Math.round(h*MAX_IMG_W/w);w=MAX_IMG_W}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75))};
  img.onerror=rej;img.src=u})}
async function onFile(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  try{
    if(pickType==='video'){
      if(f.size>MAX_VIDEO_MB*1048576){toast('វីដេអូធំពេក (អតិបរមា '+MAX_VIDEO_MB+'MB)',true);return}
      toast('កំពុងផ្ញើវីដេអូ...');await send('video',await toDataUrl(f),'');
    }else{
      const data=await compress(f);const cap=(prompt('បញ្ចូលចំណងជើងរូបភាព (ទុកទទេបានបើមិនមាន)៖')||'').trim();
      await send('image',data,cap);
    }
  }catch(e){toast('ផ្ញើមិនបាន៖ '+(e.message||e),true)}
}

/* ---------- voice recording ---------- */
let rec=null,chunks=[],recT=null,recS=0,recCancel=false;
function recUI(on){$('recbar').style.display=on?'flex':'none';$('msgInput').style.display=on?'none':'block';$('tools').style.display=on?'none':'flex';$('sendBtn').classList.toggle('rec',on);$('ico').className='fa-solid '+(on?'fa-stop':'fa-microphone')}
async function toggleRec(){
  if(rec&&rec.state==='recording'){rec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('ឧបករណ៍មិនគាំទ្រការថតសំឡេង',true);return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac'].find(t=>MediaRecorder.isTypeSupported(t))||'';
    chunks=[];recCancel=false;rec=new MediaRecorder(stream,mt?{mimeType:mt}:{});
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{
      clearInterval(recT);recUI(false);stream.getTracks().forEach(t=>t.stop());
      if(recCancel||!chunks.length)return;
      try{await send('audio',await toDataUrl(new Blob(chunks,{type:rec.mimeType||'audio/mp4'})))}catch(e){toast('ផ្ញើសំឡេងមិនបាន៖ '+(e.message||e),true)}
    };
    rec.start(250);recS=0;$('recTimer').textContent='0:00';recUI(true);
    recT=setInterval(()=>{recS++;$('recTimer').textContent=Math.floor(recS/60)+':'+pad(recS%60)},1000);
  }catch(e){toast('សូមអនុញ្ញាតសិទ្ធិប្រើ Microphone',true)}
}
function cancelRec(){recCancel=true;if(rec&&rec.state==='recording')rec.stop()}

/* ---------- delete ---------- */
async function deleteMsg(id){
  if(!id||!confirm('តើលោកអ្នកពិតជាចង់លុបសារនេះមែនទេ?'))return;
  try{const{error}=await sb.from('chat_messages').delete().eq('id',id);if(error)throw error;
    msgs=msgs.filter(m=>String(m.id)!==String(id));render(false)}catch(e){toast('លុបមិនបាន៖ '+(e.message||e),true)}
}

/* ---------- emoji / search / members ---------- */
const EMOJIS="😀😃😄😁😆😅😂🤣🙂😉😊😇🥰😍🤩😘😋😜🤪🤗🤔😏😌😴😷🤯🥳😎🤓😢😭😡👍👎👏🙌🙏🤝👊✌️👌❤️🔥💯✨🎉⭐💡☕✅❌📚✏️🏫".match(/\p{Extended_Pictographic}(\uFE0F)?(\u200D\p{Extended_Pictographic}(\uFE0F)?)*/gu)||[];
function toggleEmoji(){const d=$('emoji');if(d.style.display==='grid'){d.style.display='none';return}
  if(!d.childElementCount)d.innerHTML=EMOJIS.map(e=>`<button type="button">${e}</button>`).join('');d.style.display='grid'}
function closeEmoji(){$('emoji').style.display='none'}
$('emoji').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=$('msgInput');i.value+=b.textContent;onInput();i.focus()});
document.addEventListener('click',e=>{if(!e.target.closest('#emoji')&&!e.target.closest('#tools'))closeEmoji()});
function toggleSearch(){const b=$('searchBar'),on=b.style.display==='flex';b.style.display=on?'none':'flex';if(on){$('searchInput').value='';onSearch('')}else $('searchInput').focus()}
function onSearch(v){query=v;render(false)}
async function openMembers(){
  $('memModal').style.display='flex';drawMembers(uniqueUsers(Object.values(users)));
  try{const{data}=await sb.from('users').select('id, teacher_id, teacher_name, username, role, assigned_classes, photo_url, gender, phone').order('id',{ascending:true});if(data)drawMembers(data)}catch(e){}
}
const uniqueUsers=a=>{const s=new Set();return a.filter(u=>{const k=u.id||u.username;if(s.has(k))return false;s.add(k);return true})};
const isMeUser=u=>!!MY_CODE&&[u.username,u.teacher_id].some(x=>String(x||'').toLowerCase()===MY_CODE);
function drawMembers(list){
  const rank=u=>isMeUser(u)?0:(String(u.role||'').toLowerCase()==='admin'?1:2);
  list=list.slice().sort((a,b)=>rank(a)-rank(b));
  $('memList').innerHTML=list.length?list.map(u=>{
    const nm=u.teacher_name||u.username||'',p=safeUrl(u.photo_url),me=isMeUser(u);
    return`<div class="mem${me?' me':''}" data-who="${esc(u.username||u.teacher_id||nm)}"><div class="av" style="background:${hue(u.username||nm)}">${p?`<img src="${esc(p)}" data-ini="${esc(nm.charAt(0))}" alt="">`:esc(nm.charAt(0)||'U')}</div><div><b>${esc(nm)}${me?'<span class="chip">គណនីរបស់អ្នក</span>':''}</b><small>${esc(userSub(u)||'គ្រូបង្រៀន')}</small></div></div>`}).join(''):'<div class="empty">មិនមានបញ្ជីសមាជិកឡើយ</div>';
}
$('memList').addEventListener('click',e=>{const r=e.target.closest('.mem');if(r)openProfile(r.dataset.who)});
function closeMembers(){$('memModal').style.display='none'}

/* ---------- profile card ---------- */
function openProfile(key){
  const k=String(key||'').trim();
  const u=users[k.toLowerCase()]||users[k]||null;
  const name=(u&&u.teacher_name)||k||'អ្នកប្រើប្រាស់';
  const isAdm=String((u&&u.role)||'').toLowerCase()==='admin';
  const photo=safeUrl(u&&u.photo_url),ini=name.trim().charAt(0)||'U';
  const me=u?isMeUser(u):(k.toLowerCase()===MY_CODE);
  const row=(ic,lb,v)=>`<div class="prow"><i class="fa-solid ${ic}"></i><div><small>${lb}</small>${v}</div></div>`;
  let rows='';
  if(u&&u.assigned_classes)rows+=row('fa-chalkboard-user','ថ្នាក់ទទួលបន្ទុក','<b>ថ្នាក់ទី '+esc(u.assigned_classes)+'</b>');
  if(u&&u.gender)rows+=row('fa-venus-mars','ភេទ','<b>'+esc(u.gender)+'</b>');
  if(u&&u.phone){const tel=String(u.phone).replace(/[^0-9+]/g,'');rows+=row('fa-phone','លេខទូរសព្ទ',tel?`<a href="tel:${tel}">${esc(u.phone)}</a>`:'<b>'+esc(u.phone)+'</b>')}
  if(u&&u.teacher_id)rows+=row('fa-id-badge','អត្តលេខគ្រូ','<b>'+esc(u.teacher_id)+'</b>');
  if(!rows)rows='<div class="empty" style="padding:.5rem">មិនមានព័ត៌មានបន្ថែមទេ</div>';
  const av=photo?`<img src="${esc(photo)}" data-ini="${esc(ini)}" alt="">`:(isAdm?`<img src="logo.png" data-ini="${esc(ini)}" alt="">`:esc(ini));
  $('profBody').innerHTML=`<div class="pav" style="${photo||isAdm?'':'background:'+hue(k||name)}">${av}</div><div class="pname">${esc(name)}</div><div class="prole">${isAdm?'អ្នកគ្រប់គ្រង (Admin)':'គ្រូបង្រៀន'}${me?' · គណនីរបស់អ្នក':''}</div><div class="prows">${rows}</div>`;
  $('profModal').style.display='flex';
}
function closeProfile(){$('profModal').style.display='none'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeProfile();closeMembers();closeMenu();$('lightbox').style.display='none'}});

/* ---------- init ---------- */
window.addEventListener('DOMContentLoaded',()=>{
  if(!ME||!ME.username){$('auth').style.display='flex';return}
  $('app').style.display='flex';$('roomTitle').textContent=APP_TITLE;
  fitViewport();render(true);
  loadUsers().then(()=>{lastSig='';refresh(true)});
  subscribe();
  setInterval(()=>{if(!document.hidden)refresh()},10000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
});
</script>
