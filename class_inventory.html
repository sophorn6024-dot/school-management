<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>បញ្ជីសារពើភ័ណ្ឌថ្នាក់រៀន</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Moul&family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --app-bg:#f8fafc;--tb-bg:rgba(255,255,255,.96);--tb-border:#e2e8f0;--card:#fff;--text:#0f172a;--muted:#64748b;
  --in-bg:#fff;--in-border:#cbd5e1;--focus:#0891b2;--grp:#f1f5f9;--sh:0 4px 16px rgba(15,23,42,.06);
  --pop-bg:#ffffff;--pop-line:#e2e8f0;--chip:#f1f5f9;--chip-hover:#e2e8f0;--accent:#0891b2;
  --pop-shadow:0 18px 44px rgba(15,23,42,.20);
  --pw:210mm;--ph:297mm;--mg:5mm;--fs:1;--rowh:auto;color-scheme:light}
[data-theme="dark"]{
  --app-bg:#090e17;--tb-bg:rgba(15,23,42,.95);--tb-border:#1e293b;--card:#111e33;--text:#f8fafc;--muted:#9aa3b2;
  --in-bg:#162642;--in-border:#233f66;--focus:#22d3ee;--grp:#0e1a2d;--sh:0 8px 24px rgba(0,0,0,.45);
  --pop-bg:#25282e;--pop-line:#3a3f48;--chip:#33363d;--chip-hover:#3e424a;--accent:#0894b3;
  --pop-shadow:0 18px 48px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;background:var(--app-bg);color:var(--text);font-family:'Battambang',sans-serif;padding-bottom:50px;overflow-x:auto;transition:background .25s,color .25s}

.auth-wrapper{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:30px 20px}
.auth-card{background:var(--card);border:1.5px solid var(--tb-border);border-radius:24px;padding:40px 28px;max-width:440px;width:100%;box-shadow:var(--sh)}
.auth-card h2{font-size:18px;margin-bottom:8px;color:#ef4444}
.auth-card p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px}

.toolbar{position:sticky;top:0;z-index:1000;background:var(--tb-bg);backdrop-filter:blur(14px);padding:10px 16px;display:none;flex-direction:column;gap:8px;box-shadow:var(--sh);border-bottom:1.5px solid var(--tb-border);margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{background:var(--grp);border:1px solid var(--tb-border);border-radius:10px;padding:4px 8px;display:inline-flex;align-items:center;gap:6px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.fc{padding:5px 8px;font-family:'Kantumruy Pro','Battambang',sans-serif;font-size:12.5px;font-weight:600;border:1.5px solid var(--in-border);border-radius:8px;outline:none;background:var(--in-bg);color:var(--text);height:32px}
.fc:focus{border-color:var(--focus)}
.btn{padding:5px 12px;font-family:'Battambang',sans-serif;font-size:12.5px;font-weight:700;border-radius:8px;border:1px solid var(--tb-border);cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;white-space:nowrap;background:var(--grp);color:var(--text)}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#0891b2,#2563eb);color:#fff;border-color:transparent}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-color:transparent}
.btn-login{background:linear-gradient(135deg,#0284c7,#7c3aed);color:#fff;border:none;padding:10px 24px;height:auto;font-size:13.5px;border-radius:12px;text-decoration:none}
.date-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:4px 10px;font-family:'Battambang',sans-serif;font-size:13px;color:var(--text);background:var(--in-bg);border:1.5px solid var(--in-border);border-radius:8px;cursor:pointer;white-space:nowrap}
.date-btn i{color:var(--muted)}
.date-btn.empty span{color:var(--muted)}
.date-btn.open{border-color:var(--focus)}

.pop{display:none;position:fixed;z-index:2500;background:var(--pop-bg);color:var(--text);border:1px solid var(--pop-line);border-radius:16px;box-shadow:var(--pop-shadow);overflow:auto;font-family:'Battambang',sans-serif}
.pop select{font-family:'Battambang',sans-serif;font-size:15px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--pop-line);background:var(--chip);color:var(--text);outline:none;flex:1;min-width:0}
#dpPop{width:min(340px,calc(100vw - 16px));padding:14px}
.dp-top{display:flex;gap:8px;margin-bottom:10px}
.dp-title{text-align:center;font-weight:700;font-size:14px;margin:6px 0 8px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-wd{font-size:12px;color:var(--muted);padding:6px 0}
.dp-day{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:0;border:none;background:transparent;color:var(--text);font-family:'Battambang',sans-serif;font-size:14px;border-radius:9px;cursor:pointer}
.dp-day small{font-size:9.5px;color:var(--muted);margin-top:1px;white-space:nowrap}
.dp-day.sun>span{color:#ef4444}
.dp-day.holy small{color:#d97706;font-weight:700}
.dp-day.sel small{color:#fff}
.dp-sub{text-align:center;font-size:11.5px;color:var(--muted);margin:-4px 0 6px}
.dp-day:hover{background:var(--chip-hover)}
.dp-day.out{color:var(--muted);opacity:.45}
.dp-day.today{background:var(--chip);font-weight:700}
.dp-day.sel{background:var(--accent);color:#fff;font-weight:700;opacity:1}
.dp-foot{display:flex;justify-content:space-between;border-top:1px solid var(--pop-line);margin-top:8px;padding-top:10px;font-size:13px}
.dp-foot a{color:var(--accent);cursor:pointer;font-weight:700}
.dp-foot a.clr{color:var(--muted)}

#pgPop{width:min(430px,calc(100vw - 16px));padding:18px 18px 8px}
.pg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pg-head h3{font-size:17px}
.pg-reset{background:none;border:none;color:var(--muted);font-family:'Battambang',sans-serif;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pg-sec{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:14px 0 10px}
.pg-sec hr{flex:1;border:none;border-top:1px solid var(--pop-line)}
.opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px 4px;background:var(--chip);color:var(--text);border:1.5px solid transparent;border-radius:12px;font-family:'Battambang',sans-serif;font-size:13.5px;cursor:pointer}
.opt small{font-size:12px;color:var(--muted)}
.opt b{font-family:'Kantumruy Pro',sans-serif;font-size:15px}
.opt.on{background:var(--accent);border-color:#22d3ee;color:#fff}
.opt.on small{color:rgba(255,255,255,.85)}
.ico-p,.ico-l{display:block;border:2px solid currentColor;border-radius:3px}
.ico-p{width:11px;height:17px}.ico-l{width:17px;height:11px}
.step-row{display:flex;align-items:center;gap:8px;margin:10px 0}
.step-row>span:first-child{width:62px;font-size:14px}
.step-row>small{font-size:12.5px;color:var(--muted);flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border:none;border-radius:10px;background:var(--chip);color:var(--text);font-size:18px;cursor:pointer}
.stepper button:active{transform:scale(.94)}
.stepper .val{min-width:104px;height:38px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:15px;padding:0 8px}
.stepper .val em{font-style:normal;color:var(--muted);font-weight:400;font-size:13px}
.stepper .val.auto{color:var(--muted);font-weight:400;font-size:13px}
.pg-info{border-top:1px solid var(--pop-line);margin-top:12px;padding:6px 0 10px}
.pg-info label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
.pg-info .fc{width:100%}
.pg-info textarea.fc{height:auto;line-height:1.6;resize:vertical;font-family:'Battambang',sans-serif;font-weight:400}
.pg-info .link{color:var(--accent);font-size:12.5px;cursor:pointer;font-weight:700;display:inline-block;margin-top:6px}

/* ===== Custom select + month/year picker (Battambang) ===== */
.cs-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-width:150px;font-family:'Battambang',sans-serif!important;font-weight:400!important;font-size:13.5px!important;cursor:pointer;text-align:left}
.cs-btn i{font-size:11px;color:var(--muted)}
#selPop{padding:6px;min-width:180px}
.sel-item{padding:10px 14px;font-size:14.5px;border-radius:9px;cursor:pointer;font-family:'Battambang',sans-serif;color:var(--text)}
.sel-item:hover{background:var(--chip-hover)}
.sel-item.on{background:var(--accent);color:#fff;font-weight:700}
.dp-sel{flex:1;min-width:0;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--pop-line);background:var(--chip);color:var(--text);border-radius:10px;font-family:'Battambang',sans-serif;font-size:15px;cursor:pointer}
.dp-sel i{font-size:11px;color:var(--muted)}
.dp-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:290px;overflow:auto;position:relative}
.dp-pick button{height:42px;border:none;border-radius:10px;background:var(--chip);color:var(--text);font-family:'Battambang',sans-serif;font-size:14px;cursor:pointer}
.dp-pick button.on{background:var(--accent);color:#fff;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;z-index:3000;display:none;border:1px solid #334155}

/* ===== ក្រដាសបញ្ជីសារពើភ័ណ្ឌ ===== */
.sheet-wrap{display:flex;justify-content:center;transform-origin:top center}
.sheet{width:var(--pw);height:calc(var(--ph) - .6mm);background:#fff;color:#000;padding:var(--mg);box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;flex-shrink:0;font-family:'Battambang',sans-serif;font-size:calc(13.5px * var(--fs));position:relative}
.moul{font-family:'Moul',serif;font-weight:400}
.kingdom{text-align:center;font-size:1.185em;line-height:1.8}
.motto{text-align:center;font-size:.96em;line-height:1.8}
.divider{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 6px}
.divider span{width:60px;height:1px;background:#000}
.hdr-left{font-size:.96em;line-height:1.7;margin-top:6px}
.title{text-align:center;font-size:1.56em;margin:8px 0 .6em;line-height:1.7}
table.inv{width:100%;border-collapse:collapse;table-layout:fixed}
table.inv th,table.inv td{border:1px solid #000;padding:.35em .4em;text-align:center;height:var(--rowh);word-break:break-word}
table.inv th{background:#eef2ff;font-weight:700;height:auto}
table.inv td.nm{text-align:left;padding-left:.7em}
[contenteditable="true"]{cursor:text}
td.no{position:relative}
.rm{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:16px;height:16px;line-height:14px;padding:0;border:none;border-radius:50%;background:#fee2e2;color:#dc2626;font-size:13px;cursor:pointer;opacity:.5}
.rm:hover{opacity:1}
td.nm:empty::before{content:'ឈ្មោះសម្ភារៈ...';color:#9ca3af}
[contenteditable="true"]:focus{outline:2px solid #0891b2;outline-offset:-2px;background:#f0fdff}
.foot{display:flex;justify-content:space-between;align-items:flex-start;margin-top:1em}
.sig-l{text-align:center;min-width:14em;line-height:1.8;margin-top:1.8em}
.sig-r{text-align:center;min-width:22em;line-height:1.8}
.sig-r .role{color:#1d4ed8}
.sig-space{height:4.7em}
.sig-name{color:#1d4ed8;font-family:'Moul',serif;font-size:.96em}

@media screen and (max-width:768px){.fc,.btn,.date-btn{height:30px;font-size:11.5px;padding:3px 6px}.toolbar{padding:8px 10px;position:static}
  .row>*{min-width:0}.pill{max-width:100%}.cs-btn{min-width:110px}}

@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important;overflow:visible!important}
  .toolbar,.auth-wrapper,.toast,.pop,.rm{display:none!important}
  td.nm:empty::before{content:none!important}
  .sheet-wrap{zoom:1!important;transform:none!important;display:block!important}
  .sheet{box-shadow:none!important;margin:0!important;break-after:avoid;page-break-after:avoid}
  .sheet,.sheet *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
i.fa-solid,i.fa-regular,.fa-solid,.fa-regular{font-family:'Font Awesome 6 Free'!important}
i.fa-solid,.fa-solid{font-weight:900}i.fa-regular,.fa-regular{font-weight:400}
</style>
<style id="pageStyle">@page{size:210mm 297mm;margin:0}</style>

<body>

<div class="auth-wrapper" id="authDenied">
  <div class="auth-card">
    <div style="font-size:42px;margin-bottom:10px">🔒</div>
    <h2>សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
    <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។</p>
    <a href="index.html" target="_top" class="btn btn-login" onclick="goToIndex(event)">🔑 ទៅកាន់ទំព័រដើម (Login)</a>
  </div>
</div>

<div class="toolbar" id="toolbar">
  <div class="row">
    <button class="btn" onclick="goBack()" title="ត្រឡប់ទៅបញ្ជីរបាយការណ៍"><i class="fa-solid fa-arrow-left"></i> ត្រឡប់</button>
    <div class="pill" id="adminClassBox" style="display:none">
      <span class="lbl"><i class="fa-solid fa-graduation-cap" style="color:#0891b2"></i> ថ្នាក់ទី៖</span>
      <select id="selectClass" class="fc" onchange="loadData()"><option value="">កំពុងទាញយក...</option></select>
    </div>
    <button class="btn btn-primary" onclick="addItem()" title="បន្ថែមសម្ភារៈថ្មី"><i class="fa-solid fa-plus"></i> បន្ថែមសម្ភារៈ</button>
    <button class="btn btn-green" onclick="downloadExcel()"><i class="fa-solid fa-file-excel"></i> ទាញយក Excel</button>
    <button class="btn" onclick="downloadPdf()"><i class="fa-solid fa-download"></i> ទាញយក PDF</button>
    <button class="btn btn-primary" onclick="doPrint()"><i class="fa-solid fa-print"></i> បោះពុម្ព</button>
  </div>

  <div class="row">
    <div class="pill">
      <span class="lbl"><i class="fa-solid fa-signature" style="color:#e11d48"></i> គ្រូ៖</span>
      <input type="hidden" id="inTeacherDate">
      <button type="button" class="date-btn" id="btn_inTeacherDate" data-ph="ជ្រើសថ្ងៃ" onclick="openDatePicker(event,'inTeacherDate',true)" title="ថ្ងៃខែហត្ថលេខារបស់គ្រូ"><i class="fa-regular fa-calendar"></i><span></span></button>
    </div>
    <div class="pill">
      <span class="lbl"><i class="fa-solid fa-signature" style="color:#7c3aed"></i> នាយក៖</span>
      <input type="hidden" id="inDirectorDate">
      <button type="button" class="date-btn" id="btn_inDirectorDate" data-ph="មិនដាក់" onclick="openDatePicker(event,'inDirectorDate',true)" title="ថ្ងៃខែហត្ថលេខារបស់នាយក"><i class="fa-regular fa-calendar"></i><span></span></button>
    </div>
    <button class="btn" id="btnPage" onclick="togglePagePanel(event)"><i class="fa-solid fa-sliders"></i> កំណត់ទំព័រ</button>
  </div>
</div>

<div class="pop" id="dpPop"></div>
<div class="pop" id="selPop"></div>

<div class="pop" id="pgPop">
  <div id="pgDyn"></div>
  <div class="pg-info">
    <div class="pg-sec" style="margin-top:4px"><i class="fa-solid fa-pen-to-square"></i><span>ព័ត៌មានរបាយការណ៍</span><hr></div>
    <label>ការិយាល័យ</label><input id="inOffice" class="fc" value="ការិយាល័យអប់រំ យុវជន និងកីឡា" oninput="render()">
    <label>សាលារៀន</label><input id="inSchool" class="fc" value="សាលាបឋមសិក្សាកំពង់ល្ពៅ" oninput="render()">
    <label>ទីកន្លែង</label><input id="inPlace" class="fc" value="កំពង់ល្ពៅ" oninput="render()">
    <label>បញ្ជីសម្ភារៈ (មួយបន្ទាត់ = មួយមុខ ទម្រង់៖ ឈ្មោះ | ចំនួន)</label>
    <textarea id="inItems" class="fc" rows="9" oninput="itemsFromText()"></textarea>
    <a class="link" onclick="resetItems()"><i class="fa-solid fa-rotate-left"></i> ត្រឡប់ទៅបញ្ជីលំនាំដើម</a>
  </div>
</div>

<div class="sheet-wrap" id="sheetWrap" style="display:none">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

    let cls=[...new Set((data||[]).map(d=>cleanGrade(d.grade)).filter(Boolean))].sort();
    if(!cls.length)cls=['១','២','៣','៤','៥','៦'];
    sel.innerHTML=cls.map(c=>`<option value="${esc(c)}">ថ្នាក់ទី ${esc(c)}</option>`).join('');
    sel.value=(mine&&cls.includes(mine))?mine:cls[0]; enhanceSelect('selectClass'); loadData();
  }catch(e){sel.innerHTML='<option value="">កំហុសទាញយកថ្នាក់</option>'}
}
async function loadData(){
  CUR_CLASS=document.getElementById('selectClass').value||cleanGrade(USER_CLASS);
  if(!CUR_CLASS)return;
  loadInv(); TEACHER=await fetchTeacher(CUR_CLASS); render();
}

/* ===== បង្កើតរបាយការណ៍ ===== */
function render(){
  if(!CUR_CLASS)return;
  const office=esc(document.getElementById('inOffice').value);
  const school=esc(document.getElementById('inSchool').value);
  const place=esc(document.getElementById('inPlace').value);
  const tVal=document.getElementById('inTeacherDate').value, tBlank=tVal==='blank';
  const tIso=(tVal&&!tBlank)?tVal:isoLocal(new Date());
  const dIso=document.getElementById('inDirectorDate').value;

  const n=INV.length, half=Math.ceil(n/2);
  const cell=(i)=>{
    if(i>=n)return '<td></td><td class="nm"></td><td></td>';
    const it=INV[i];
    return `<td class="no">${toKh(i+1)}<button type="button" class="rm" title="លុបមុខនេះ" onclick="removeItem(${i})">×</button></td>
      <td class="nm" contenteditable="true" data-i="${i}" data-f="name" oninput="invEdit(this)">${esc(it.name)}</td>
      <td contenteditable="true" data-i="${i}" data-f="qty" oninput="invEdit(this)">${esc(it.qty)}</td>`;
  };
  let rows='';
  for(let r=0;r<half;r++)rows+=`<tr>${cell(r)}${cell(half+r)}</tr>`;

  document.getElementById('sheet').innerHTML=`
    <div class="kingdom moul">ព្រះរាជាណាចក្រកម្ពុជា</div>
    <div class="motto moul">ជាតិ សាសនា ព្រះមហាក្សត្រ</div>
    <div class="divider"><span></span><b>❖</b><span></span></div>
    <div class="hdr-left moul">${office}<br>${school}<br>ថ្នាក់ទី${esc(CUR_CLASS)}</div>
    <div class="title moul">បញ្ជីសារពើភ័ណ្ឌ</div>
    <table class="inv" id="invTable">
      <colgroup><col style="width:8%"><col style="width:30%"><col style="width:12%"><col style="width:8%"><col style="width:30%"><col style="width:12%"></colgroup>
      <thead><tr><th>ល.រ</th><th>ឈ្មោះសម្ភារៈ</th><th>ចំនួនឯកតា</th><th>ល.រ</th><th>ឈ្មោះសម្ភារៈ</th><th>ចំនួនឯកតា</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="foot">
      <div class="sig-l">
        ${dIso?`<div style="font-size:.93em">${lunarOfIso(dIso)}</div><div>${fmtKhDate(dIso)}</div><div>បានឃើញ និងឯកភាព</div>`:`<div>&nbsp;</div><div>&nbsp;</div><div>បានឃើញ និងឯកភាព</div>`}
        <div class="moul" style="font-size:.96em">នាយកសាលា</div>
        <div class="sig-space"></div>
      </div>
      <div class="sig-r">
        ${tBlank?`<div style="font-size:.93em">ថ្ងៃ.................... ខែ.......... ឆ្នាំ........... ពុទ្ធសករាជ ${toKh(((lunarOfIso(tIso).match(/ពុទ្ធសករាជ\s*(\S+)/)||[])[1])||'')}</div><div>${place}, ថ្ងៃទី...... ខែ...... ឆ្នាំ${toKh(tIso.slice(0,4))}</div>`:`<div style="font-size:.93em">${lunarOfIso(tIso)}</div><div>${place}, ${fmtKhDate(tIso)}</div>`}
        <div class="role moul" style="font-size:.96em">គ្រូទទួលបន្ទុកថ្នាក់</div>
        <div class="sig-space"></div>
        <div class="sig-name">${esc(TEACHER)}</div>
      </div>
    </div>`;
}

/* ===== Print / PDF / Excel ===== */
function doPrint(){closePops();document.activeElement?.blur();window.focus();setTimeout(()=>{try{window.print()}catch(e){window.parent.print()}},100)}

async function downloadPdf(){
  const el=document.getElementById('sheet');
  if(!el||!el.querySelector('#invTable')){toast('មិនទាន់មានទិន្នន័យសម្រាប់បង្កើត PDF');return}
  if(!window.html2canvas||!window.jspdf){toast('មិនអាចផ្ទុក library PDF បានទេ សូមពិនិត្យអ៊ីនធឺណិត');return}
  toast('កំពុងបង្កើត PDF...');
  try{
    document.activeElement?.blur();
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,
      onclone:doc=>{const w=doc.getElementById('sheetWrap');if(w){w.style.zoom=1;w.style.transform='none'}const sh=doc.getElementById('sheet');if(sh)sh.style.boxShadow='none';doc.querySelectorAll('.rm').forEach(b=>b.remove());const st=doc.createElement('style');st.textContent='td.nm:empty::before{content:none!important}';doc.head.appendChild(st)}});
    const [pw,ph]=pageDims(), {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:pw>ph?'landscape':'portrait',unit:'mm',format:[Math.min(pw,ph),Math.max(pw,ph)]});
    pdf.addImage(canvas.toDataURL('image/jpeg',0.98),'JPEG',0,0,pw,ph);
    pdf.save('class-inventory-'+(CUR_CLASS||'')+'.pdf');
    toast('បានទាញយក PDF រួចរាល់');
  }catch(err){toast('កំហុសបង្កើត PDF៖ '+err.message)}
}

function downloadExcel(){
  if(!INV.length)return;
  const half=Math.ceil(INV.length/2), c=i=>i<INV.length?`<td>${toKh(i+1)}</td><td>${esc(INV[i].name)}</td><td>${esc(INV[i].qty)}</td>`:'<td></td><td></td><td></td>';
  let rows=''; for(let r=0;r<half;r++)rows+=`<tr>${c(r)}${c(half+r)}</tr>`;
  const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><h3>បញ្ជីសារពើភ័ណ្ឌ ថ្នាក់ទី${esc(CUR_CLASS)}</h3><table border="1"><tr><th>ល.រ</th><th>ឈ្មោះសម្ភារៈ</th><th>ចំនួនឯកតា</th><th>ល.រ</th><th>ឈ្មោះសម្ភារៈ</th><th>ចំនួនឯកតា</th></tr>${rows}</table></body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='class-inventory-'+(CUR_CLASS||'')+'.xls'; document.body.appendChild(a); a.click(); a.remove();
}

window.addEventListener('DOMContentLoaded',async()=>{
  if(!USER||!USER.username){document.getElementById('authDenied').style.display='flex';return}
  document.getElementById('toolbar').style.display='flex';
  document.getElementById('sheetWrap').style.display='flex';
  const dts=loadDates(); setDateValue('inTeacherDate',dts.t); setDateValue('inDirectorDate',dts.d);
  applyPage();
  await initClasses();
});
