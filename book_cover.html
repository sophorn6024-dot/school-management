<style>
:root{--bg:#0b1220;--card:#131c2e;--bd:rgba(255,255,255,.12);--tx:#e8eefc;--mut:#9fb0d0;--primary:#3b82f6;--in:#0f1727}
[data-theme="light"]{--bg:#eef2f8;--card:#fff;--bd:#d9e1ee;--tx:#14213d;--mut:#5b6b88;--in:#f6f8fc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Battambang','Khmer OS Battambang',sans-serif}
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{font-size:16px;margin:0 6px 0 0;font-family:'Moul','Battambang',serif;font-weight:400}
.btn{border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:8px 14px;font:700 13px 'Battambang',sans-serif;cursor:pointer}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn:active{transform:scale(.97)}
.panel{max-width:1100px;margin:14px auto;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--mut);font-weight:700}
.f input,.f select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:700 14px 'Battambang',sans-serif;width:100%}
.f.wide{grid-column:1/-1}
.hint{max-width:1100px;margin:0 auto;padding:0 14px;font-size:12px;color:var(--mut)}
#stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 10px 40px}
.slot{position:relative;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.35);background:#fff}
.slot .scale{transform-origin:top left;position:absolute;left:0;top:0}

let CLS=[];
function gradeKh(c){c=String(c||'').replace(/^ថ្នាក់ទី\s*/,'').trim();return c?'ថ្នាក់ទី'+toKh(c):''}
function fillForm(){
  const sel=$('fTitle');
  sel.innerHTML=TITLES.map((t,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(t)+'</option>').join('')+'<option value="c">✎ ចំណងជើងផ្សេង…</option>';
  sel.value=ST.title!=null?ST.title:'0';
  $('fCustom').value=ST.custom||'';
    $('fPaper').value=ST.paper||'a5';
  $('fFrame').value=ST.frame||'g';
  $('fCustomWrap').style.display=sel.value==='c'?'':'none';
}
function save(){
  ST={title:$('fTitle').value,custom:$('fCustom').value,paper:$('fPaper').value,frame:$('fFrame').value,cls:ST.cls};
  try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}
  render();
}
function onTitle(){$('fCustomWrap').style.display=$('fTitle').value==='c'?'':'none';save()}
function onCls(){ST.cls=$('fCls').value;pickCls();save()}
function pickCls(){
  const r=CLS.find(x=>String(x.id)===String($('fCls').value))||CLS[0];
  if(r){D.grade=gradeKh(r.name);D.year=toKh(r.school_year||'').replace(/\s*[-~–]\s*/g,' ~ ')}
}


const FR={g:['#0b6b3a','#c9a227'],b:['#1f4e9c','#c9a227'],r:['#9b1c1c','#c9a227'],p:['#5b2a86','#c9a227']};
function flower(x,y,s,c1,c2){
  let p='';for(let i=0;i<8;i++)p+='<ellipse cx="0" cy="-2.6" rx="1.15" ry="2.5" transform="rotate('+(i*45)+')" fill="'+c2+'" stroke="'+c1+'" stroke-width=".3"/>';
  return '<g transform="translate('+x+' '+y+') scale('+s+')"><circle r="5.2" fill="#fff"/>'+p+'<circle r="1.5" fill="'+c1+'"/><circle r=".6" fill="#fff"/></g>';
}
function frameSvg(k){
  const [c1,c2]=FR[k]||FR.g;
  let s='<svg class="frm" viewBox="0 0 148 210" xmlns="http://www.w3.org/2000/svg">'
   +'<rect x="5" y="5" width="138" height="200" rx="3" fill="none" stroke="'+c1+'" stroke-width="2.4"/>'
   +'<rect x="8.2" y="8.2" width="131.6" height="193.6" rx="1.5" fill="none" stroke="'+c2+'" stroke-width=".7"/>'
   +'<rect x="10" y="10" width="128" height="190" fill="none" stroke="'+c1+'" stroke-width=".35"/>';
  const dia=(x,y)=>'<path d="M'+x+' '+(y-1.1)+'l1.1 1.1l-1.1 1.1l-1.1-1.1z" fill="'+c2+'" stroke="'+c1+'" stroke-width=".2"/>';
  for(let x=22;x<=126;x+=6){s+=dia(x,6.6)+dia(x,203.4)}
  for(let y=22;y<=188;y+=6){s+=dia(6.6,y)+dia(141.4,y)}
  s+=flower(13,13,1,c1,c2)+flower(135,13,1,c1,c2)+flower(13,197,1,c1,c2)+flower(135,197,1,c1,c2);
  s+=flower(74,6.6,.62,c1,c2)+flower(74,203.4,.62,c1,c2)+flower(6.6,105,.62,c1,c2)+flower(141.4,105,.62,c1,c2);
  return s+'</svg>';
}
function fitAll(root){
  root.querySelectorAll('.mid>div,.grade,.hd .l').forEach(el=>{
    el.style.fontSize='';
    const box=el.classList.contains('l')?el.parentElement:el.parentElement;
    let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    const lim=el.classList.contains('l')?el.clientWidth:el.parentElement.clientWidth;
    while(el.scrollWidth>lim+1&&fs>8&&n++<60){fs*=.96;el.style.fontSize=fs+'px'}
  });
}
/* ===== សន្លឹក ===== */
function coverHtml(title){
  const v=id=>$(id).value.trim();
  const head=D.head.map(esc).join('<br>');
  const phone=D.phone;
  const fr=$('fFrame').value;
  return '<div class="cover'+(fr==='o'?' orig':'')+'">'+(fr==='o'?'':frameSvg(fr))+'<img class="emb" alt="" src="'+WM+'"><div class="in">'
   +'<div class="hd"><div class="l">'+head+'</div><div class="r">ព្រះរាជាណាចក្រកម្ពុជា<br>ជាតិ សាសនា ព្រះមហាក្សត្រ<div class="orn">─────── ❖ ───────</div></div></div>'
   +'<div class="grade">'+esc(D.grade)+'</div>'
   +'<div class="mid"><div class="t1">សៀវភៅ</div><div class="t2">“'+esc(title)+'”</div>'
   +'<div class="t3">ឈ្មោះគ្រូទទួលបន្ទុកថ្នាក់</div><div class="t4">'+esc(D.name)+'</div>'
   +(phone?'<div class="t5">លេខទូរស័ព្ទ '+esc(toKh(phone))+'</div>':'')
   +(D.year?'<div class="t6">ឆ្នាំសិក្សា '+esc(D.year)+'</div>':'')
   +'</div></div></div>';
}
function curTitle(){const s=$('fTitle').value;return s==='c'?($('fCustom').value.trim()||'…'):TITLES[+s]}
function paperHtml(title){const p=$('fPaper').value;return '<div class="paper '+p+'">'+coverHtml(title)+'</div>'}
function applyPage(){
  const p=$('fPaper').value;
  $('pgStyle').textContent='@page{size:'+(p==='a4'?'A4 landscape':'A5 portrait')+';margin:0}';
}
const MM=96/25.4;
function render(){
  applyPage();
  const p=$('fPaper').value,W=(p==='a4'?297:148)*MM,H=210*MM;
  const avail=Math.min(window.innerWidth-20,p==='a4'?900:520),sc=Math.min(1,avail/W);
  $('stage').innerHTML='<div class="slot" style="width:'+W*sc+'px;height:'+H*sc+'px"><div class="scale" style="transform:scale('+sc+')">'+paperHtml(curTitle())+'</div></div>';
  fitAll($('stage'));
}
function doPrint(mode){
  applyPage();
  $('printHost').innerHTML=mode==='all'?TITLES.map(paperHtml).join(''):paperHtml(curTitle());
  const go=()=>{
    const h=$('printHost'),o=h.style.cssText;
    h.style.cssText='display:block;position:absolute;left:-99999px;top:0';
    fitAll(h);h.style.cssText=o;
    window.print();
  };
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(go,150));
}
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(render,120)});

/* ===== ផ្ទុកទិន្នន័យសាលា/គ្រូ ===== */
async function loadProf(){
  D.name=(USER&&(USER.teacher_name||USER.full_name||USER.name))||'';
  D.phone=(USER&&USER.phone)||'';
  D.head=schoolHeadLines(null);
  D.grade=gradeKh(String((USER&&(USER.assigned_classes||USER.assigned_class))||'').split(/[,;،]/)[0]);
  render();
  try{
    let pw='';try{pw=localStorage.getItem('krou_pw')||''}catch(e){}
    if(!sb||!USER||!USER.username||!pw)return;
    const a={p_u:USER.username,p_p:pw};
    const [pr,sc,cl]=await Promise.all([sb.rpc('staff_my_profile_get',a),sb.rpc('staff_school_get',a),sb.rpc('staff_class_list',a)]);
    const p=pr&&pr.data;
    if(p&&typeof p==='object'){
      if(p.teacher_name||p.full_name)D.name=p.teacher_name||p.full_name;
      if(p.phone)D.phone=p.phone;
    }
    const sd=sc&&sc.data;
    if(sd&&sd.ok){PROF=sd.data||{};D.head=schoolHeadLines(PROF)}
    const cd=cl&&cl.data;
    if(cd&&!cd.error&&Array.isArray(cd.rows)&&cd.rows.length){
      CLS=cd.rows;
      const act=String(cd.active||'').replace(/^ថ្នាក់ទី\s*/,'').trim().toLowerCase();
      const def=CLS.find(r=>String(r.name).replace(/^ថ្នាក់ទី\s*/,'').trim().toLowerCase()===act)||CLS[0];
      const sel=$('fCls');
      sel.innerHTML=CLS.map(r=>'<option value="'+esc(r.id)+'">'+esc(gradeKh(r.name))+' · '+esc(toKh(r.school_year||''))+'</option>').join('');
      sel.value=String((ST.cls&&CLS.some(r=>String(r.id)===String(ST.cls)))?ST.cls:def.id);
      $('fClsWrap').style.display=CLS.length>1?'':'none';
      pickCls();
    }
    render();
  }catch(e){console.warn('prof',e)}
}
window.addEventListener('DOMContentLoaded',()=>{
  if(!USER||!USER.username){$('authDenied').style.display='flex';return}
  fillForm();render();
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'VIEW_READY'},'*')}catch(e){}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
  loadProf();
});
</script>
