<style>
:root{--bg:#0b1220;--card:#131c2e;--bd:rgba(255,255,255,.12);--tx:#e8eefc;--mut:#9fb0d0;--primary:#3b82f6;--in:#0f1727}
[data-theme="light"]{--bg:#eef2f8;--card:#fff;--bd:#d9e1ee;--tx:#14213d;--mut:#5b6b88;--in:#f6f8fc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:'Battambang','Khmer OS Battambang',sans-serif}
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{font-size:16px;margin:0 6px 0 0;font-family:'Moul','Battambang',serif;font-weight:400}
.btn{border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:8px 14px;font:700 13px 'Battambang',sans-serif;cursor:pointer}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn:active{transform:scale(.97)}
.panel{max-width:1100px;margin:14px auto;padding:0 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--mut);font-weight:700}
.f input,.f select{background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:700 14px 'Battambang',sans-serif;width:100%}
.f.wide{grid-column:1/-1}
.hint{max-width:1100px;margin:0 auto;padding:0 14px;font-size:12px;color:var(--mut)}
#stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 10px 40px}
.slot{position:relative;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.35);background:#fff}
.slot .scale{transform-origin:top left;position:absolute;left:0;top:0}

.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3.2mm;padding-bottom:6mm}
.t1{font:400 15mm/1.25 'Moul','Battambang',serif;color:#4472c4;text-shadow:.5mm .5mm .8mm rgba(0,0,0,.35)}
.t2{font:400 9mm/1.35 'Moul','Battambang',serif;color:#c55a11;text-shadow:.4mm .4mm .7mm rgba(0,0,0,.3)}
.t3{font:400 6.6mm/1.4 'Moul','Battambang',serif;color:#70ad47;text-shadow:.4mm .4mm .7mm rgba(0,0,0,.3)}
.t4{font:400 9mm/1.4 'Moul','Battambang',serif;color:#2f5ec4;text-shadow:.4mm .4mm .7mm rgba(0,0,0,.3)}
.t5{font:400 6.8mm/1.4 'Moul','Battambang',serif;color:#843c0c;text-shadow:.4mm .4mm .7mm rgba(0,0,0,.3)}
.t6{font:400 6.4mm/1.4 'Moul','Battambang',serif;color:#7030a0;text-shadow:.4mm .4mm .7mm rgba(0,0,0,.3)}
.mid>div:empty{display:none}
.mid>div{white-space:nowrap;max-width:100%}
#printHost{display:none}
@media (max-width:600px){.bar h1{width:100%}}
@media print{
  html,body{background:#fff!important}
  .bar,.panel,.hint,#cfm,#stage,#authDenied,#toast{display:none!important}
  #printHost{display:block!important}
  #printHost .paper{break-after:page;page-break-after:always;margin:0}
  #printHost .paper:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#authDenied{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:var(--bg);font-weight:700;z-index:99}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;display:none;z-index:50}
</style>
<style id="pgStyle">@page{size:A5 portrait;margin:0}</style>
</head>
<body>
<div id="authDenied">សូមចូលប្រព័ន្ធជាមុន</div>
<div class="bar" id="bar">
  <h1>ក្របសៀវភៅ</h1>
  <button class="btn" onclick="goBack()">← ត្រឡប់</button>
  <button class="btn pri" onclick="doPrint('one')">🖨 ព្រីនក្របនេះ</button>
  <button class="btn" onclick="doPrint('all')">🖨 ព្រីនទាំងអស់</button>
</div>
<div class="panel">
  <div class="f wide"><label>ប្រភេទសៀវភៅ</label><select id="fTitle" onchange="onTitle()"></select></div>
  <div class="f wide" id="addRow"><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="btnAdd" onclick="showAdd(true)">＋ បន្ថែមឈ្មោះសៀវភៅ</button><button type="button" class="btn" id="btnDel" style="display:none;color:#f87171" onclick="delBook()">🗑 លុបឈ្មោះនេះ</button></div>
    <div id="addBox" style="display:none;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="fNew" placeholder="វាយឈ្មោះសៀវភៅ ឧ. ប្រជុំគណៈគ្រប់គ្រង" style="flex:1;min-width:200px;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:700 14px 'Battambang',sans-serif" onkeydown="if(event.key==='Enter')addBook()"><button type="button" class="btn pri" onclick="addBook()">បន្ថែម</button><button type="button" class="btn" onclick="showAdd(false)">បោះបង់</button></div></div>
  <div class="f" id="fClsWrap" style="display:none"><label>ថ្នាក់</label><select id="fCls" onchange="onCls()"></select></div>
  <div class="f"><label>ស៊ុម</label><select id="fFrame" onchange="save()"><option value="g">ស៊ុមបៃតង-មាស (ថ្មី)</option><option value="b">ស៊ុមខៀវ-មាស</option><option value="r">ស៊ុមក្រហម-មាស</option><option value="p">ស៊ុមស្វាយ-មាស</option><option value="i1">ស៊ុមវល្លិ៍បៃតង</option><option value="i2">ស៊ុមផ្កាស្វាយ</option><option value="i3">ស៊ុមមាសក្រហម</option><option value="o">ស៊ុមដើម (ពី PDF)</option></select></div>
  <div class="f"><label>ទំហំក្រដាស</label><select id="fPaper" onchange="save()"><option value="a5">A5 បញ្ឈរ (ក្របតែមួយ)</option><option value="a4">A4 ផ្ដេក (ក្របនៅខាងស្តាំ)</option></select></div>
</div>
<div id="stage"></div>
<div id="printHost"></div>
<div id="cfm" style="display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px"><div style="background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)"><div style="font-weight:700;font-size:15px;margin-bottom:6px">🗑 លុបឈ្មោះសៀវភៅ</div><div id="cfmMsg" style="font-size:14px;color:var(--mut);line-height:1.6;margin-bottom:16px"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="cfmClose()">បោះបង់</button><button class="btn" id="cfmOk" style="background:#dc2626;border-color:#dc2626;color:#fff">លុប</button></div></div></div>
<div id="toast"></div>

const FR={g:['#0b6b3a','#c9a227'],b:['#1f4e9c','#c9a227'],r:['#9b1c1c','#c9a227'],p:['#5b2a86','#c9a227']};
function flower(x,y,s,c1,c2){
  let p='';for(let i=0;i<8;i++)p+='<ellipse cx="0" cy="-2.6" rx="1.15" ry="2.5" transform="rotate('+(i*45)+')" fill="'+c2+'" stroke="'+c1+'" stroke-width=".3"/>';
  return '<g transform="translate('+x+' '+y+') scale('+s+')"><circle r="5.2" fill="#fff"/>'+p+'<circle r="1.5" fill="'+c1+'"/><circle r=".6" fill="#fff"/></g>';
}
function frameSvg(k){
  const [c1,c2]=FR[k]||FR.g;
  let s='<svg class="frm" viewBox="0 0 148 210" xmlns="http://www.w3.org/2000/svg">'
   +'<rect x="5" y="5" width="138" height="200" rx="3" fill="none" stroke="'+c1+'" stroke-width="2.4"/>'
   +'<rect x="8.2" y="8.2" width="131.6" height="193.6" rx="1.5" fill="none" stroke="'+c2+'" stroke-width=".7"/>'
   +'<rect x="10" y="10" width="128" height="190" fill="none" stroke="'+c1+'" stroke-width=".35"/>';
  const dia=(x,y)=>'<path d="M'+x+' '+(y-1.1)+'l1.1 1.1l-1.1 1.1l-1.1-1.1z" fill="'+c2+'" stroke="'+c1+'" stroke-width=".2"/>';
  for(let x=22;x<=126;x+=6){s+=dia(x,6.6)+dia(x,203.4)}
  for(let y=22;y<=188;y+=6){s+=dia(6.6,y)+dia(141.4,y)}
  s+=flower(13,13,1,c1,c2)+flower(135,13,1,c1,c2)+flower(13,197,1,c1,c2)+flower(135,197,1,c1,c2);
  s+=flower(74,6.6,.62,c1,c2)+flower(74,203.4,.62,c1,c2)+flower(6.6,105,.62,c1,c2)+flower(141.4,105,.62,c1,c2);
  return s+'</svg>';
}
function fitAll(root){
  root.querySelectorAll('.mid>div,.grade,.hd .l').forEach(el=>{
    el.style.fontSize='';
    const box=el.classList.contains('l')?el.parentElement:el.parentElement;
    let fs=parseFloat(getComputedStyle(el).fontSize),n=0;
    const lim=el.classList.contains('l')?el.clientWidth:el.parentElement.clientWidth;
    while(el.scrollWidth>lim+1&&fs>8&&n++<60){fs*=.96;el.style.fontSize=fs+'px'}
  });
}

  $('stage').innerHTML='<div class="slot" style="width:'+W*sc+'px;height:'+H*sc+'px"><div class="scale" style="transform:scale('+sc+')">'+paperHtml(curTitle())+'</div></div>';
  fitAll($('stage'));
}
function doPrint(mode){
  applyPage();
  $('printHost').innerHTML=mode==='all'?allTitles().map(paperHtml).join(''):paperHtml(curTitle());
  const go=()=>{
    const h=$('printHost'),o=h.style.cssText;
    h.style.cssText='display:block;position:absolute;left:-99999px;top:0';
    fitAll(h);h.style.cssText=o;
    window.print();
  };
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(go,150));
}
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(render,120)});

/* ===== ផ្ទុកទិន្នន័យសាលា/គ្រូ ===== */
async function loadProf(){
  D.name=(USER&&(USER.teacher_name||USER.full_name||USER.name))||'';
  D.phone=(USER&&USER.phone)||'';
  D.head=schoolHeadLines(null);
  D.grade=gradeKh(String((USER&&(USER.assigned_classes||USER.assigned_class))||'').split(/[,;،]/)[0]);
  render();
  try{
    let pw='';try{pw=localStorage.getItem('krou_pw')||''}catch(e){}
    if(!sb||!USER||!USER.username||!pw)return;
    const a={p_u:USER.username,p_p:pw};
    const [pr,sc,cl]=await Promise.all([sb.rpc('staff_my_profile_get',a),sb.rpc('staff_school_get',a),sb.rpc('staff_class_list',a)]);
    const p=pr&&pr.data;
    if(p&&typeof p==='object'){
      if(p.teacher_name||p.full_name)D.name=p.teacher_name||p.full_name;
      if(p.phone)D.phone=p.phone;
    }
    const sd=sc&&sc.data;
    if(sd&&sd.ok){PROF=sd.data||{};D.head=schoolHeadLines(PROF)}
    const cd=cl&&cl.data;
    if(cd&&!cd.error&&Array.isArray(cd.rows)&&cd.rows.length){
      CLS=cd.rows;
      const act=String(cd.active||'').replace(/^ថ្នាក់ទី\s*/,'').trim().toLowerCase();
      const def=CLS.find(r=>String(r.name).replace(/^ថ្នាក់ទី\s*/,'').trim().toLowerCase()===act)||CLS[0];
      const sel=$('fCls');
      sel.innerHTML=CLS.map(r=>'<option value="'+esc(r.id)+'">'+esc(gradeKh(r.name))+' · '+esc(toKh(r.school_year||''))+'</option>').join('');
      sel.value=String((ST.cls&&CLS.some(r=>String(r.id)===String(ST.cls)))?ST.cls:def.id);
      $('fClsWrap').style.display=CLS.length>1?'':'none';
      pickCls();
    }
    render();
  }catch(e){console.warn('prof',e)}
}
window.addEventListener('DOMContentLoaded',()=>{
  if(!USER||!USER.username){$('authDenied').style.display='flex';return}
  fillForm();render();
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'VIEW_READY'},'*')}catch(e){}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
  loadProf();
});
</script>
<!-- 🔤 AUTO-SELECT : ប្តូរ <select> ធម្មតា ទៅជាបញ្ជីជ្រើសរើស font Battambang (បញ្ជីរបស់ browser មិនប្រើ font ទំព័រ) -->
<style id="asStyle">
.as-wrap{position:relative;display:inline-block;vertical-align:middle;max-width:100%;min-width:0}
.as-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;cursor:pointer;text-align:left;box-sizing:border-box;font-family:'Khmer OS Battambang','Battambang',sans-serif !important;appearance:none;-webkit-appearance:none}
.as-btn .as-lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Khmer OS Battambang','Battambang',sans-serif !important}
.as-btn .as-ch{flex:none;width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-top:6px solid currentColor;opacity:.65;transition:transform .15s}
.as-btn.open .as-ch{transform:rotate(180deg)}
.as-btn:disabled{opacity:.55;cursor:not-allowed}
.as-pop{display:none;position:fixed;z-index:2147483000;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 14px 35px rgba(0,0,0,.35);padding:6px;overflow-y:auto;max-height:300px;box-sizing:border-box}
.as-pop.show{display:block;animation:asIn .14s ease-out}
@keyframes asIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.as-it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:700;color:#1e293b;cursor:pointer;font-family:'Khmer OS Battambang','Battambang',sans-serif !important;line-height:1.35}
.as-it:hover{background:#f1f5f9}
.as-it.on{background:#e0f2fe;color:#0284c7}
.as-it.on::after{content:'✓';font-size:13px}
.as-it.dis{opacity:.4;pointer-events:none}
@media print{.as-pop{display:none !important}}
</style>
<script id="asScript">
(function(){
  var COPY=['width','minWidth','maxWidth','height','minHeight','margin','flex','flexGrow','flexShrink','flexBasis','alignSelf','justifySelf','gridColumn','gridRow','order'];
  var STY=['padding','border','borderRadius','background','backgroundColor','color','fontSize','fontWeight','lineHeight','boxShadow','textAlign'];
  var pops=[],openPop=null;
  function closeAll(){pops.forEach(function(p){p.classList.remove('show')});document.querySelectorAll('.as-btn.open').forEach(function(b){b.classList.remove('open')});openPop=null}
  function skip(sel){
    if(sel._as||sel.multiple||sel.size>1||sel.hasAttribute('data-native')||sel._enh)return true;
    if(sel.closest('.cs-wrap,.as-wrap'))return true;
    if(sel._cs||sel._enh||sel._cdd||sel._custom)return true; /* __asOwn2 */
    if(sel.id&&document.getElementById(sel.id+'Btn'))return true; /* __asBtnFix: ទំព័រមាន custom dropdown ផ្ទាល់ខ្លួន */
    return false;
  }
  function visible(sel){var cs=getComputedStyle(sel);return cs.display!=='none'&&cs.visibility!=='hidden'}
  function enhance(sel){
    var cs=getComputedStyle(sel);
    sel._as=true;
    var wrap=document.createElement('span');wrap.className='as-wrap';
    var disp=cs.display;if(disp==='block'||disp==='flex')wrap.style.display=disp==='flex'?'flex':'block';
    COPY.forEach(function(k){var v=cs[k];if(v&&v!=='auto'&&v!=='normal'&&v!=='none'&&!(k==='margin'&&v==='0px'))wrap.style[k]=v});
    if(cs.position==='absolute'||cs.position==='fixed'){wrap.style.position=cs.position;['top','left','right','bottom'].forEach(function(k){wrap.style[k]=cs[k]})}
    if(cs.width&&/px$/.test(cs.width)&&sel.style.width)wrap.style.width=sel.style.width;
    var btn=document.createElement('button');btn.type='button';btn.className='as-btn';
    STY.forEach(function(k){btn.style[k]=cs[k]});
    if(cs.height&&/px$/.test(cs.height))btn.style.height=cs.height;
    btn.innerHTML='<span class="as-lb"></span><span class="as-ch"></span>';
    sel.parentNode.insertBefore(wrap,sel);wrap.appendChild(btn);wrap.appendChild(sel);
    sel.style.display='none';
    var lb=btn.querySelector('.as-lb');
    var pop=document.createElement('div');pop.className='as-pop';document.body.appendChild(pop);pops.push(pop);sel._asWrap=wrap;sel._asPop=pop;
    var dV=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value'),dI=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'selectedIndex');
    function sync(){var o=sel.options[sel.selectedIndex];lb.textContent=o?o.textContent:'';btn.disabled=!!sel.disabled;
      wrap.style.display=wrap.style.display; }
    try{
      Object.defineProperty(sel,'value',{configurable:true,get:function(){return dV.get.call(sel)},set:function(v){dV.set.call(sel,v);sync()}});
      Object.defineProperty(sel,'selectedIndex',{configurable:true,get:function(){return dI.get.call(sel)},set:function(v){dI.set.call(sel,v);sync()}});
    }catch(e){}
    new MutationObserver(sync).observe(sel,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['disabled','selected']});
    sel.addEventListener('change',sync);
    sync();
    function render(){
      pop.innerHTML='';
      Array.prototype.forEach.call(sel.options,function(o,i){
        if(o.hidden)return;
        var it=document.createElement('div');it.className='as-it'+(i===sel.selectedIndex?' on':'')+(o.disabled?' dis':'');
        var sp=document.createElement('span');sp.textContent=o.textContent;it.appendChild(sp);
        it.addEventListener('click',function(e){e.stopPropagation();var ch=(i!==sel.selectedIndex);dI.set.call(sel,i);sync();closeAll();if(ch){sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))}});
        pop.appendChild(it);
      });
    }
    btn.addEventListener('click',function(e){
      e.stopPropagation();e.preventDefault();
      if(pop.classList.contains('show')){closeAll();return}
      closeAll();render();
      var r=btn.getBoundingClientRect(),vh=window.innerHeight,vw=window.innerWidth;
      pop.style.minWidth=Math.max(r.width,150)+'px';
      pop.classList.add('show');
      var ph=Math.min(pop.scrollHeight+12,300),below=vh-r.bottom-8,above=r.top-8;
      var top=(below>=ph||below>=above)?r.bottom+4:Math.max(8,r.top-ph-4);
      pop.style.maxHeight=Math.min(300,Math.max(120,(below>=ph||below>=above)?below:above))+'px';
      pop.style.top=top+'px';
      var left=Math.min(Math.max(8,r.left),vw-pop.offsetWidth-8);pop.style.left=left+'px';
      btn.classList.add('open');openPop=pop;
      var on=pop.querySelector('.as-it.on');if(on)pop.scrollTop=on.offsetTop-pop.clientHeight/2+on.offsetHeight/2;
    });
  }
  /* ទំព័រមាន dropdown ផ្ទាល់ខ្លួន (id+'Btn', .custom-dd-btn, .cs-btn) → លុបកំណែស្វ័យប្រវត្តិ កុំឱ្យស្ទួន */
  function hasOther(sel){var w=sel._asWrap,r=w&&w.parentNode;if(!r)return false;
    if(sel.id&&document.getElementById(sel.id+'Btn'))return true;
    return !!r.querySelector('.custom-dd-btn,.cs-btn,.cs-wrap')}
  function dropAs(sel){var w=sel._asWrap;if(w){var b=w.querySelector('.as-btn');if(b)b.remove()}
    if(sel._asPop){sel._asPop.remove();var i=pops.indexOf(sel._asPop);if(i>-1)pops.splice(i,1)}
    try{delete sel.value;delete sel.selectedIndex}catch(e){}
    sel._as=false;sel._enh=true;sel._asPop=null;sel.style.display='none'}
  function scan(){
    document.querySelectorAll('select').forEach(function(x){if(x._as&&((x.id&&document.getElementById(x.id+'Btn'))||x._cs||x._enh||x._cdd||x._custom)){unwrapAs(x);x.style.display='none'}});
    var list=document.querySelectorAll('select');
    for(var i=0;i<list.length;i++){var s=list[i];
      if(s._as&&s._asWrap&&hasOther(s)){try{dropAs(s)}catch(e){}continue}
      if(skip(s))continue;if(!visible(s))continue;try{enhance(s)}catch(e){console.warn('as',e)}}
  }
  document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.as-pop'))closeAll()});
  window.addEventListener('resize',closeAll);window.addEventListener('scroll',function(e){if(openPop&&!(e.target&&e.target.closest&&e.target.closest('.as-pop')))closeAll()},true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
  function boot(){scan();setInterval(scan,1200)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  /* __asHook: ទំព័រដែលមាន enhanceSelect ផ្ទាល់ខ្លួន → ដកកំណែស្វ័យប្រវត្តិចេញ កុំឱ្យមានប្រអប់ស្ទួន */
  function unwrapAs(sel){try{var w=sel._asWrap;if(w&&w.parentNode){var par=w.parentNode;par.insertBefore(sel,w);var ref=w;Array.prototype.slice.call(w.children).forEach(function(c){if(c===sel||c.classList.contains('as-btn'))return;par.insertBefore(c,w)});w.remove()}if(sel._asPop){sel._asPop.remove();var i=pops.indexOf(sel._asPop);if(i>-1)pops.splice(i,1)}
    sel.style.display='';sel._as=false;sel._asWrap=null;sel._asPop=null;try{if(typeof csSync==='function')csSync(sel)}catch(e){}}catch(e){}}
  try{if(typeof window.enhanceSelect==='function'&&!window.enhanceSelect.__asHooked){var _orig=window.enhanceSelect;
    window.enhanceSelect=function(a){var el=typeof a==='string'?document.getElementById(a):a;if(el&&el._as)unwrapAs(el);return _orig.apply(this,arguments)};
    window.enhanceSelect.__asHooked=true}}catch(e){}
  window.__autoSelectScan=scan;
})();
</script>
