<script>
const sb=supabase.createClient("https://nggnuobnrxiqjtcwlvwk.supabase.co","sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML");
let USER=null;try{USER=JSON.parse(localStorage.getItem('krou_supabase_user')||'null')}catch(e){}
const IS_ADMIN=String(USER&&USER.role||'').toLowerCase().trim()==='admin';
const USER_CLASS=(USER&&(USER.assigned_classes||USER.assigned_class))||'';

/* ===== ព័ត៌មានសាលា/ហត្ថលេខា/ត្រា ពីគណនី (ប្រវត្តិរូបរបស់ខ្ញុំ) ===== */
let PROF=null,PROFILE_SIG='',STAMP_META=null;
    /* 🔍 ស្កេនរូបត្រា៖ កាត់គែមទទេ រួចរកខ្សែបន្ទាត់រង្វង់ត្រា (ក្រហម) → {url,x,y,d,w,h}  (ហត្ថលេខា/ឈ្មោះដែលលើសរង្វង់ មិនគិតក្នុងទំហំត្រា) */
    function analyzeStamp(src) {
      return new Promise(res => {
        const im = new Image();
        im.onerror = () => res(null);
        im.onload = () => {
          try {
            const w = im.naturalWidth, h = im.naturalHeight, c = document.createElement('canvas');
            c.width = w; c.height = h; const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0);
            const d = x.getImageData(0, 0, w, h).data;
            const cr = (cx, cy) => { const i = (cy * w + cx) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
            const cs = [cr(0, 0), cr(w - 1, 0), cr(0, h - 1), cr(w - 1, h - 1)];
            const bg = [0, 1, 2, 3].map(k => Math.round(cs.reduce((t, q) => t + q[k], 0) / 4));
            const ink = i => {
              const a = d[i + 3];
              if (bg[3] < 30) return a > 40;
              if (Math.abs(a - bg[3]) > 60) return true;
              return Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]) > 90;
            };
            let x0 = w, y0 = h, x1 = -1, y1 = -1; const all = [], red = [];
            for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
              const i = (yy * w + xx) * 4;
              if (!ink(i)) continue;
              if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy;
              all.push(xx, yy);
              if (d[i] > d[i + 2] + 25 && d[i] > d[i + 1] + 15) red.push(xx, yy);   // ក្រហម (ត្រា + ឈ្មោះ) មិនមែនខៀវ (ហត្ថលេខា)
            }
            if (x1 < 0) return res(null);
            const cw = x1 - x0 + 1, ch = y1 - y0 + 1, o = document.createElement('canvas');
            o.width = cw; o.height = ch; o.getContext('2d').drawImage(c, x0, y0, cw, ch, 0, 0, cw, ch);
            /* ផ្ទៃរូបមិនថ្លា (ស/ប្រផេះ) → ធ្វើឱ្យថ្លា ដើម្បីមិនបាំងអក្សរ */
            if (bg[3] >= 30) {
              const oc = o.getContext('2d', { willReadFrequently: true }), od = oc.getImageData(0, 0, cw, ch), q = od.data;
              for (let i = 0; i < q.length; i += 4) {
                const dist = Math.abs(q[i] - bg[0]) + Math.abs(q[i + 1] - bg[1]) + Math.abs(q[i + 2] - bg[2]);
                if (dist < 40) q[i + 3] = 0; else if (dist < 110) q[i + 3] = Math.round(q[i + 3] * (dist - 40) / 70);
              }
              oc.putImageData(od, 0, 0);
            }
            const url = o.toDataURL('image/png');
            let pts = red.length >= 200 ? red : all;
            const stride = Math.max(2, Math.floor(pts.length / 2 / 5000) * 2); const P = [];
            for (let i = 0; i < pts.length; i += stride) P.push(pts[i] - x0, pts[i + 1] - y0);
            let L = cw, T = ch; for (let i = 0; i < P.length; i += 2) { if (P[i] < L) L = P[i]; if (P[i + 1] < T) T = P[i + 1]; }
            const maxR = Math.min(cw - L, ch - T) / 2, minR = Math.max(20, Math.min(cw, ch) * 0.2);
            let best = null;
            for (let r = Math.floor(minR); r <= maxR; r += 2) {
              const cx = L + r, cy = T + r, tol = Math.max(2.5, r * 0.04), bins = new Uint8Array(72); let cnt = 0;
              for (let i = 0; i < P.length; i += 2) {
                const dx = P[i] - cx, dy = P[i + 1] - cy, dist = Math.sqrt(dx * dx + dy * dy);
                if (Math.abs(dist - r) <= tol) { bins[Math.min(71, Math.floor((Math.atan2(dy, dx) + Math.PI) / (2 * Math.PI) * 72))] = 1; cnt++; }
              }
              let cov = 0; for (let b = 0; b < 72; b++) cov += bins[b]; cov /= 72;
              if (!best || cov > best.cov + 0.02 || (Math.abs(cov - best.cov) <= 0.02 && cnt > best.cnt)) best = { r, cov, cnt };
            }
            if (!best || best.cov < 0.5) return res({ url, x: 0, y: 0, d: Math.min(cw, ch), w: cw, h: ch, fallback: true });
            res({ url, x: L, y: T, d: best.r * 2, w: cw, h: ch });
          } catch (e) { res(null); }
        };
        im.src = src;
      });
    }
    

function schoolHeadLines(d){
  const school=((d&&d.school_name)||'').trim()||'សាលាបឋមសិក្សាកំពង់ល្ពៅ',t=(d&&d.head_type)||'oc';
  const dept=((d&&d.dept)||'').trim(),office=((d&&d.office)||'').trim(),cl=((d&&d.cluster)||'').trim(),L=[];
  if(t==='doc'&&dept)L.push(dept);
  if(t!=='s'&&office)L.push(office);
  if((t==='oc'||t==='doc')&&cl)L.push(cl);
  L.push(school);return L;
}
function kitHasProf(){return !!(PROF&&(PROF.school_name||PROF.office||PROF.cluster||PROF.dept||PROF.head_type))}
function kitPlace(def){return ((PROF&&PROF.sign_place)||'').trim()||def||'កំពង់ល្ពៅ'}
function kitStamp(){
  const m=STAMP_META;if(!m)return '';
  const K=34/m.d,mb=Math.max(0,(m.h-(m.y+m.d))*K);
  return '<div class="kit-stamp" style="margin-bottom:'+mb+'mm"><div class="kit-circle"><img alt="" src="'+m.url+'" style="width:'+(m.w*K)+'mm;left:'+(-m.x*K)+'mm;top:'+(-m.y*K)+'mm"></div></div>';
}
function kitSig(){return PROFILE_SIG?'<img class="kit-sig" alt="" src="'+PROFILE_SIG+'">':''}
function kitDirName(){return STAMP_META?'':(((PROF&&PROF.director_name)||'').trim())}
async function loadKit(done){
  try{
    let pw='';try{pw=localStorage.getItem('krou_pw')||''}catch(e){}
    if(!sb||!USER||!USER.username||!pw)return;
    const a={p_u:USER.username,p_p:pw};
    const [pr,sc]=await Promise.all([sb.rpc('staff_my_profile_get',a),sb.rpc('staff_school_get',a)]);
    PROFILE_SIG=(pr.data&&pr.data.signature_url)||'';
    const sd=sc.data;
    if(sd&&sd.ok){
      PROF=sd.data||{};
      if(sd.stamp_url){
        const m=PROF.stamp_circle&&PROF.stamp_circle.d?Object.assign({},PROF.stamp_circle,{url:sd.stamp_url}):await analyzeStamp(sd.stamp_url);
        if(m)STAMP_META=m;
      }
    }
    if(done)done();
  }catch(e){console.warn('kit',e)}
}

function applyKit(){if(kitHasProf())document.getElementById('kitHead').innerHTML=schoolHeadLines(PROF).map(esc).join('<br>')}
loadKit(applyKit);
const KIND='curriculum';
function cleanGrade(g){return String(g||'').replace(/^(ថ្នាក់ទី|ថ្នាក់)\s*/,'').trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}
applyTheme(new URLSearchParams(location.search).get('theme')||localStorage.getItem('krou_theme_manual')||'dark');
window.addEventListener('message',e=>{if(e.data&&(e.data.type==='THEME_CHANGE'||e.data.theme))applyTheme(e.data.theme||e.data)});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600)}
function uiConfirm(msg,o){o=o||{};return new Promise(res=>{const bg=document.createElement('div');bg.className='dlg-bg';
  bg.innerHTML='<div class="dlg '+(o.danger?'danger':'')+'"><div style="font-size:30px">'+(o.danger?'🗑️':'❓')+'</div><h3>'+esc(o.title||'សូមបញ្ជាក់')+'</h3><p>'+esc(msg)+'</p><div class="acts"><button data-v="0">បដិសេធ</button><button class="pri" data-v="1">'+esc(o.okText||'យល់ព្រម')+'</button></div></div>';
  bg.addEventListener('click',e=>{const b=e.target.closest('button');if(b){bg.remove();res(b.dataset.v==='1')}else if(e.target===bg){bg.remove();res(false)}});document.body.appendChild(bg)})}
function goHub(){try{parent.postMessage({type:'NAVIGATE',page:'classes'},'*')}catch(e){}if(window.parent===window)location.href='classes.html'}
let curClass='',students=[],D={},dirty=false,seq=0;
function setDirty(v){dirty=v;document.getElementById('saveBtn').classList.toggle('dirty',v)}
async function rpc(fn,args){
  let pw='';try{pw=localStorage.getItem('krou_pw')||''}catch(e){}
  if(!USER||!USER.username||!pw)throw new Error('សូមចាកចេញ រួចចូលប្រព័ន្ធឡើងវិញ');
  const {data,error}=await sb.rpc(fn,Object.assign({p_u:USER.username,p_p:pw},args||{}));
  if(error)throw error;
  if(data&&data.error){if(data.error==='auth'){try{localStorage.removeItem('krou_pw')}catch(e){}}throw new Error(data.error==='forbidden'?'គ្មានសិទ្ធិលើថ្នាក់នេះ':data.error==='auth'?'ពាក្យសម្ងាត់មិនត្រឹមត្រូវ សូមចូលប្រព័ន្ធឡើងវិញ':data.error)}
  return data;
}
async function init(){
  if(!USER||!USER.username){document.getElementById('main').style.display='none';document.getElementById('auth').style.display='block';return}
  const sel=document.getElementById('clsSel'),badge=document.getElementById('clsBadge'),mine=cleanGrade(USER_CLASS);
  if(!IS_ADMIN){
    if(!mine){document.getElementById('body').innerHTML='<div class="panel" style="text-align:center;color:var(--warn);font-weight:700">⚠️ អ្នកមិនទាន់មានថ្នាក់ — សូមបង្កើតថ្នាក់ក្នុង «ថ្នាក់ និងសិស្ស» ជាមុន</div>';return}
    badge.textContent='ថ្នាក់ទី '+mine;badge.style.display='inline-block';curClass=mine;await load();return;
  }
  sel.style.display='inline-block';
  try{
    const {data}=await sb.from('students').select('grade');
    const cls=[...new Set((data||[]).map(d=>cleanGrade(d.grade)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'km'));
    sel.innerHTML=cls.map(c=>'<option value="'+esc(c)+'">ថ្នាក់ទី '+esc(c)+'</option>').join('')||'<option value="">គ្មានថ្នាក់</option>';
    if(mine&&cls.includes(mine))sel.value=mine;curClass=sel.value;await load();
  }catch(e){sel.innerHTML='<option value="">កំហុសទាញថ្នាក់</option>'}
}
async function onClass(){
  if(dirty&&!await uiConfirm('មានការកែមិនទាន់រក្សាទុក។ ប្តូរថ្នាក់ហើយបោះបង់?',{okText:'ប្តូរ'})){document.getElementById('clsSel').value=curClass;return}
  curClass=document.getElementById('clsSel').value;await load();
}
async function load(){
  const my=++seq;students=[];D={};setDirty(false);
  document.getElementById('phSub').textContent='ថ្នាក់ទី'+__kc(curClass);
  if(!curClass){draw();return}
  try{
    const {data,error}=await sb.from('students').select('id,student_id,student_name,gender,grade,dob,dropout_semester').order('id',{ascending:true});
    if(error)throw error;if(my!==seq)return;
    students=(data||[]).filter(s=>cleanGrade(s.grade)===curClass).filter(s=>{const d=String(s.dropout_semester||'').trim();return!(d.includes('ឆមាស១')||d.includes('ឆមាសទី១')||d==='១')})
      .map(s=>({id:String((s.student_id&&String(s.student_id).trim())||s.id),name:s.student_name||'គ្មានឈ្មោះ',sex:s.gender||'',dob:s.dob||''}))
      .sort((a,b)=>a.name.localeCompare(b.name,'km'));
  }catch(e){toast('❌ ទាញសិស្សមិនបាន៖ '+e.message)}
  try{const d=await rpc('staff_class_tool_get',{p_class:curClass,p_kind:KIND});D=(d&&d.data)||{}}
  catch(e){D={};toast('⚠️ ទាញទិន្នន័យមិនបាន — ត្រូវ run class_tools.sql ឬ '+e.message)}
  if(my!==seq)return;
  if(typeof afterLoad==='function')afterLoad();
  draw();
}
async function save(){
  if(!curClass)return;
  try{await rpc('staff_class_tool_save',{p_class:curClass,p_kind:KIND,p_data:D});setDirty(false);toast('✅ បានរក្សាទុក')}
  catch(e){toast('❌ រក្សាទុកមិនបាន៖ '+(e.message||e))}
}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const COLS=['sub','chap','les','mon','wk','pg','note'];
function afterLoad(){D.rows=D.rows||[]}
function subs(){return[...new Set((D.rows||[]).map(r=>(r.sub||'').trim()).filter(Boolean))]}
function fillSub(){const s=document.getElementById('fSub'),v=s.value;s.innerHTML='<option value="">គ្រប់មុខវិជ្ជា</option>'+subs().map(x=>'<option>'+esc(x)+'</option>').join('');if(subs().includes(v))s.value=v}
function setC(i,k,v){D.rows[i][k]=v;setDirty(true)}
function setDone(i,v){D.rows[i].done=v;setDirty(true);draw()}
function addRow(){D.rows=D.rows||[];const f=document.getElementById('fSub').value;D.rows.push({sub:f,chap:'',les:'',mon:'',wk:'',pg:'',note:'',done:false});setDirty(true);draw();setTimeout(()=>{const t=document.querySelector('#tb tr:last-child input');t&&t.focus()},30)}
async function delRow(i){if(!await uiConfirm('លុបជួរនេះ?',{danger:true,okText:'លុប'}))return;D.rows.splice(i,1);setDirty(true);draw()}
function draw(){
  fillSub();const f=document.getElementById('fSub').value,rows=D.rows||[];let n=0;
  document.getElementById('tb').innerHTML=rows.map((r,i)=>{if(f&&(r.sub||'')!==f)return'';n++;
    return '<tr class="'+(r.done?'done':'')+'"><td>'+n+'</td>'+COLS.map(k=>'<td class="l"><input class="l" value="'+esc(r[k]||'')+'" oninput="setC('+i+',\''+k+'\',this.value)" onchange="'+(k==='sub'?'fillSub()':'')+'"></td>').join('')
    +'<td class="noprint"><input type="checkbox" style="width:20px;height:20px" '+(r.done?'checked':'')+' onchange="setDone('+i+',this.checked)"></td><td class="noprint"><button class="btn dng" style="height:30px;padding:0 10px" onclick="delRow('+i+')">🗑️</button></td></tr>'}).join('')
    ||'<tr><td colspan="10" style="padding:30px;color:var(--muted)">មិនទាន់មានទិន្នន័យ — ចុច «បន្ថែមជួរ» ឬ «នាំចូល Excel»</td></tr>';
}
function expXl(){if(typeof XLSX==='undefined'){toast('⚠️ បណ្ណាល័យ Excel មិនទាន់ទាញមកទេ');return}
  const a=[['មុខវិជ្ជា','ជំពូក','មេរៀន','ខែ','សប្តាហ៍','ទំព័រ','កំណត់ចំណាំ']].concat((D.rows||[]).map(r=>COLS.map(k=>r[k]||'')));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'បំណែងចែក');XLSX.writeFile(wb,'បំណែងចែកកម្មវិធី_'+curClass+'.xlsx')}
function impXl(inp){const f=inp.files[0];if(!f)return;if(typeof XLSX==='undefined'){toast('⚠️ បណ្ណាល័យ Excel មិនទាន់ទាញមកទេ');inp.value='';return}
  const rd=new FileReader();rd.onload=async e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const j=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const body=j.slice(1).filter(r=>r.some(c=>String(c).trim()));if(!body.length){toast('⚠️ រកមិនឃើញទិន្នន័យ');return}
    const add=body.map(r=>({sub:String(r[0]).trim(),chap:String(r[1]).trim(),les:String(r[2]).trim(),mon:String(r[3]).trim(),wk:String(r[4]).trim(),pg:String(r[5]).trim(),note:String(r[6]||'').trim(),done:false}));
    const rep=(D.rows||[]).length&&await uiConfirm('មានទិន្នន័យរួចហើយ ('+D.rows.length+' ជួរ)។ ជំនួសទាំងអស់ ឬ?\n«យល់ព្រម» = ជំនួស',{okText:'ជំនួស'});
    D.rows=rep?add:(D.rows||[]).concat(add);setDirty(true);draw();toast('✅ នាំចូល '+add.length+' ជួរ')}catch(err){toast('❌ អានឯកសារមិនបាន៖ '+err.message)}};
  rd.readAsArrayBuffer(f);inp.value=''}
init();
</script>
