<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>សៀវភៅតាមដានការសិក្សា</title>
  
  <!-- 🔤 Google Fonts Khmer & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Moul&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ⚡ Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       🎨 DYNAMIC THEME SYSTEM (LIGHT & DARK MODE)
    ========================================================= */
    :root {
      --app-bg: #f8fafc;
      --tb-bg: rgba(255, 255, 255, 0.96);
      --tb-border: #e2e8f0;
      --card-panel-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-focus: #0284c7;
      --ctrl-group-bg: #f1f5f9;
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06);

      --navy: #132d56;
      --navy-light: #1e3a8a;
      --red-star: #dc2626;
      --border-color: #132d56;
    }

    [data-theme="dark"] {
      --app-bg: #090e17;
      --tb-bg: rgba(15, 23, 42, 0.95);
      --tb-border: #1e293b;
      --card-panel-bg: #111e33;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #162642;
      --input-border: #233f66;
      --input-focus: #38bdf8;
      --ctrl-group-bg: #0e1a2d;
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 🌟 បង្ខំឱ្យ DROPDOWN, SELECT និង BUTTON ទាំងអស់ប្រើ FONT BATTAMBANG 100% */
    .sp-btn, .sp-popup, .sp-popup *,
    .mp-btn, .mp-popup, .mp-popup *,
    .form-control, select, option,
    .panel-pill-box, .toolbar-label, .btn {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif !important;
      font-weight: 700 !important;
    }

    body {
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
      background-color: var(--app-bg);
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.45;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .f-moul { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-weight: normal; letter-spacing: 0.3px; }
    .f-bold { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 700; }
    .f-regular { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: 400; }

    /* ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ */
    .auth-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 30px 20px;
    }
    .auth-card {
      background: var(--card-panel-bg);
      border: 1.5px solid var(--tb-border);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .auth-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
    }
    .auth-card h2 { font-size: 18px; margin-bottom: 8px; color: #ef4444; font-weight: 700; }
    .auth-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
    .btn-login-redirect {
      background: linear-gradient(135deg, #0284c7, #7c3aed);
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
      cursor: pointer;
      border: none;
    }

    /* =========================================================
       🎛️ SLEEK SINGLE-ROW TOOLBAR
    ========================================================= */
    .no-print-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--tb-bg);
      backdrop-filter: blur(14px);
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      border-bottom: 1.5px solid var(--tb-border);
      transition: all 0.25s ease;
      flex-wrap: wrap;
    }

    .tb-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }
    .tb-actions { margin-left: 0; }

    .panel-pill-box {
      background: var(--ctrl-group-bg);
      border: 1px solid var(--tb-border);
      border-radius: 9px;
      padding: 3px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .toolbar-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .form-control {
      padding: 4px 7px;
      font-size: 12.5px;
      font-weight: 700;
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: all 0.2s ease;
      height: 30px;
    }
    .form-control:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }

    .btn {
      padding: 4px 11px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      white-space: nowrap;
      height: 30px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 2px 7px rgba(16, 185, 129, 0.25);
    }
    .btn-purple {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      box-shadow: 0 2px 7px rgba(124, 58, 237, 0.25);
    }
    .btn-toggle {
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      box-shadow: 0 2px 7px rgba(5, 150, 105, 0.25);
    }

    /* =========================================================
       🌟 1. CUSTOM MONTH PICKER (រចនាដូចរូបភាព ១០០%)
    ========================================================= */
    .mp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 86px;
      height: 30px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-main);
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .mp-btn:hover, .mp-btn.open {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
    }
    .mp-btn-label {
      white-space: nowrap;
    }
    .mp-chev {
      font-size: 10px;
      color: #0284c7;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .mp-btn.open .mp-chev {
      transform: rotate(180deg);
    }

    .mp-popup {
      display: none;
      position: fixed;
      z-index: 99999;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      padding: 8px 6px;
      width: 140px;
      animation: mpIn 0.15s ease-out;
    }
    .mp-popup.show { display: block; }
    @keyframes mpIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mp-list {
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .mp-list::-webkit-scrollbar { width: 4px; }
    .mp-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .mp-item {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 9px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 1px solid #f1f5f9;
      transition: all 0.15s ease;
    }
    .mp-item:last-child {
      border-bottom: none;
    }
    .mp-item:hover {
      background: #f8fafc;
      color: #0284c7;
    }
    .mp-item.active {
      background: #e0f2fe !important;
      color: #0284c7 !important;
      border-bottom-color: transparent;
    }
    .mp-item .fa-check {
      display: none;
      position: absolute;
      right: 12px;
      font-size: 11px;
      color: #0284c7;
    }
    .mp-item.active .fa-check {
      display: inline;
    }

    /* =========================================================
       🔎 2. CUSTOM STUDENT PICKER
    ========================================================= */
    .sp-btn {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
      min-width: 150px; max-width: 210px; height: 30px; padding: 4px 10px;
      font-size: 12.5px; font-weight: 700; color: var(--text-main);
      background: var(--input-bg); border: 1.5px solid var(--input-border);
      border-radius: 7px; cursor: pointer; outline: none; transition: all 0.2s ease;
    }
    .sp-btn:hover, .sp-btn.open { border-color: var(--input-focus); box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15); }
    .sp-btn-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-chev { font-size: 10px; color: #0284c7; transition: transform 0.2s ease; flex-shrink: 0; }
    .sp-btn.open .sp-chev { transform: rotate(180deg); }

    .sp-popup {
      display: none; position: fixed; z-index: 99999;
      background: var(--card-panel-bg); color: var(--text-main);
      border: 1px solid var(--tb-border); border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      padding: 8px; animation: spIn 0.15s ease-out;
    }
    .sp-popup.show { display: block; }
    @keyframes spIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .sp-search {
      display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 38px;
      background: var(--input-bg); border: 1.5px solid var(--input-border);
      border-radius: 12px; margin-bottom: 6px;
    }
    .sp-search:focus-within { border-color: var(--input-focus); }
    .sp-search i { color: var(--text-muted); font-size: 12px; }
    .sp-search input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent;
      color: var(--text-main); font-size: 13px; font-weight: 700;
    }
    .sp-list { position: relative; overflow-y: auto; scrollbar-width: thin; }
    .sp-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; border-radius: 12px; cursor: pointer;
      font-size: 14px; font-weight: 700; color: var(--text-main);
    }
    .sp-item:hover { background: var(--ctrl-group-bg); }
    .sp-item.active { background: rgba(2, 132, 199, 0.15); color: #0284c7; }
    .sp-item .fa-check { display: none; font-size: 13px; }
    .sp-item.active .fa-check { display: inline; }
    .sp-empty { padding: 18px 10px; text-align: center; color: var(--text-muted); font-size: 13px; font-weight: 700; }

    /* =========================================================
       📅 ប្រតិទិនជ្រើសថ្ងៃហត្ថលេខា
    ========================================================= */
    .dt-btn {
      display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
      min-width: 118px; height: 30px; padding: 4px 10px; font-size: 12.5px; font-weight: 700;
      color: var(--text-main); background: var(--input-bg); border: 1.5px solid var(--input-border);
      border-radius: 7px; cursor: pointer; outline: none; transition: all 0.2s ease;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif;
    }
    .dt-btn:hover, .dt-btn.open { border-color: var(--input-focus); box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15); }
    .dt-btn .dt-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dt-btn .dt-chev { font-size: 10px; color: #0284c7; transition: transform 0.2s ease; flex-shrink: 0; }
    .dt-btn.open .dt-chev { transform: rotate(180deg); }

    .cal-popup, .cal-popup * { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; }
    .cal-popup {
      display: none; position: fixed; z-index: 99999; width: 340px; max-width: calc(100vw - 16px);
      background: var(--card-panel-bg); color: var(--text-main);
      border: 1px solid var(--tb-border); border-radius: 20px; overflow: hidden;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.35); max-height: calc(100vh - 20px); overflow-y: auto;
    }
    .cal-popup.show { display: block; }
    .cal-hero { background: linear-gradient(135deg, #132d56 0%, #1e3a8a 60%, #7c1d3a 130%); color: #fff; padding: 14px 14px 12px; }
    .cal-hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .cal-title { text-align: center; flex: 1; min-width: 0; }
    .cal-month { font-family: 'Moul', cursive !important; font-weight: normal !important; font-size: 17px; line-height: 1.6; }
    .cal-sub { font-size: 11.5px; opacity: .85; line-height: 1.4; font-weight: 400 !important; }
    .cal-nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.12); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .cal-nav:hover { background: rgba(255,255,255,.25); }
    .cal-role { margin-top: 8px; font-size: 12px; opacity: .9; text-align: center; }
    .cal-sel { margin-top: 6px; background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px 10px; font-size: 13px; line-height: 1.55; text-align: center; min-height: 40px; }
    .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-dow { padding: 8px 8px 2px; }
    .cal-dow div { text-align: center; font-size: 12px; color: var(--text-muted); padding: 2px 0; }
    .cal-dow div:first-child { color: #dc2626; }
    .cal-grid { padding: 2px 8px 8px; gap: 2px; }
    .cal-day { position: relative; border: none; background: transparent; color: var(--text-main); cursor: pointer; border-radius: 12px; padding: 4px 0 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 46px; line-height: 1.15; transition: background .12s ease; }
    .cal-day .n { font-size: 15px; font-weight: 700; }
    .cal-day .l { font-size: 9.5px; color: var(--text-muted); margin-top: 1px; white-space: nowrap; font-weight: 400; }
    .cal-day.sun .n { color: #dc2626; }
    .cal-day.out { opacity: .38; }
    .cal-day:hover { background: var(--ctrl-group-bg); }
    .cal-day.holy .l { color: #b45309; font-weight: 700; }
    .cal-day.holy::after { content: ''; position: absolute; top: 4px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: #f59e0b; }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--input-focus); }
    .cal-day.sel { background: linear-gradient(135deg, #e11d48, #be123c); color: #fff; box-shadow: 0 4px 12px rgba(225, 29, 72, .35); }
    .cal-day.sel .n, .cal-day.sel .l { color: #fff; }
    .cal-day.sel::after { background: #fde68a; }
    .cal-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 12px 12px; border-top: 1px solid var(--tb-border); }
    .cal-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--tb-border); background: var(--ctrl-group-bg); color: var(--text-main); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
    .cal-btn:hover { border-color: var(--input-focus); }
    .cal-blank { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; color: var(--text-muted); font-weight: 400; }

    /* =========================================================
       📱 RESPONSIVE ADJUSTMENTS
    ========================================================= */
    /* ទំហំកណ្តាល ៖ បង្រួមឱ្យនៅជួរតែមួយ (លាក់អក្សរ label រក្សាតែរូបតំណាង) */
    @media screen and (min-width: 721px) and (max-width: 1320px) {
      .no-print-bar { padding: 6px 10px; gap: 6px; }
      .toolbar-label .lbl { display: none; }
      .tb-filters { flex: 1 1 auto; }
      .sp-btn { min-width: 120px; max-width: 170px; }
      .mp-btn { min-width: 72px; }
      .dt-btn { min-width: 100px; }
      .btn { padding: 4px 9px; }
    }
    /* ទំហំតូចជាង ១០០០px ៖ ប៊ូតុងមុខងារបង្ហាញតែរូបតំណាង ដើម្បីឱ្យនៅជួរតែមួយ */
    @media screen and (min-width: 721px) and (max-width: 1000px) {
      .tb-actions .btn span { display: none; }
      .tb-actions .btn { padding: 4px 10px; min-width: 34px; justify-content: center; }
      .sp-btn { min-width: 100px; max-width: 130px; }
      .mp-btn { min-width: 64px; }
      .dt-btn { min-width: 88px; padding: 4px 7px; }
      .tb-group { gap: 4px; }
      .panel-pill-box { padding: 3px 5px; }
    }
    @media screen and (max-width: 720px) {
      body { padding-bottom: 40px; }
      .no-print-bar { padding: 6px 8px; gap: 6px; }
      .tb-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px; width: 100%; }
      .tb-filters .panel-pill-box { display: flex; width: 100%; flex-wrap: wrap; }
      .tb-filters .panel-pill-box[style*="display:none"], .tb-filters .panel-pill-box[style*="display: none"] { display: none !important; }
      .tb-filters .sp-btn, .tb-filters .mp-btn, .tb-filters .form-control, .tb-filters .dt-btn { flex: 1 1 auto; min-width: 0; max-width: none; width: auto; }
      .tb-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
      .tb-actions .btn { width: 100%; justify-content: center; padding: 2px 6px; }
      .form-control, .btn, .sp-btn, .mp-btn, .dt-btn { height: 34px; font-size: 12.5px; }
      .preview-wrapper { padding: 10px 4px; gap: 14px; }
    }
    @media screen and (max-width: 420px) {
      .toolbar-label .lbl { display: none; }
    }

    /* =========================================================
       📄 BOOKLET PREVIEW (សៀវភៅតាមដានការសិក្សា)
    ========================================================= */
    .preview-wrapper {
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      transform-origin: top center;
    }

    .booklet-container {
      background: #ffffff !important;
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      min-height: 210mm;
      padding: 6mm 7.5mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr);
      gap: 7mm;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      page-break-after: always;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .page-box {
      border: 3.5px double var(--navy);
      padding: 13px 18px 10px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      position: relative;
      background: #ffffff !important;
      color: var(--navy) !important;
    }

    .header-text { text-align: center; color: var(--navy); }
    .header-text h2 { font-size: 17.5px; margin-bottom: 2px; line-height: 1.3; }
    .header-text h3 { font-size: 15.5px; margin-bottom: 2px; line-height: 1.3; }

    .cover-title-block h3 { font-size: 15.5px; margin-bottom: 10px; }

    }

    .cover-footer { text-align: center; font-size: 21px; color: var(--navy); margin-top: 6px; margin-bottom: 2px; }

    .report-meta-grid {
      display: grid; grid-template-columns: auto 1fr; column-gap: 8px; row-gap: 2px; margin: 2px 0 4px 0; font-size: 13.5px; color: var(--navy);
    }

    .score-table {
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
      text-align: center; 
      margin-bottom: 3px; 
      border: 1.4px solid var(--navy) !important; 
      table-layout: fixed;
      background: #ffffff !important;

      background: #ffffff !important;
      color: var(--navy) !important;
    }

      background-color: #f8fafc !important; 
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; 
      font-weight: bold; 
      color: var(--navy) !important; 
      font-size: 13.5px; 
    }
    .score-table td.subject-name {
      text-align: left; padding-left: 7px; font-size: 13px; color: var(--navy) !important;
      font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

    .summary-row { display: flex; justify-content: space-between; flex-wrap: wrap; }

    .signature-grid {
      display: grid; grid-template-columns: 1.4fr 0.8fr 1.5fr; text-align: center; font-size: 12px; margin-top: 14px; align-items: start; color: var(--navy);
    }
    .sig-col { display: flex; flex-direction: column; align-items: center; }
    .sig-lunar { font-size: 9px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; line-height: 1.25; white-space: nowrap; }
    .sig-solar { font-size: 9.5px; font-style: italic; font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; margin-bottom: 2px; line-height: 1.25; white-space: nowrap; }
    .sig-title { font-family: 'Khmer OS Muol Light', 'Moul', cursive; font-size: 11.5px; color: var(--navy); white-space: nowrap; }
    .sig-name { font-family: 'Khmer OS Battambang', 'Battambang', sans-serif; font-weight: bold; font-size: 13.5px; margin-top: 38px; white-space: nowrap; }

    .score-table tbody tr { height: 22px; }
    .score-table tbody td { height: 22px; line-height: 20px; overflow: hidden; }
    .score-table tbody td.val-cell { font-size: 14px; line-height: 20px; padding: 0 !important; }

    @media print {
      html, body { background: none !important; padding: 0 !important; margin: 0 !important; width: 297mm; height: 210mm; }

      .preview-wrapper { padding: 0 !important; gap: 0 !important; zoom: 1 !important; transform: none !important; }
      .booklet-container {

    .btn-back{background:var(--ctrl-group-bg,#f1f5f9);color:var(--text-main,#0f172a);border:1px solid var(--input-border,#cbd5e1);font-family:'Battambang',sans-serif;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}

  <!-- ══════════════ 🔒 AUTH DENIED WRAPPER ══════════════ -->
  <div class="auth-wrapper" id="authDeniedWrap">
    <div class="auth-card">
      <div class="auth-icon">🔒</div>
      <h2>សូមចូលប្រើប្រាស់ជាមុនសិន!</h2>
      <p>លោកអ្នកមិនទាន់បាន Login ចូលក្នុងប្រព័ន្ធនៅឡើយទេ។ សូម Login គណនីរបស់អ្នកដើម្បីមើលសៀវភៅតាមដានការសិក្សា។</p>
      <a href="index.html" target="_top" class="btn-login-redirect" onclick="goToIndex(event)">
        <span>🔑</span> <span>ទៅកាន់ទំព័រដើម (Login)</span>
      </a>
    </div>
  </div>

  <!-- =========================================================
       🎛️ NEW SINGLE-ROW SLEEK TOOLBAR DESIGN
  ========================================================= -->
  <div class="no-print-bar" id="controlToolbar" style="display:none;">
    
    <!-- ផ្នែកខាងឆ្វេង ៖ ជម្រើសទិន្នន័យ (Filters) -->
    <div class="tb-group tb-filters">
      <button type="button" class="btn btn-back" onclick="goBackToReports()" title="ត្រឡប់ទៅបញ្ជីរបាយការណ៍"><i class="fa-solid fa-arrow-left"></i> <span>ត្រឡប់</span></button>
      <!-- 🌟 ថ្នាក់៖ បង្ហាញតែសម្រាប់ ADMIN ប៉ុណ្ណោះ (គ្រូមិនបាច់បង្ហាញឡើយ) -->
      <div class="panel-pill-box" id="adminClassBox" style="display:none;">
        <span class="toolbar-label"><i class="fa-solid fa-graduation-cap" style="color:#0284c7;"></i> <span class="lbl">ថ្នាក់៖</span></span>
        <button type="button" class="mp-btn" id="cpBtn" onclick="toggleClassPicker(event)" style="min-width:130px;">
          <span class="mp-btn-label" id="cpLabel">កំពុងទាញយក...</span>
          <i class="fa-solid fa-chevron-down mp-chev"></i>
        </button>
        <select id="classSelect" style="display:none;" onchange="onClassChange()">
          <option value="">កំពុងទាញយក...</option>
        </select>
      </div>

      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-calendar-days" style="color:#f59e0b;"></i> <span class="lbl">ខែ៖</span></span>
        <button type="button" class="mp-btn" id="mpBtn" onclick="toggleMonthPicker(event)">
          <span class="mp-btn-label" id="mpLabel">តុលា</span>
          <i class="fa-solid fa-chevron-down mp-chev" id="mpChev"></i>
        </button>
        <input type="hidden" id="monthSelect" value="តុលា">
      </div>

      <div class="panel-pill-box">
        <span class="toolbar-label"><i class="fa-solid fa-user" style="color:#10b981;"></i> <span class="lbl">សិស្ស៖</span></span>
        <button type="button" class="sp-btn" id="spBtn" onclick="toggleStudentPicker(event)">
          <span class="sp-btn-label" id="spLabel">🏫 ទាំងថ្នាក់ (ទាំងអស់)</span>
          <i class="fa-solid fa-chevron-down sp-chev"></i>
        </button>
        <select id="studentSelect" style="display:none;" onchange="renderFilteredView()">
          <option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>
        </select>
      </div>

        <span class="toolbar-label"><i class="fa-solid fa-signature" style="color:#e11d48;"></i> <span class="lbl">ថ្ងៃហត្ថលេខា៖</span></span>

  <div class="cal-popup" id="calPopup" onclick="event.stopPropagation()" role="dialog" aria-label="ជ្រើសរើសថ្ងៃខែហត្ថលេខា">

    </div>
    <div class="sp-list" id="spList"></div>
  </div>

  <div class="preview-wrapper" id="reportContainer" style="display:none;">
    <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
      <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>

      document.getElementById('monthSelect').value = m;
      document.getElementById('mpLabel').textContent = m;
      closeMonthPicker();
      loadReportData();
    }

    function closeMonthPicker() {
      document.getElementById('mpPopup')?.classList.remove('show');
      document.getElementById('mpBtn')?.classList.remove('open');
    }

    /* 3.6 SEARCHABLE STUDENT PICKER */
    function updateSpLabel() {
      const sel = document.getElementById('studentSelect');
      const cur = sel.options[sel.selectedIndex];
      document.getElementById('spLabel').textContent = cur ? cur.textContent : 'ជ្រើសរើសសិស្ស';
    }

    function renderSpList(query) {
      const sel = document.getElementById('studentSelect');
      const list = document.getElementById('spList');
      const q = String(query || '').trim().toLowerCase();
      list.innerHTML = '';
      let count = 0;
      Array.from(sel.options).forEach(opt => {
        const label = opt.textContent;
        if (q && !label.toLowerCase().includes(q)) return;
        const item = document.createElement('div');
        item.className = 'sp-item' + (opt.value === sel.value ? ' active' : '');
        const span = document.createElement('span');
        span.textContent = label;
        const chk = document.createElement('i');
        chk.className = 'fa-solid fa-check';
        item.appendChild(span);
        item.appendChild(chk);
        item.addEventListener('click', () => chooseStudent(opt.value));
        list.appendChild(item);
        count++;
      });
      if (!count) {
        const empty = document.createElement('div');
        empty.className = 'sp-empty';
        empty.textContent = 'រកមិនឃើញសិស្សទេ';
        list.appendChild(empty);
      }
    }

    function chooseStudent(value) {
      const sel = document.getElementById('studentSelect');
      sel.value = value;
      updateSpLabel();
      closeStudentPicker();
      renderFilteredView();
    }

    function closeStudentPicker() {
      document.getElementById('spPopup')?.classList.remove('show');
      document.getElementById('spBtn')?.classList.remove('open');
    }

    function toggleStudentPicker(e) {
      if (e) e.stopPropagation();
      closeMonthPicker();
      closeCalPopup();
      closeClassPicker();
      const pop = document.getElementById('spPopup');
      if (pop.classList.contains('show')) { closeStudentPicker(); return; }

      const btn = document.getElementById('spBtn');
      const input = document.getElementById('spInput');
      const list = document.getElementById('spList');
      input.value = '';
      renderSpList('');

      const r = btn.getBoundingClientRect();
      const w = Math.min(Math.max(r.width, 290), window.innerWidth - 16);
      pop.style.width = w + 'px';
      pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
      pop.style.top = (r.bottom + 6) + 'px';
      list.style.maxHeight = Math.max(160, Math.min(320, window.innerHeight - r.bottom - 90)) + 'px';

      pop.classList.add('show');
      btn.classList.add('open');

      const act = list.querySelector('.sp-item.active');
      if (act) list.scrollTop = act.offsetTop - list.clientHeight / 2 + act.clientHeight / 2;
      setTimeout(() => input.focus(), 30);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#spPopup') && !e.target.closest('#spBtn')) closeStudentPicker();
      if (!e.target.closest('#mpPopup') && !e.target.closest('#mpBtn')) closeMonthPicker();
    });
    document.addEventListener('keydown', (e) => { 
      if (e.key === 'Escape') {
        closeStudentPicker(); 
        closeMonthPicker();
      }
    });
    document.getElementById('controlToolbar').addEventListener('scroll', () => {
      closeStudentPicker();
      closeMonthPicker();
    });

    /* =========================================================
       4. CLASS SELECTOR (🌟 ADMIN ទើបបង្ហាញ គ្រូមិនបាច់បង្ហាញ)
    ========================================================= */
    async function initClasses() {
      const adminBox = document.getElementById('adminClassBox');
      const select = document.getElementById('classSelect');
      const cleanCls = cleanGrade(USER_CLASS);

      if (!IS_ADMIN) {
        // 🌟 បើជាគ្រូ លាក់ប្រអប់ថ្នាក់ទាំងស្រុង មិនបាច់បង្ហាញលើ Toolbar ឡើយ
        if (adminBox) adminBox.style.display = 'none';

        if (cleanCls) {
          select.innerHTML = `<option value="${cleanCls}">ថ្នាក់ទី ${cleanCls}</option>`;
          select.value = cleanCls;
          syncClassLabel();
          currentClassName = cleanCls;
          onClassChange();
        } else {
          document.getElementById('reportContainer').innerHTML = 
            '<div style="text-align:center; padding:50px; color:#f59e0b; font-weight:700;">⚠️ គណនីរបស់អ្នកមិនទាន់មានថ្នាក់ទទួលបន្ទុកឡើយ។ សូមទាក់ទង Admin។</div>';
        }
        return;
      }

      // 🌟 ប្រសិនបើជា Admin ទើបបង្ហាញប្រអប់ជ្រើសរើសថ្នាក់
      if (adminBox) adminBox.style.display = 'inline-flex';

      try {
        const { data, error } = await sb.from('students').select('grade');
        let classes = [];
        if (!error && data) {
          classes = [...new Set(data.map(d => cleanGrade(d.grade)).filter(Boolean))];
        }
        if (!classes.length) classes = ['១', '២', '៣', '៤(ក)', '៤(ខ)', '៥', '៦'];

        select.innerHTML = classes.map(c => `<option value="${c}">ថ្នាក់ទី ${c}</option>`).join('');
        if (cleanCls && classes.includes(cleanCls)) select.value = cleanCls;
        syncClassLabel();
        onClassChange();
      } catch (err) {
        select.innerHTML = '<option value="">កំហុសទាញយកថ្នាក់</option>';
        syncClassLabel();
      }
    }

    function onClassChange() {
      syncClassLabel();
      currentClassName = document.getElementById('classSelect').value || cleanGrade(USER_CLASS);
      if (!currentClassName) return;
      loadReportData();
    }

    /* 5. FETCH BUNDLE DATA */
    async function loadReportData() {
      const cls = currentClassName || document.getElementById('classSelect').value || cleanGrade(USER_CLASS);
      const month = document.getElementById('monthSelect').value;
      if (!cls || !month) return;

      const curPure = cleanGrade(cls);
      document.getElementById('reportContainer').innerHTML = `
        <div style="color:var(--text-muted); text-align: center; padding: 60px 20px; font-size: 15px; font-weight: 600;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color:#0284c7;"></i>
          <p style="margin-top:12px;">កំពុងទាញយកទិន្នន័យថ្នាក់ទី ${curPure} (ខែ${month})...</p>
        </div>`;

      try {
        const { data: stList, error: stErr } = await sb
          .from('students')
          .select('*')
          .order('id', { ascending: true });

        if (stErr) throw stErr;

        const isSem2 = ['ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា'].includes(month);
        allStudentsData = (stList || [])
          .filter(s => cleanGrade(s.grade) === curPure)
          .filter(s => {
            const drop = String(s.dropout_semester || '').trim();
            if (isSem2 && (drop.includes('ឆមាស១') || drop.includes('ឆមាសទី១') || drop === '១')) return false;
            return true;
          })
          .map(s => ({
            id: String(s.student_id || s.id),
            name: s.student_name || 'គ្មានឈ្មោះ',
            sex: s.gender || 'ប្រុស',
            dob: s.dob || '',
            pob: s.pob || '',
            address: s.address || '',
            father: s.father_name || '',
            fatherJob: s.father_job || '',
            mother: s.mother_name || '',
            motherJob: s.mother_job || '',
            guardian: s.guardian || s.father_name || s.mother_name || '',
            guardianJob: s.guardian_job || s.father_job || s.mother_job || ''
          }));

        if (!allStudentsData.length) {
          document.getElementById('reportContainer').innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px;">មិនមានទិន្នន័យសិស្សក្នុងថ្នាក់នេះឡើយ</div>';
          return;
        }

        const studentIds = allStudentsData.map(s => s.id);

        const { data: scList, error: scErr } = await sb
          .from('scores')
          .select('student_id, scores, total, average, rank, grade_label')
          .eq('assigned_class', curPure)
          .eq('score_type', 'monthly')
          .eq('period', month)
          .in('student_id', studentIds);

        if (scErr) console.warn("Score fetch warning:", scErr);

        classSavedScores = {};
        (scList || []).forEach(row => {
          const sid = String(row.student_id);
          const scObj = (row.scores && typeof row.scores === 'object') ? row.scores : {};
          classSavedScores[sid] = Object.assign({}, scObj, {
            total: row.total,
            avg: row.average,
            rank: row.rank,
            grade_label: row.grade_label
          });
        });

        const now = new Date();
        const year = now.getFullYear();
        const mIdx = KHMER_MONTHS.indexOf(month);
        classAttendanceMap = {};

        if (mIdx !== -1) {
          const firstDate = `${year}-${String(mIdx + 1).padStart(2, '0')}-01`;
          const lastDay = new Date(year, mIdx + 1, 0).getDate();
          const lastDate = `${year}-${String(mIdx + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

          const { data: attList } = await sb
            .from('attendance')
            .select('student_id, status')
            .eq('assigned_class', curPure)
            .gte('attendance_date', firstDate)
            .lte('attendance_date', lastDate)
            .in('status', ['A', 'C']);

          (attList || []).forEach(r => {
            const sid = String(r.student_id);
            if (!classAttendanceMap[sid]) classAttendanceMap[sid] = { totalPermission: 0, totalAbsent: 0 };
            if (r.status === 'C') classAttendanceMap[sid].totalPermission++;
            if (r.status === 'A') classAttendanceMap[sid].totalAbsent++;
          });
        }

        const sSelect = document.getElementById('studentSelect');
        sSelect.innerHTML = '<option value="ALL">🏫 ទាំងថ្នាក់ (ទាំងអស់)</option>';
        allStudentsData.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = `${s.id} - ${s.name}`;
          sSelect.appendChild(opt);
        });
        updateSpLabel();

        renderFilteredView();

      } catch (err) {
        document.getElementById('reportContainer').innerHTML = `<div style="color: #ef4444; text-align: center; padding: 40px; font-weight: 700;">❌ កំហុស៖ ${err.message}</div>`;
      }
    }

            </div>

            <div class="signature-grid">
              <div class="sig-col" style="margin-top: 8px;">
                <div>
                  ${sigDateHTML('director', month)}
                  <div class="sig-title">បានឃើញ និងឯកភាព</div>
                  <div class="f-bold" style="margin-top: 3px;">នាយកសាលា</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  <div class="sig-title">មតិរបស់មាតាបិតា</div>
                  <div class="f-bold" style="margin-top: 3px;">ឬអាណាព្យាបាលសិស្ស</div>
                </div>
              </div>

              <div class="sig-col">
                <div>
                  ${sigDateHTML('teacher', month)}
                  <div class="sig-title" style="margin-top: 3px;">គ្រូទទួលបន្ទុកថ្នាក់</div>
                </div>
                <div class="sig-name">${TEACHER_NAME || ''}</div>
              </div>
            </div>
          </div>
        `;

        booklet.appendChild(leftPage);
        booklet.appendChild(rightPage);
        container.appendChild(booklet);
      });
      setFitZoom();
    }

    function getGradeLetter(num) {
      if (num === null || isNaN(num) || num <= 0) return '';
      if (num >= 9.00) return 'A';
      if (num >= 8.00) return 'B';
      if (num >= 7.00) return 'C';
      if (num >= 6.00) return 'D';
      if (num >= 5.00) return 'E';
      return 'F';
    }
  
    function goBackToReports() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'NAVIGATE', page: 'reportsHub' }, '*');
          return;
        }
      } catch (e) {}
      window.location.href = 'index.html#reportsHub';
    }
  </script>
