<!DOCTYPE html>
<html lang="km" data-theme="light">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ថ្នាក់ និងសិស្ស - សាលាបឋមសិក្សាកំពង់ល្ពៅ</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root,[data-theme="light"]{--bg:#e8f6fb;--bg2:#f4fbf7;--surface:#fff;--card:rgba(255,255,255,.82);--border:#d3e6ef;--text:#0f172a;--muted:#5b6b80;--shadow:0 8px 24px rgba(15,23,42,.07)}
[data-theme="dark"]{--bg:#0a1220;--bg2:#0c1626;--surface:#131e33;--card:rgba(19,30,51,.88);--border:#23324d;--text:#f1f5f9;--muted:#9aa8bd;--shadow:0 8px 24px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Khmer OS Battambang','Battambang',sans-serif;background:linear-gradient(135deg,var(--bg),var(--bg2));color:var(--text);min-height:100vh;padding:18px 18px 90px;font-size:14px}
h1{font-size:21px;font-weight:800}
.sub{color:var(--muted);margin:4px 0 18px;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{--c:#0ea5e9;display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:18px;padding:16px 16px 16px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;transition:transform .12s,box-shadow .12s;min-height:96px}
.card:hover{transform:translateY(-2px)}
.card:active{transform:scale(.99)}
.ic{width:56px;height:56px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:17.5px;font-weight:800;line-height:1.3}
.tx span{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.tx i{display:inline-block;font-style:normal;margin-top:6px;font-size:13px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:2px 12px;border-radius:10px}
.ar{color:var(--muted);font-size:20px;opacity:.6}
.card.soon{opacity:.62}
.card.soon .ar{font-size:11px;font-weight:800;opacity:1;background:rgba(127,127,127,.18);padding:3px 9px;border-radius:9px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;z-index:100001;display:none}
</style>
</head>
<body>
<h1>🏫 ថ្នាក់ និងសិស្ស</h1>
<div class="sub">គ្រប់គ្រងថ្នាក់ សិស្ស មុខវិជ្ជា និងឧបករណ៍ប្រចាំថ្នាក់</div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>
<script>
function applyTheme(t){document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light')}
applyTheme(new URLSearchParams(location.search).get('theme')||'light');
window.addEventListener('message',e=>{if(e.data&&(e.data.type==='THEME_CHANGE'||e.data.theme))applyTheme(e.data.theme||e.data)});
const sb=supabase.createClient("https://nggnuobnrxiqjtcwlvwk.supabase.co","sb_publishable_AHDcUJbuMAfhaocyfm2X7w_O9s06wML");
let USER=null;try{USER=JSON.parse(localStorage.getItem('krou_supabase_user')||'null')}catch(e){}
const IS_ADMIN=String(USER&&USER.role||'').toLowerCase().trim()==='admin';
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2200)}
function go(page){try{parent.postMessage({type:'NAVIGATE',page:page},'*')}catch(e){}if(window.parent===window)location.href=page+'.html'}
/* [id, ពណ៌, icon, ចំណងជើង, ពិពណ៌នា, page ឬ null=ឆាប់ៗ] */
const CARDS=[
 ['cls','#0ea5e9','🏫','ថ្នាក់របស់ខ្ញុំ','បង្កើត និងកែថ្នាក់រៀន','my_classes'],
 ['stu','#8b5cf6','🎓','សិស្សក្នុងថ្នាក់','បញ្ជីសិស្ស ព័ត៌មាន និងប្រវត្តិសិក្សា','addStudent'],
 ['sub','#f59e0b','📖','មុខវិជ្ជា','មុខវិជ្ជា និងមេគុណ','subject'],
 ['bmi','#0284c7','⚖️','ទម្ងន់ និងកម្ពស់','វាស់តាមខែ ឬត្រីមាស · BMI · សន្ទិដ្ឋាន · បោះពុម្ពតារាង',null],
 ['cur','#8b5cf6','📚','បំណែងចែកកម្មវិធីសិក្សា','បញ្ជីមេរៀនតាមជំពូក · ខែ · សប្តាហ៍ · ទំព័រ · កែផ្ទាល់ ឬ Excel',null],
 ['cln','#10b981','🧹','វេនសម្អាត','ប្រធានថ្នាក់ · រៀបចំក្រុម · បោះពុម្ព',null],
 ['seat','#0ea5e9','🪑','ប្លង់តុសិស្ស','រៀបតុដោយដៃ ឬតាមក្បួន (កម្ពស់ · ភ្នែក · ប្រុសស្រី · អត្ថក្រុម) · បោះពុម្ពប្លង់','seating'],
 ['grp','#10b981','🎲','បង្វិលឈ្មោះ · បែងចែកក្រុម','ជ្រើសសិស្សម្នាក់ដោយចៃដន្យ ឬចែកសិស្សជាក្រុម','group'],
 ['adm','#f59e0b','📒','សៀវភៅរដ្ឋបាល','អធិការកិច្ច · ប្រជុំបច្ចេកទេស · សម្ភារៈ · ជូនដំណឹងមាតាបិតា · ផែនការប្រចាំខែ ...','book']
];
const BADGE={};
function render(){
  document.getElementById('grid').innerHTML=CARDS.map(c=>{
    const soon=!c[5],badge=BADGE[c[0]];
    return '<button type="button" class="card'+(soon?' soon':'')+'" style="--c:'+c[1]+'" onclick="'+(soon?"toast('⏳ មុខងារនេះនឹងមកដល់ឆាប់ៗ')":"go('"+c[5]+"')")+'">'
     +'<div class="ic">'+c[2]+'</div><div class="tx"><b>'+esc(c[3])+'</b><span>'+esc(c[4])+'</span>'+(badge?'<i>'+esc(badge)+'</i>':'')+'</div>'
     +'<div class="ar">'+(soon?'ឆាប់ៗ':'›')+'</div></button>';
  }).join('');
}
render();
/* ចំនួនថ្នាក់/សិស្ស (ត្រូវការ classes_multi.sql — បើមិនទាន់ run នឹងមិនបង្ហាញលេខ) */
(async()=>{
  try{
    if(!USER||!USER.username)return;
    let pw='';try{pw=localStorage.getItem('krou_pw')||''}catch(e){}
    const {data}=await sb.rpc('staff_class_list',{p_u:USER.username,p_p:pw});
    if(!data||data.error)return;
    const rows=data.rows||[];
    BADGE.cls=rows.length+' ថ្នាក់';
    if(IS_ADMIN){BADGE.stu=rows.reduce((a,r)=>a+(r.students||0),0)+' នាក់';}
    else{const act=String(data.active||'').replace(/^ថ្នាក់ទី\s*/,'').toLowerCase();const r=rows.find(x=>String(x.name).replace(/^ថ្នាក់ទី\s*/,'').toLowerCase()===act);if(r)BADGE.stu=(r.students||0)+' នាក់'}
    render();
  }catch(e){}
})();
</script>
</body>
</html>
